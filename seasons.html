<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>赛季 · Davis Origin</title>
<link rel="icon" type="image/png" href="assets/logo.png" />
<style>
  :root {
    --bg: #f7f5f0;
    --bg-soft: #fafaf7;
    --ink: #0a0e1a;
    --ink-soft: #3d4151;
    --muted: #8a8a92;
    --line: #e6e2d8;
    --accent: #1e3a8a;
    --accent-deep: #0f1d4d;
    --accent-soft: #eaf0fb;
    --gold: #c89134;
    --card: #ffffff;
    --pos-gk: #d49a2a;
    --pos-def: #1e3a8a;
    --pos-mid: #1f7a5e;
    --pos-fwd: #b04646;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 16px; line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--accent); color: #fff; }

  /* Topbar */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(247, 245, 240, 0.88);
    backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 1400px; margin: 0 auto;
    padding: 18px 40px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; }
  .brand-mark {
    width: 40px; height: 40px; object-fit: contain;
    transition: transform .4s cubic-bezier(.4,0,.2,1);
  }
  .brand:hover .brand-mark { transform: rotate(-10deg) scale(1.08); }
  .brand-name { font-size: 16px; }
  .brand-sub { color: var(--muted); font-size: 12px; margin-left: 6px; font-weight: 400; }
  .back-link {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px; border: 1px solid var(--line);
    border-radius: 999px; font-size: 13px;
    color: var(--ink-soft); background: var(--bg-soft);
    transition: all .3s ease;
  }
  .back-link:hover {
    border-color: var(--accent); color: var(--accent);
    background: var(--accent-soft); transform: translateX(-3px);
  }

  /* Hero */
  .page-hero {
    max-width: 1080px; margin: 0 auto;
    padding: 96px 40px 40px;
  }
  .page-eyebrow {
    font-size: 12px; font-weight: 700;
    letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 22px;
    display: flex; align-items: center; gap: 14px;
    animation: fadeUp .8s ease both;
  }
  .page-eyebrow::before {
    content: ''; width: 36px; height: 1.5px; background: var(--accent);
  }
  .page-title {
    font-size: clamp(56px, 9vw, 112px);
    font-weight: 900; letter-spacing: -0.04em;
    line-height: 0.95; margin-bottom: 24px;
    animation: fadeUp .9s ease .1s both;
  }
  .page-title em { font-style: italic; font-weight: 400; color: var(--accent); }
  .page-lede {
    font-size: 18px; color: var(--ink-soft);
    max-width: 600px;
    animation: fadeUp .9s ease .2s both;
  }
  /* ===== Season archive ===== */
  .season-archive {
    max-width: 1080px;
    margin: 0 auto;
    padding: 32px 40px 96px;
  }
  /* ===== 赛季切换：竖直滚轮（上赛季 / 当前赛季 / 下赛季） ===== */
  .season-wheel-wrap { position: relative; max-width: 320px; margin: 0 auto 32px; }
  .season-wheel {
    border-radius: 24px; overflow: hidden; position: relative; user-select: none;
    background: rgba(255,255,255,.5); border: 1px solid var(--line);
    box-shadow: 0 12px 34px rgba(15,29,77,.10);
  }
  .wheel-mask { height: 174px; overflow: hidden; position: relative; }
  .wheel-track { position: absolute; left: 0; right: 0; top: 0; }
  .wheel-item {
    height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; cursor: pointer;
  }
  .wheel-item--empty, .wheel-spacer { visibility: hidden; pointer-events: none; cursor: default; }
  .wheel-prev, .wheel-next { color: var(--muted); transition: color .2s ease; }
  .wheel-prev:hover, .wheel-next:hover { color: var(--accent); }
  .wheel-item-tag {
    font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: inherit; opacity: .8;
  }
  .wheel-item-label { font-size: 14px; font-weight: 700; color: inherit; }
  .wheel-current { cursor: default; }
  .wheel-pill {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 11px 30px; border-radius: 999px; cursor: pointer;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
    color: #fff; box-shadow: 0 12px 28px rgba(30,58,138,.35);
    font-size: 16px; font-weight: 800;
    transition: transform .15s ease, box-shadow .25s ease;
  }
  .wheel-pill:hover { box-shadow: 0 14px 32px rgba(30,58,138,.42); }
  .wheel-pill:active { transform: scale(.97); }
  .wheel-pill-tag {
    font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    background: rgba(255,255,255,.28); padding: 2px 9px; border-radius: 999px;
  }

  .season-wheel-dropdown {
    position: absolute; top: calc(100% + 10px); left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: 0 18px 44px rgba(15,29,77,.18); padding: 8px; z-index: 30;
    display: flex; flex-direction: column; gap: 2px; min-width: 190px;
    animation: fadeUp .2s ease both;
  }
  .season-wheel-dropdown[hidden] { display: none; }
  .season-wheel-dropdown-item {
    padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600;
    color: var(--ink-soft); cursor: pointer; text-align: center;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .2s ease, color .2s ease;
  }
  .season-wheel-dropdown-item:hover { background: var(--accent-soft); color: var(--accent); }
  .season-wheel-dropdown-item.active { background: var(--accent-deep); color: #fff; }
  .season-wheel-dropdown-item .tag { font-size: 9px; opacity: .85; }

  @keyframes panelEnter {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .season-archive-body.enter { animation: panelEnter .4s ease both; }

  .season-highlights { list-style: none; margin: 0 0 32px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .season-highlights li { position: relative; padding-left: 22px; font-size: 15px; color: var(--ink); line-height: 1.6; }
  .season-highlights li::before {
    content: ''; position: absolute; left: 0; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold);
  }

  /* ===== 一队 / 预备队 切换（和赛季滚轮同一套视觉语言） ===== */
  .team-tabs {
    display: flex; gap: 6px; margin: 0 auto 28px; width: fit-content;
    background: rgba(255,255,255,.5); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px;
    backdrop-filter: blur(14px) saturate(180%);
    -webkit-backdrop-filter: blur(14px) saturate(180%);
    box-shadow: 0 8px 24px rgba(15,29,77,.08);
  }
  .team-tab {
    background: transparent; border: none; border-radius: 999px;
    padding: 13px 34px; font-size: 15px; font-weight: 800; color: var(--ink-soft);
    cursor: pointer; font-family: inherit; transition: all .25s ease;
  }
  .team-tab:hover { color: var(--accent); }
  .team-tab.active {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
    color: #fff; box-shadow: 0 10px 26px rgba(30,58,138,.32);
  }
  .team-note {
    font-size: 14px; color: var(--ink-soft); background: var(--accent-soft);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; margin-bottom: 24px;
  }

  .archive-empty-note {
    font-size: 14px; color: var(--muted); background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px;
  }

  /* 比赛板块 */
  .matches-section + .matches-section { margin-top: 28px; }
  .matches-section-title {
    font-size: 12.5px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 12px; display: flex; align-items: center; gap: 10px;
  }
  .matches-section-title::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .matches-section-note {
    font-size: 14px; color: var(--ink-soft); line-height: 1.8; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px;
  }
  .match-item + .match-item { margin-top: 10px; }
  .match-row {
    display: grid; grid-template-columns: minmax(96px, 1fr) 2fr; gap: 20px;
    padding: 16px; border-radius: 14px; background: var(--bg-soft);
    align-items: start;
  }
  .match-lineup-col { display: flex; flex-direction: column; gap: 6px; }
  .lineup-pill {
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 12px; text-align: center; font-size: 12px; color: var(--ink-soft);
  }
  .lineup-empty { font-size: 12.5px; color: var(--muted); font-style: italic; padding: 8px 2px; }
  .match-info-col { display: grid; grid-template-columns: 84px 1fr auto; gap: 16px; align-items: center; }
  .match-date-col { font-variant-numeric: tabular-nums; }
  .match-date-day { font-size: 14px; font-weight: 700; color: var(--ink); }
  .match-date-time { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .match-teams { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .match-team { font-size: 15px; font-weight: 500; color: var(--ink-soft); }
  .match-team.davis { color: var(--ink); font-weight: 600; }
  .match-team.winner { color: var(--accent); font-weight: 800; }
  .match-score {
    display: inline-flex; align-items: center; padding: 5px 12px;
    background: var(--accent-soft); color: var(--accent); border-radius: 7px;
    font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums;
  }
  .match-result {
    font-size: 12px; font-weight: 800; color: var(--accent);
    width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft);
    display: grid; place-items: center;
  }
  .match-result.draw { background: rgba(140,140,148,0.12); color: var(--ink-soft); }
  .match-result.loss { background: rgba(176, 70, 70, 0.12); color: #b04646; }

  /* Footer */
  footer {
    padding: 40px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    background: var(--bg);
    border-top: 1px solid var(--line);
  }
  footer .slogan-cn {
    font-size: 14px;
    color: var(--ink-soft);
    margin-bottom: 8px;
    letter-spacing: 0.08em;
    font-weight: 500;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 720px) {
    .topbar-inner { padding: 14px 20px; }
    .back-link { padding: 8px 12px; font-size: 12px; }
    .page-hero { padding: 56px 22px 24px; }
    .page-lede { font-size: 15px; }
    .season-archive { padding: 24px 22px 64px; }
    .season-wheel-wrap { max-width: 100%; }
    .wheel-pill { padding: 9px 22px; font-size: 14px; }
    .team-tab { padding: 11px 22px; font-size: 13.5px; }
    .match-row { grid-template-columns: 1fr; gap: 12px; padding: 14px; }
    .match-info-col { grid-template-columns: 70px 1fr auto; gap: 10px; }
    .match-team { font-size: 13.5px; }
    .match-score { font-size: 13px; padding: 4px 9px; }
    .match-result { width: 26px; height: 26px; font-size: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <img class="brand-mark" src="assets/logo.png" alt="Davis Origin Logo" />
      <div>
        <div class="brand-name">Davis Origin<span class="brand-sub">戴维斯原点</span></div>
      </div>
    </a>
    <a class="back-link" href="index.html">← 返回主页</a>
  </div>
</header>

<section class="page-hero">
  <div class="page-eyebrow">Seasons · 赛季</div>
  <h1 class="page-title">Seasons<em>.</em></h1>
  <p class="page-lede">Davis Origin · 戴维斯原点足球俱乐部</p>
</section>

<section class="season-archive">
  <div class="season-wheel-wrap" id="seasonWheelWrap">
    <div class="season-wheel" id="seasonWheel" role="group" aria-label="选择赛季">
      <div class="wheel-mask"><div class="wheel-track" id="wheelTrack"></div></div>
    </div>
    <div class="season-wheel-dropdown" id="seasonWheelDropdown" hidden></div>
  </div>
  <div class="season-archive-body" id="seasonArchiveBody"></div>
</section>

<footer>
  <div class="slogan-cn">岂曰无衣？与子同袍。</div>
  © Davis Origin · 戴维斯原点足球俱乐部 · UC Davis
</footer>

<script src="seasons.js"></script>
<script>
  (function() {
    var wheelEl = document.getElementById('seasonWheel');
    var track = document.getElementById('wheelTrack');
    var wheelDropdown = document.getElementById('seasonWheelDropdown');
    var bodyEl = document.getElementById('seasonArchiveBody');
    if (!wheelEl || !track || !wheelDropdown || !bodyEl || !window.SEASON_DATA) return;
    var seasons = (window.SEASON_DATA.seasons || []).slice().reverse(); // 按时间从早到晚显示
    if (!seasons.length) return;

    var POSITION_ORDER = ['gk', 'def', 'mid', 'fwd'];
    var CATEGORY_ORDER = ['league', 'huati', 'xinnian'];
    var TEAM_ORDER = ['first', 'reserve'];
    var TEAM_FALLBACK_LABEL = { first: '一队', reserve: '预备队' };

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function(c) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
      });
    }
    function resultLabel(result) {
      if (result === 'win') return 'W';
      if (result === 'draw') return 'D';
      if (result === 'loss') return 'L';
      return '–';
    }
    function teamSpan(team) {
      var cls = 'match-team' + (team.davis ? ' davis' : '') + (team.winner ? ' winner' : '');
      return '<span class="' + cls + '">' + escapeHtml(team.name) + '</span>';
    }
    function matchRowHtml(m) {
      var resultCls = 'match-result' + (m.result !== 'win' ? ' ' + m.result : '');
      var lineup = m.lineup || [];
      var lineupInner = lineup.length
        ? lineup.map(function(name) { return '<div class="lineup-pill">' + escapeHtml(name) + '</div>'; }).join('')
        : '<div class="lineup-empty">出场名单整理中</div>';
      return '<div class="match-item">' +
        '<div class="match-row">' +
          '<div class="match-lineup-col">' + lineupInner + '</div>' +
          '<div class="match-info-col">' +
            '<div class="match-date-col">' +
              '<div class="match-date-day">' + escapeHtml(m.date) + '</div>' +
              '<div class="match-date-time">' + escapeHtml(m.time || '') + '</div>' +
            '</div>' +
            '<div class="match-teams">' +
              teamSpan(m.team1) +
              '<span class="match-score">' + escapeHtml(m.score) + '</span>' +
              teamSpan(m.team2) +
            '</div>' +
            '<div class="' + resultCls + '">' + resultLabel(m.result) + '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }
    function categorySectionHtml(cat) {
      if (!cat) return '';
      var hasMatches = cat.matches && cat.matches.length;
      if (!hasMatches && !cat.note) return '';
      var body = hasMatches
        ? cat.matches.map(matchRowHtml).join('')
        : '<div class="matches-section-note">' + escapeHtml(cat.note) + '</div>';
      return '<div class="matches-section">' +
        '<div class="matches-section-title">' + escapeHtml(cat.label) + '</div>' +
        body +
      '</div>';
    }

    function hasRealContent(s) {
      var roster = s.roster || {};
      var rosterTotal = POSITION_ORDER.reduce(function(sum, p) { return sum + (roster[p] || []).length; }, 0);
      var matchesTotal = CATEGORY_ORDER.reduce(function(sum, k) {
        return sum + (((s.matches || {})[k] || {}).matches || []).length;
      }, 0);
      return rosterTotal > 0 || matchesTotal > 0;
    }

    function teamHasContent(t) {
      if (!t) return false;
      var matchesTotal = CATEGORY_ORDER.reduce(function(sum, key) {
        return sum + (((t.matches || {})[key] || {}).matches || []).length;
      }, 0);
      var hasNotes = CATEGORY_ORDER.some(function(key) { return !!(((t.matches || {})[key] || {}).note); });
      return matchesTotal > 0 || hasNotes;
    }

    function teamPanelHtml(t, teamKey) {
      if (!t) {
        return '<div class="archive-empty-note">这支队伍这个赛季还没有数据。</div>';
      }
      var html = '';
      if (!teamHasContent(t) && t.note) {
        html += '<div class="archive-empty-note">' + escapeHtml(t.note) + '</div>';
        return html;
      }
      if (t.note) {
        html += '<div class="team-note">' + escapeHtml(t.note) + '</div>';
      }

      var sections = CATEGORY_ORDER.map(function(key) {
        return categorySectionHtml((t.matches || {})[key]);
      }).filter(Boolean);
      html += sections.length ? sections.join('') : '<div class="archive-empty-note">' + escapeHtml(t.label || TEAM_FALLBACK_LABEL[teamKey]) + '这个赛季还没有比赛记录。</div>';

      return html;
    }

    function renderSeasonPanel(s) {
      var html = '';
      if (s.highlights && s.highlights.length) {
        html += '<ul class="season-highlights">' +
          s.highlights.map(function(h) { return '<li>' + escapeHtml(h) + '</li>'; }).join('') +
        '</ul>';
      }

      var teams = s.teams || {};
      html += '<div class="team-tabs" id="teamTabs" role="tablist">' +
        TEAM_ORDER.map(function(key) {
          var t = teams[key];
          var label = (t && t.label) || TEAM_FALLBACK_LABEL[key];
          return '<button type="button" class="team-tab' + (key === activeTeam ? ' active' : '') + '" data-team="' +
            key + '">' + escapeHtml(label) + '</button>';
        }).join('') +
      '</div>';

      html += '<div class="team-panel" id="teamPanel">' + teamPanelHtml(teams[activeTeam], activeTeam) + '</div>';

      return html;
    }

    var defaultSeason = seasons.find(hasRealContent) || seasons.find(function(s) { return s.current; }) || seasons[0];
    var currentIndex = seasons.indexOf(defaultSeason);
    if (currentIndex < 0) currentIndex = 0;
    var activeTeam = 'first';

    function seasonAt(idx) { return (idx >= 0 && idx < seasons.length) ? seasons[idx] : null; }

    function wheelRowHtml(role, season) {
      if (role === 'spacer') return '<div class="wheel-item wheel-spacer"></div>';
      if (!season) return '<div class="wheel-item wheel-' + role + ' wheel-item--empty" data-role="' + role + '"></div>';
      if (role === 'current') {
        return '<div class="wheel-item wheel-current" data-role="current">' +
          '<span class="wheel-pill">' +
            '<span class="wheel-pill-label">' + escapeHtml(season.label) + '</span>' +
            (season.current ? '<span class="wheel-pill-tag">现役</span>' : '') +
          '</span>' +
        '</div>';
      }
      var tag = role === 'prev' ? '‹ 上赛季' : '下赛季 ›';
      return '<div class="wheel-item wheel-' + role + '" data-role="' + role + '">' +
        '<span class="wheel-item-tag">' + tag + '</span>' +
        '<span class="wheel-item-label">' + escapeHtml(season.label) + (season.current ? ' · 现役' : '') + '</span>' +
      '</div>';
    }

    function buildTrackHtml() {
      return (
        wheelRowHtml('spacer', null) +
        wheelRowHtml('prev', seasonAt(currentIndex - 1)) +
        wheelRowHtml('current', seasonAt(currentIndex)) +
        wheelRowHtml('next', seasonAt(currentIndex + 1)) +
        wheelRowHtml('spacer', null)
      );
    }

    wheelDropdown.innerHTML = seasons.map(function(sn, i) {
      return '<div class="season-wheel-dropdown-item' + (i === currentIndex ? ' active' : '') + '" data-index="' + i + '">' +
        escapeHtml(sn.label) + (sn.current ? '<span class="tag">现役</span>' : '') +
      '</div>';
    }).join('');

    track.innerHTML = buildTrackHtml();
    var wheelRowH = track.children[1].getBoundingClientRect().height || 58;
    track.style.transform = 'translateY(-' + wheelRowH + 'px)';

    function refreshDropdownActive() {
      Array.prototype.forEach.call(wheelDropdown.querySelectorAll('.season-wheel-dropdown-item'), function(el) {
        el.classList.toggle('active', Number(el.dataset.index) === currentIndex);
      });
    }

    function slideWheel(dir) {
      wheelRowH = track.children[1].getBoundingClientRect().height || wheelRowH;
      track.style.transition = 'transform .34s cubic-bezier(.4,0,.2,1)';
      var target = dir === 'prev' ? 0 : -(2 * wheelRowH);
      requestAnimationFrame(function() { track.style.transform = 'translateY(' + target + 'px)'; });
      track.addEventListener('transitionend', function onEnd() {
        track.removeEventListener('transitionend', onEnd);
        track.style.transition = 'none';
        track.innerHTML = buildTrackHtml();
        track.style.transform = 'translateY(-' + wheelRowH + 'px)';
        void track.offsetWidth;
        track.style.transition = '';
      }, { once: true });
    }

    function fadeWheel() {
      track.style.transition = 'opacity .18s ease';
      track.style.opacity = '0';
      track.addEventListener('transitionend', function onEnd() {
        track.removeEventListener('transitionend', onEnd);
        track.innerHTML = buildTrackHtml();
        track.style.transform = 'translateY(-' + wheelRowH + 'px)';
        void track.offsetWidth;
        track.style.transition = 'opacity .22s ease';
        track.style.opacity = '1';
      }, { once: true });
    }

    function renderBody() {
      var s = seasons[currentIndex];
      bodyEl.classList.remove('enter');
      void bodyEl.offsetWidth; // 强制重排，让内容进场动画能重新播放
      bodyEl.innerHTML = renderSeasonPanel(s);
      bodyEl.classList.add('enter');
    }

    function goTo(idx, direction) {
      if (idx === currentIndex || idx < 0 || idx >= seasons.length) return;
      currentIndex = idx;
      activeTeam = 'first';
      refreshDropdownActive();
      if (direction === 'prev' || direction === 'next') { slideWheel(direction); }
      else { fadeWheel(); }
      renderBody();
    }

    wheelEl.addEventListener('click', function(e) {
      var row = e.target.closest('.wheel-item');
      if (!row) return;
      var role = row.dataset.role;
      if (role === 'prev') { goTo(currentIndex - 1, 'prev'); }
      else if (role === 'next') { goTo(currentIndex + 1, 'next'); }
      else if (role === 'current') {
        e.stopPropagation();
        wheelDropdown.hidden = !wheelDropdown.hidden;
      }
    });
    wheelDropdown.addEventListener('click', function(e) {
      var item = e.target.closest('.season-wheel-dropdown-item');
      if (!item) return;
      var idx = Number(item.dataset.index);
      wheelDropdown.hidden = true;
      var dir = idx === currentIndex - 1 ? 'prev' : idx === currentIndex + 1 ? 'next' : 'jump';
      goTo(idx, dir);
    });
    document.addEventListener('click', function(e) {
      if (!wheelDropdown.hidden && !e.target.closest('#seasonWheelWrap')) {
        wheelDropdown.hidden = true;
      }
    });

    document.querySelector('.season-archive').addEventListener('click', function(e) {
      var teamBtn = e.target.closest('.team-tab');
      if (teamBtn) {
        activeTeam = teamBtn.dataset.team;
        renderBody();
      }
    });

    renderBody();
  })();
</script>

</body>
</html>
