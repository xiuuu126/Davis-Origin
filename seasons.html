<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>赛季 · Davis Origin</title>
<link rel="icon" type="image/png" href="assets/logo.png" />
<style>
  :root {
    --bg: #f7f5f0;
    --bg-soft: #fafaf7;
    --ink: #0a0e1a;
    --ink-soft: #3d4151;
    --muted: #8a8a92;
    --line: #e6e2d8;
    --accent: #1e3a8a;
    --accent-deep: #0f1d4d;
    --accent-soft: #eaf0fb;
    --gold: #c89134;
    --card: #ffffff;
    --switch-bg: #ece6d8;
    --switch-bg-hover: #e2dbc9;
    --switch-bg-active: #d9d1ba;
    --pos-gk: #d49a2a;
    --pos-def: #1e3a8a;
    --pos-mid: #1f7a5e;
    --pos-fwd: #b04646;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 16px; line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--accent); color: #fff; }

  /* Topbar */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(247, 245, 240, 0.88);
    backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 1400px; margin: 0 auto;
    padding: 18px 40px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; }
  .brand-mark {
    width: 40px; height: 40px; object-fit: contain;
    transition: transform .4s cubic-bezier(.4,0,.2,1);
  }
  .brand:hover .brand-mark { transform: rotate(-10deg) scale(1.08); }
  .brand-name { font-size: 16px; }
  .brand-sub { color: var(--muted); font-size: 12px; margin-left: 6px; font-weight: 400; }
  .back-link {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px; border: 1px solid var(--line);
    border-radius: 999px; font-size: 13px;
    color: var(--ink-soft); background: var(--bg-soft);
    transition: all .3s ease;
  }
  .back-link:hover {
    border-color: var(--accent); color: var(--accent);
    background: var(--accent-soft); transform: translateX(-3px);
  }

  /* Hero */
  .page-hero {
    max-width: 1080px; margin: 0 auto;
    padding: 96px 40px 40px;
  }
  .page-eyebrow {
    font-size: 12px; font-weight: 700;
    letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 22px;
    display: flex; align-items: center; gap: 14px;
    animation: fadeUp .8s ease both;
  }
  .page-eyebrow::before {
    content: ''; width: 36px; height: 1.5px; background: var(--accent);
  }
  .page-title {
    font-size: clamp(56px, 9vw, 112px);
    font-weight: 900; letter-spacing: -0.04em;
    line-height: 0.95; margin-bottom: 24px;
    animation: fadeUp .9s ease .1s both;
  }
  .page-title em { font-style: italic; font-weight: 400; color: var(--accent); }
  .page-lede {
    font-size: 18px; color: var(--ink-soft);
    max-width: 600px;
    animation: fadeUp .9s ease .2s both;
  }
  /* ===== Season archive ===== */
  .season-archive {
    max-width: 1080px;
    margin: 0 auto;
    padding: 32px 40px 96px;
  }
  /* ===== 赛季切换：一整条长方形（‹ 箭头 | 当前赛季 | 箭头 ›），左右动画切换 ===== */
  .season-bar-wrap { position: relative; max-width: 420px; margin: 0 auto 32px; }
  .season-bar {
    display: flex; align-items: stretch; user-select: none;
    background: rgba(255,255,255,.55); border: 1px solid var(--line);
    border-radius: 20px; overflow: hidden;
    box-shadow: 0 12px 34px rgba(15,29,77,.10);
    backdrop-filter: blur(14px) saturate(180%);
    -webkit-backdrop-filter: blur(14px) saturate(180%);
  }
  .season-bar-arrow {
    flex: none; width: 52px; border: none; background: var(--switch-bg); cursor: pointer;
    display: grid; place-items: center; color: var(--ink-soft); position: relative; overflow: hidden;
    font-family: inherit; transition: color .2s ease, background .2s ease;
  }
  .season-bar-arrow:hover { color: var(--ink); background: var(--switch-bg-hover); }
  .season-bar-arrow:active { transform: scale(.94); }
  .season-bar-arrow[disabled] { opacity: .3; cursor: default; pointer-events: none; }
  .season-bar-arrow::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(120deg, transparent 30%, rgba(20,17,10,.16) 50%, transparent 70%);
    background-size: 260% 100%; background-position: 150% 0; opacity: 0;
  }
  .season-bar-arrow.pulse::after { animation: arrowSweep .5s ease; }
  @keyframes arrowSweep {
    0%   { opacity: 1; background-position: 150% 0; }
    100% { opacity: 0; background-position: -60% 0; }
  }
  .season-bar-center {
    flex: 1; padding: 15px 12px; cursor: pointer; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    background: var(--switch-bg); border-left: 1px solid var(--switch-bg-active);
    border-right: 1px solid var(--switch-bg-active);
    color: var(--ink); overflow: hidden;
  }
  .season-bar-label { font-size: 16px; font-weight: 800; display: inline-block; }
  .season-bar-label.slide-in-next { animation: slideInFromBottom .3s ease both; }
  .season-bar-label.slide-in-prev { animation: slideInFromTop .3s ease both; }
  @keyframes slideInFromBottom { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideInFromTop    { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: translateY(0); } }
  .season-bar-tag {
    font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    background: var(--accent-soft); color: var(--accent); padding: 2px 9px; border-radius: 999px;
  }

  /* 点击中间才展开的滚轮选择器（可上下滑动） */
  .season-wheel-popup {
    position: absolute; top: calc(100% + 10px); left: 0; right: 0;
    max-height: 236px; overflow-y: auto; scroll-snap-type: y proximity;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    box-shadow: 0 18px 44px rgba(15,29,77,.18); padding: 8px; z-index: 30;
    animation: fadeUp .2s ease both;
  }
  .season-wheel-popup[hidden] { display: none; }
  .season-wheel-popup-item {
    scroll-snap-align: center;
    padding: 12px 16px; border-radius: 12px; font-size: 15px; font-weight: 700;
    color: var(--ink-soft); cursor: pointer; text-align: center;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .2s ease, color .2s ease;
  }
  .season-wheel-popup-item:hover { background: var(--accent-soft); color: var(--accent); }
  .season-wheel-popup-item.active { background: var(--accent-deep); color: #fff; }
  .season-wheel-popup-item .tag { font-size: 9px; opacity: .85; }

  @keyframes panelEnter {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .season-archive-body.enter { animation: panelEnter .4s ease both; }

  .season-highlights { list-style: none; margin: 0 0 32px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .season-highlights li { position: relative; padding-left: 22px; font-size: 15px; color: var(--ink); line-height: 1.6; }
  .season-highlights li::before {
    content: ''; position: absolute; left: 0; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold);
  }

  /* ===== 一队 / 预备队 切换（和赛季滚轮同一套视觉语言） ===== */
  .team-tabs {
    display: flex; gap: 6px; margin: 0 auto 28px; width: fit-content;
    background: rgba(255,255,255,.5); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px;
    backdrop-filter: blur(14px) saturate(180%);
    -webkit-backdrop-filter: blur(14px) saturate(180%);
    box-shadow: 0 8px 24px rgba(15,29,77,.08);
  }
  .team-tab {
    background: transparent; border: none; border-radius: 999px;
    padding: 13px 34px; font-size: 15px; font-weight: 800; color: var(--ink-soft);
    cursor: pointer; font-family: inherit; transition: all .25s ease;
  }
  .team-tab:hover { color: var(--accent); }
  .team-tab.active {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
    color: #fff; box-shadow: 0 10px 26px rgba(30,58,138,.32);
  }
  .team-note {
    font-size: 14px; color: var(--ink-soft); background: var(--accent-soft);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; margin-bottom: 24px;
  }

  .archive-empty-note {
    font-size: 14px; color: var(--muted); background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px;
  }

  /* 队伍面板：左边球员名单（只列一遍），右边比赛比分 */
  .team-panel-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 32px; align-items: start; }
  .roster-col-title {
    font-size: 12.5px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 16px; display: flex; align-items: center; gap: 10px;
  }
  .roster-col-title::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .roster-position-group { margin-bottom: 18px; }
  .roster-position-group:last-child { margin-bottom: 0; }
  .roster-position-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .roster-position-head .pos-cn { font-size: 13px; font-weight: 700; color: var(--pos, var(--accent)); }
  .roster-position-head .pos-count { font-size: 11px; color: var(--muted); }
  .roster-player-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .roster-player-chip {
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 13px; font-size: 12.5px; color: var(--ink);
  }

  /* 比赛板块 */
  .matches-section + .matches-section { margin-top: 28px; }
  .matches-section-title {
    font-size: 22px; font-weight: 900; letter-spacing: 0; text-transform: none;
    color: var(--ink); margin-bottom: 14px; padding-left: 14px; position: relative;
  }
  .matches-section-title::before {
    content: ''; position: absolute; left: 0; top: 4px; bottom: 4px; width: 4px;
    border-radius: 2px; background: var(--accent);
  }
  .matches-section-note {
    font-size: 14px; color: var(--ink-soft); line-height: 1.8; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px;
  }
  .match-row {
    display: grid; grid-template-columns: 88px 1fr auto; gap: 16px;
    padding: 14px 16px; margin-bottom: 6px; border-radius: 12px;
    align-items: center; background: var(--bg-soft); transition: background .2s ease;
  }
  .match-date-col { font-variant-numeric: tabular-nums; }
  .match-date-day { font-size: 14px; font-weight: 700; color: var(--ink); }
  .match-date-time { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .match-teams { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .match-team { font-size: 15px; font-weight: 500; color: var(--ink-soft); }
  .match-team.davis { color: var(--ink); font-weight: 600; }
  .match-team.winner { color: var(--accent); font-weight: 800; }
  .match-score {
    display: inline-flex; align-items: center; padding: 5px 12px;
    background: var(--accent-soft); color: var(--accent); border-radius: 7px;
    font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums;
  }
  .match-result {
    font-size: 12px; font-weight: 800; color: var(--accent);
    width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft);
    display: grid; place-items: center;
  }
  .match-result.draw { background: rgba(140,140,148,0.12); color: var(--ink-soft); }
  .match-result.loss { background: rgba(176, 70, 70, 0.12); color: #b04646; }

  /* Footer */
  footer {
    padding: 40px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    background: var(--bg);
    border-top: 1px solid var(--line);
  }
  footer .slogan-cn {
    font-size: 14px;
    color: var(--ink-soft);
    margin-bottom: 8px;
    letter-spacing: 0.08em;
    font-weight: 500;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 720px) {
    .topbar-inner { padding: 14px 20px; }
    .back-link { padding: 8px 12px; font-size: 12px; }
    .page-hero { padding: 56px 22px 24px; }
    .page-lede { font-size: 15px; }
    .season-archive { padding: 24px 22px 64px; }
    .season-bar-wrap { max-width: 100%; }
    .season-bar-arrow { width: 42px; }
    .season-bar-label { font-size: 14px; }
    .team-tab { padding: 11px 22px; font-size: 13.5px; }
    .team-panel-grid { grid-template-columns: 1fr; gap: 20px; }
    .matches-section-title { font-size: 18px; margin-bottom: 12px; }
    .match-row { grid-template-columns: 70px 1fr auto; gap: 10px; padding: 12px; }
    .match-team { font-size: 13.5px; }
    .match-score { font-size: 13px; padding: 4px 9px; }
    .match-result { width: 26px; height: 26px; font-size: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <img class="brand-mark" src="assets/logo.png" alt="Davis Origin Logo" />
      <div>
        <div class="brand-name">Davis Origin<span class="brand-sub">戴维斯原点</span></div>
      </div>
    </a>
    <a class="back-link" href="index.html">← 返回主页</a>
  </div>
</header>

<section class="page-hero">
  <div class="page-eyebrow">Seasons · 赛季</div>
  <h1 class="page-title">Seasons<em>.</em></h1>
  <p class="page-lede">Davis Origin · 戴维斯原点足球俱乐部</p>
</section>

<section class="season-archive">
  <div class="season-bar-wrap" id="seasonBarWrap">
    <div class="season-bar" id="seasonBar" role="group" aria-label="选择赛季"></div>
    <div class="season-wheel-popup" id="seasonWheelPopup" hidden></div>
  </div>
  <div class="season-archive-body" id="seasonArchiveBody"></div>
</section>

<footer>
  <div class="slogan-cn">岂曰无衣？与子同袍。</div>
  © Davis Origin · 戴维斯原点足球俱乐部 · UC Davis
</footer>

<script src="seasons.js"></script>
<script>
  (function() {
    var barEl = document.getElementById('seasonBar');
    var wheelPopup = document.getElementById('seasonWheelPopup');
    var bodyEl = document.getElementById('seasonArchiveBody');
    if (!barEl || !wheelPopup || !bodyEl || !window.SEASON_DATA) return;
    var seasons = (window.SEASON_DATA.seasons || []).slice().reverse(); // 按时间从早到晚显示
    if (!seasons.length) return;

    var POSITION_ORDER = ['gk', 'def', 'mid', 'fwd'];
    var CATEGORY_ORDER = ['league', 'huati', 'xinnian'];
    var TEAM_ORDER = ['first', 'reserve'];
    var TEAM_FALLBACK_LABEL = { first: '一队', reserve: '预备队' };

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function(c) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
      });
    }
    function resultLabel(result) {
      if (result === 'win') return 'W';
      if (result === 'draw') return 'D';
      if (result === 'loss') return 'L';
      return '–';
    }
    function teamSpan(team) {
      var cls = 'match-team' + (team.davis ? ' davis' : '') + (team.winner ? ' winner' : '');
      return '<span class="' + cls + '">' + escapeHtml(team.name) + '</span>';
    }
    function matchRowHtml(m) {
      var resultCls = 'match-result' + (m.result !== 'win' ? ' ' + m.result : '');
      return '<div class="match-row">' +
        '<div class="match-date-col">' +
          '<div class="match-date-day">' + escapeHtml(m.date) + '</div>' +
          '<div class="match-date-time">' + escapeHtml(m.time || '') + '</div>' +
        '</div>' +
        '<div class="match-teams">' +
          teamSpan(m.team1) +
          '<span class="match-score">' + escapeHtml(m.score) + '</span>' +
          teamSpan(m.team2) +
        '</div>' +
        '<div class="' + resultCls + '">' + resultLabel(m.result) + '</div>' +
      '</div>';
    }
    function categorySectionHtml(cat) {
      if (!cat) return '';
      var hasMatches = cat.matches && cat.matches.length;
      if (!hasMatches && !cat.note) return '';
      var body = hasMatches
        ? cat.matches.map(matchRowHtml).join('')
        : '<div class="matches-section-note">' + escapeHtml(cat.note) + '</div>';
      return '<div class="matches-section">' +
        '<div class="matches-section-title">' + escapeHtml(cat.label) + '</div>' +
        body +
      '</div>';
    }

    function hasRealContent(s) {
      var roster = s.roster || {};
      var rosterTotal = POSITION_ORDER.reduce(function(sum, p) { return sum + (roster[p] || []).length; }, 0);
      var matchesTotal = CATEGORY_ORDER.reduce(function(sum, k) {
        return sum + (((s.matches || {})[k] || {}).matches || []).length;
      }, 0);
      return rosterTotal > 0 || matchesTotal > 0;
    }

    function rosterTotal(t) {
      var roster = (t && t.roster) || {};
      return POSITION_ORDER.reduce(function(sum, p) { return sum + (roster[p] || []).length; }, 0);
    }

    function teamHasContent(t) {
      if (!t) return false;
      var matchesTotal = CATEGORY_ORDER.reduce(function(sum, key) {
        return sum + (((t.matches || {})[key] || {}).matches || []).length;
      }, 0);
      var hasNotes = CATEGORY_ORDER.some(function(key) { return !!(((t.matches || {})[key] || {}).note); });
      return matchesTotal > 0 || hasNotes || rosterTotal(t) > 0;
    }

    function rosterColumnHtml(t, teamKey) {
      var roster = (t && t.roster) || {};
      var html = '<div class="roster-col-title">球员名单</div>';
      if (rosterTotal(t) === 0) {
        return html + '<div class="archive-empty-note">' + escapeHtml((t && t.label) || TEAM_FALLBACK_LABEL[teamKey]) + '名单还没整理。</div>';
      }
      html += POSITION_ORDER.filter(function(p) { return (roster[p] || []).length > 0; }).map(function(p) {
        var players = roster[p] || [];
        var posCn = { gk: '门将', def: '后场', mid: '中场', fwd: '前场' }[p];
        return '<div class="roster-position-group" style="--pos: var(--pos-' + p + ')">' +
          '<div class="roster-position-head"><span class="pos-cn">' + posCn + '</span>' +
          '<span class="pos-count">' + players.length + ' 人</span></div>' +
          '<div class="roster-player-grid">' +
            players.map(function(name) { return '<div class="roster-player-chip">' + escapeHtml(name) + '</div>'; }).join('') +
          '</div>' +
        '</div>';
      }).join('');
      return html;
    }

    function matchesColumnHtml(t, teamKey) {
      var sections = CATEGORY_ORDER.map(function(key) {
        return categorySectionHtml((t.matches || {})[key]);
      }).filter(Boolean);
      return sections.length ? sections.join('') : '<div class="archive-empty-note">' + escapeHtml((t && t.label) || TEAM_FALLBACK_LABEL[teamKey]) + '这个赛季还没有比赛记录。</div>';
    }

    function teamPanelHtml(t, teamKey) {
      if (!t) {
        return '<div class="archive-empty-note">这支队伍这个赛季还没有数据。</div>';
      }
      if (!teamHasContent(t) && t.note) {
        return '<div class="archive-empty-note">' + escapeHtml(t.note) + '</div>';
      }
      var html = '';
      if (t.note) {
        html += '<div class="team-note">' + escapeHtml(t.note) + '</div>';
      }
      html += '<div class="team-panel-grid">' +
        '<div class="team-roster-col">' + rosterColumnHtml(t, teamKey) + '</div>' +
        '<div class="team-matches-col">' + matchesColumnHtml(t, teamKey) + '</div>' +
      '</div>';
      return html;
    }

    function renderSeasonPanel(s) {
      var html = '';
      if (s.highlights && s.highlights.length) {
        html += '<ul class="season-highlights">' +
          s.highlights.map(function(h) { return '<li>' + escapeHtml(h) + '</li>'; }).join('') +
        '</ul>';
      }

      var teams = s.teams || {};
      html += '<div class="team-tabs" id="teamTabs" role="tablist">' +
        TEAM_ORDER.map(function(key) {
          var t = teams[key];
          var label = (t && t.label) || TEAM_FALLBACK_LABEL[key];
          return '<button type="button" class="team-tab' + (key === activeTeam ? ' active' : '') + '" data-team="' +
            key + '">' + escapeHtml(label) + '</button>';
        }).join('') +
      '</div>';

      html += '<div class="team-panel" id="teamPanel">' + teamPanelHtml(teams[activeTeam], activeTeam) + '</div>';

      return html;
    }

    var defaultSeason = seasons.find(hasRealContent) || seasons.find(function(s) { return s.current; }) || seasons[0];
    var currentIndex = seasons.indexOf(defaultSeason);
    if (currentIndex < 0) currentIndex = 0;
    var activeTeam = 'first';

    var ARROW_LEFT_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>';
    var ARROW_RIGHT_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

    // 普通情况：一整条长方形，‹ 箭头 | 当前赛季（居中，颜色突出） | 箭头 ›
    barEl.innerHTML =
      '<button type="button" class="season-bar-arrow" id="seasonPrevBtn" aria-label="上一个赛季">' + ARROW_LEFT_SVG + '</button>' +
      '<div class="season-bar-center" id="seasonBarCenter">' +
        '<span class="season-bar-label" id="seasonBarLabel"></span>' +
        '<span class="season-bar-tag" id="seasonBarTag" hidden>现役</span>' +
      '</div>' +
      '<button type="button" class="season-bar-arrow" id="seasonNextBtn" aria-label="下一个赛季">' + ARROW_RIGHT_SVG + '</button>';

    var prevBtn = document.getElementById('seasonPrevBtn');
    var nextBtn = document.getElementById('seasonNextBtn');
    var barCenter = document.getElementById('seasonBarCenter');
    var barLabel = document.getElementById('seasonBarLabel');
    var barTag = document.getElementById('seasonBarTag');

    // 点击中间才会展开的滚轮选择器：一列可以上下滑动的赛季列表
    wheelPopup.innerHTML = seasons.map(function(sn, i) {
      return '<div class="season-wheel-popup-item" data-index="' + i + '">' +
        escapeHtml(sn.label) + (sn.current ? '<span class="tag">现役</span>' : '') +
      '</div>';
    }).join('');

    function refreshPopupActive() {
      Array.prototype.forEach.call(wheelPopup.querySelectorAll('.season-wheel-popup-item'), function(el) {
        el.classList.toggle('active', Number(el.dataset.index) === currentIndex);
      });
    }

    function updateBar(direction) {
      var s = seasons[currentIndex];
      prevBtn.disabled = currentIndex <= 0;
      nextBtn.disabled = currentIndex >= seasons.length - 1;

      barLabel.textContent = s.label;
      barLabel.classList.remove('slide-in-next', 'slide-in-prev');
      void barLabel.offsetWidth; // 强制重排，让滑入动画能重新播放
      if (direction === 'next') barLabel.classList.add('slide-in-next');
      else if (direction === 'prev') barLabel.classList.add('slide-in-prev');
      barTag.hidden = !s.current;

      refreshPopupActive();

      if (direction === 'next' || direction === 'prev') {
        var arrowBtn = direction === 'next' ? nextBtn : prevBtn;
        arrowBtn.classList.remove('pulse');
        void arrowBtn.offsetWidth;
        arrowBtn.classList.add('pulse');
      }
    }

    function renderBody() {
      var s = seasons[currentIndex];
      bodyEl.classList.remove('enter');
      void bodyEl.offsetWidth; // 强制重排，让内容进场动画能重新播放
      bodyEl.innerHTML = renderSeasonPanel(s);
      bodyEl.classList.add('enter');
    }

    function goTo(idx, direction) {
      if (idx === currentIndex || idx < 0 || idx >= seasons.length) return;
      currentIndex = idx;
      activeTeam = 'first';
      updateBar(direction);
      renderBody();
    }

    prevBtn.addEventListener('click', function() { goTo(currentIndex - 1, 'prev'); });
    nextBtn.addEventListener('click', function() { goTo(currentIndex + 1, 'next'); });

    barCenter.addEventListener('click', function(e) {
      e.stopPropagation();
      wheelPopup.hidden = !wheelPopup.hidden;
      if (!wheelPopup.hidden) {
        var activeItem = wheelPopup.querySelector('.season-wheel-popup-item.active');
        if (activeItem) activeItem.scrollIntoView({ block: 'center' });
      }
    });
    wheelPopup.addEventListener('click', function(e) {
      var item = e.target.closest('.season-wheel-popup-item');
      if (!item) return;
      var idx = Number(item.dataset.index);
      wheelPopup.hidden = true;
      var dir = idx === currentIndex - 1 ? 'prev' : idx === currentIndex + 1 ? 'next' : null;
      goTo(idx, dir);
    });
    document.addEventListener('click', function(e) {
      if (!wheelPopup.hidden && !e.target.closest('#seasonBarWrap')) {
        wheelPopup.hidden = true;
      }
    });

    document.querySelector('.season-archive').addEventListener('click', function(e) {
      var teamBtn = e.target.closest('.team-tab');
      if (teamBtn) {
        activeTeam = teamBtn.dataset.team;
        renderBody();
      }
    });

    updateBar(null);
    renderBody();
  })();
</script>

</body>
</html>
