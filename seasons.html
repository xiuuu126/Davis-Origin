<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>赛季 · Davis Origin</title>
<link rel="icon" type="image/png" href="assets/logo.png" />
<style>
  :root {
    --bg: #f7f5f0;
    --bg-soft: #fafaf7;
    --ink: #0a0e1a;
    --ink-soft: #3d4151;
    --muted: #8a8a92;
    --line: #e6e2d8;
    --accent: #1e3a8a;
    --accent-deep: #0f1d4d;
    --accent-soft: #eaf0fb;
    --gold: #c89134;
    --card: #ffffff;
    --switch-bg: #ece6d8;
    --switch-bg-hover: #e2dbc9;
    --switch-bg-active: #d9d1ba;
    --pos-gk: #d49a2a;
    --pos-def: #1e3a8a;
    --pos-mid: #1f7a5e;
    --pos-fwd: #b04646;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 16px; line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--accent); color: #fff; }

  /* Topbar */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(247, 245, 240, 0.88);
    backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 1400px; margin: 0 auto;
    padding: 18px 40px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; }
  .brand-mark {
    width: 40px; height: 40px; object-fit: contain;
    transition: transform .4s cubic-bezier(.4,0,.2,1);
  }
  .brand:hover .brand-mark { transform: rotate(-10deg) scale(1.08); }
  .brand-name { font-size: 16px; }
  .brand-sub { color: var(--muted); font-size: 12px; margin-left: 6px; font-weight: 400; }
  .back-link {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px; border: 1px solid var(--line);
    border-radius: 999px; font-size: 13px;
    color: var(--ink-soft); background: var(--bg-soft);
    transition: all .3s ease;
  }
  .back-link:hover {
    border-color: var(--accent); color: var(--accent);
    background: var(--accent-soft); transform: translateX(-3px);
  }

  /* Hero */
  .page-hero {
    max-width: 1080px; margin: 0 auto;
    padding: 96px 40px 40px;
  }
  .page-eyebrow {
    font-size: 12px; font-weight: 700;
    letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 22px;
    display: flex; align-items: center; gap: 14px;
    animation: fadeUp .8s ease both;
  }
  .page-eyebrow::before {
    content: ''; width: 36px; height: 1.5px; background: var(--accent);
  }
  .page-title {
    font-size: clamp(56px, 9vw, 112px);
    font-weight: 900; letter-spacing: -0.04em;
    line-height: 0.95; margin-bottom: 24px;
    animation: fadeUp .9s ease .1s both;
  }
  .page-title em { font-style: italic; font-weight: 400; color: var(--accent); }
  .page-lede {
    font-size: 18px; color: var(--ink-soft);
    max-width: 600px;
    animation: fadeUp .9s ease .2s both;
  }
  /* ===== Season archive ===== */
  .season-archive {
    max-width: 1080px;
    margin: 0 auto;
    padding: 32px 40px 96px;
  }
  /* ===== 赛季切换：一整条长方形（‹ 箭头 | 当前赛季 | 箭头 ›），左右动画切换 ===== */
  .season-bar-wrap { position: relative; max-width: 420px; margin: 0 auto 32px; }
  .season-bar {
    display: flex; align-items: stretch; user-select: none;
    background: rgba(255,255,255,.55); border: 1px solid var(--line);
    border-radius: 20px; overflow: hidden;
    box-shadow: 0 12px 34px rgba(15,29,77,.10);
    backdrop-filter: blur(14px) saturate(180%);
    -webkit-backdrop-filter: blur(14px) saturate(180%);
  }
  .season-bar-arrow {
    flex: none; width: 52px; border: none; background: var(--switch-bg); cursor: pointer;
    display: grid; place-items: center; color: var(--ink-soft); position: relative; overflow: hidden;
    font-family: inherit; transition: color .2s ease, background .2s ease;
  }
  .season-bar-arrow:hover { color: var(--ink); background: var(--switch-bg-hover); }
  .season-bar-arrow:active { transform: scale(.94); }
  .season-bar-arrow[disabled] { opacity: .3; cursor: default; pointer-events: none; }
  .season-bar-arrow::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(120deg, transparent 30%, rgba(20,17,10,.16) 50%, transparent 70%);
    background-size: 260% 100%; background-position: 150% 0; opacity: 0;
  }
  .season-bar-arrow.pulse::after { animation: arrowSweep .5s ease; }
  @keyframes arrowSweep {
    0%   { opacity: 1; background-position: 150% 0; }
    100% { opacity: 0; background-position: -60% 0; }
  }
  /* 平时：一行文字，居中显示当前赛季。点一下之后，这块区域自己会长高，
     原地变成一个 3 行的滚轮（不是在下面另外弹出一个浮层）——显示当前
     赛季的这块地方，点开之后本身就变成了滚轮的一部分。 */
  .season-bar-center {
    flex: 1; position: relative; cursor: pointer; overflow: hidden;
    background: var(--switch-bg); border-left: 1px solid var(--switch-bg-active);
    border-right: 1px solid var(--switch-bg-active);
    color: var(--ink);
    height: 54px; transition: height .32s cubic-bezier(.4,0,.2,1);
  }
  .season-bar-wrap.expanded .season-bar-center { height: 168px; }
  .season-bar-wrap.expanded { z-index: 45; }

  .season-bar-center-label {
    position: absolute; inset: 0; padding: 15px 12px; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    opacity: 1; transition: opacity .18s ease;
  }
  .season-bar-wrap.expanded .season-bar-center-label { opacity: 0; pointer-events: none; }
  .season-bar-label { font-size: 16px; font-weight: 800; display: inline-block; }
  .season-bar-label.slide-in-next { animation: slideInFromRight .3s ease both; }
  .season-bar-label.slide-in-prev { animation: slideInFromLeft .3s ease both; }
  @keyframes slideInFromRight { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes slideInFromLeft  { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: translateX(0); } }
  .season-bar-tag {
    font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    background: var(--accent-soft); color: var(--accent); padding: 2px 9px; border-radius: 999px;
  }

  /* 点开之后，原地长高出来的滚轮：固定 3 行，正在看的赛季永远在正中间
     （字号更大更突出），上一行是上一个赛季，下一行是下一个赛季，可以
     直接上下滑动切换，上下边缘渐隐，看起来像一个真正的滚轮。平时
     （没点开时）这一切都不存在，只是普通的一整条长方形——显示当前
     赛季和挑选赛季是同一块地方，不是两个分开的东西。 */
  .season-bar-wheel {
    position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
    scroll-snap-type: y mandatory;
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none; transition: opacity .18s ease .06s;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 30%, #000 70%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 30%, #000 70%, transparent 100%);
  }
  .season-bar-wrap.expanded .season-bar-wheel { opacity: 1; pointer-events: auto; }
  .season-wheel-spacer { flex: none; height: 56px; scroll-snap-align: none; }
  .season-wheel-popup-item {
    flex: none; height: 56px; scroll-snap-align: center;
    padding: 0 16px; font-size: 14.5px; font-weight: 700; opacity: .5;
    color: var(--muted); cursor: pointer; text-align: center;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: color .2s ease, opacity .2s ease, font-size .2s ease, font-weight .2s ease;
  }
  .season-wheel-popup-item.active { opacity: .8; color: var(--ink); }
  .season-wheel-popup-item.centered {
    font-size: 19px; font-weight: 900; color: var(--ink); opacity: 1;
  }
  .season-wheel-popup-item .tag {
    font-size: 9px; font-weight: 700; background: var(--accent-soft); color: var(--accent);
    padding: 2px 8px; border-radius: 999px; opacity: .9;
  }

  /* 点开滚轮时，背后整个页面轻微模糊+压暗，让滚轮显得像浮在最上层 */
  .season-backdrop {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(10,14,26,.22);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .28s ease, visibility 0s linear .28s;
  }
  .season-backdrop.show {
    opacity: 1; visibility: visible; pointer-events: auto;
    transition: opacity .28s ease, visibility 0s linear 0s;
  }

  @keyframes panelEnter {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .season-archive-body.enter { animation: panelEnter .4s ease both; }
  /* 切一队/预备队时只有这块内容淡入，不会带着上面的简介和切换按钮一起闪一下 */
  .team-panel.enter { animation: panelEnter .3s ease both; }

  /* ===== "这一年的我们"——像告示栏一样的方框，把这个赛季的几句话概括都钉在里面 ===== */
  .season-board {
    position: relative;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 30px 32px 26px; margin-bottom: 32px;
    box-shadow: 0 14px 36px rgba(15,29,77,.08);
  }
  .season-board::before {
    content: ''; position: absolute; top: -8px; left: 36px;
    width: 15px; height: 15px; border-radius: 50%; background: var(--gold);
    box-shadow: 0 3px 6px rgba(0,0,0,.18), inset 0 1px 1px rgba(255,255,255,.4);
  }
  .season-board-title {
    font-size: 28px; font-weight: 900; color: var(--ink);
    margin-bottom: 20px; padding-left: 16px; position: relative;
  }
  .season-board-title::before {
    content: ''; position: absolute; left: 0; top: 2px; bottom: 2px; width: 5px;
    border-radius: 2.5px; background: var(--accent);
  }
  .season-highlights { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .season-highlights li { position: relative; padding-left: 22px; font-size: 15px; color: var(--ink); line-height: 1.6; }
  .season-highlights li::before {
    content: ''; position: absolute; left: 0; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold);
  }

  /* ===== 一队 / 预备队 切换（和赛季滚轮同一套视觉语言） ===== */
  .team-tabs {
    display: flex; gap: 6px; margin: 0 auto 28px; width: fit-content;
    background: rgba(255,255,255,.5); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px;
    backdrop-filter: blur(14px) saturate(180%);
    -webkit-backdrop-filter: blur(14px) saturate(180%);
    box-shadow: 0 8px 24px rgba(15,29,77,.08);
  }
  .team-tab {
    background: transparent; border: none; border-radius: 999px;
    padding: 13px 34px; font-size: 15px; font-weight: 800; color: var(--ink-soft);
    cursor: pointer; font-family: inherit; transition: all .25s ease;
  }
  .team-tab:hover { color: var(--accent); }
  .team-tab.active {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
    color: #fff; box-shadow: 0 10px 26px rgba(30,58,138,.32);
  }
  .team-note {
    font-size: 14px; color: var(--ink-soft); background: var(--accent-soft);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; margin-bottom: 24px;
  }

  .archive-empty-note {
    font-size: 14px; color: var(--muted); background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px;
  }

  /* 每个赛事板块（北加联/华体会/贺岁杯）内部：左边这个赛事自己的球员
     名单，右边这个赛事自己的比赛结果——每个板块都是独立的一份。两栏
     中间有一条细分隔线，让高度不一样看起来是设计出来的两栏，不是
     版式没对齐。 */
  .matches-section-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 0; align-items: start; margin-top: 4px; }
  .matches-roster-col { padding-right: 28px; }
  .matches-results-col { padding-left: 28px; border-left: 1px solid var(--line); }
  .roster-col-title {
    font-size: 11.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 14px; display: flex; align-items: center; gap: 10px;
  }
  .roster-col-title::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .roster-position-group { margin-bottom: 18px; }
  .roster-position-group:last-child { margin-bottom: 0; }
  .roster-position-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .roster-position-head .pos-cn { font-size: 13px; font-weight: 700; color: var(--pos, var(--accent)); }
  .roster-position-head .pos-count { font-size: 11px; color: var(--muted); }
  .roster-player-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .roster-player-chip {
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 13px; font-size: 12.5px; color: var(--ink);
  }

  /* 比赛板块 */
  .matches-section + .matches-section { margin-top: 36px; padding-top: 32px; border-top: 1px solid var(--line); }
  /* 标题这一行：赛事名（放大）在左，这个赛事的战绩总结在右，同一行 */
  .matches-section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 10px 16px; margin-bottom: 6px;
  }
  .matches-section-title {
    font-size: 30px; font-weight: 900; letter-spacing: 0; text-transform: none;
    color: var(--ink); padding-left: 16px; position: relative;
  }
  .matches-section-title::before {
    content: ''; position: absolute; left: 0; top: 3px; bottom: 3px; width: 5px;
    border-radius: 2.5px; background: var(--accent);
  }
  /* 赛事统计做成一块有背景的小板子，胜/平/负各自分开、各自配色，
     跟比赛行左边的胜平负色条是同一套颜色语言 */
  .matches-section-summary {
    display: flex; align-items: center; flex-wrap: wrap;
    background: var(--switch-bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 5px 2px; font-size: 13px; font-weight: 700; color: var(--ink-soft);
  }
  .matches-section-summary .ms-stat { padding: 5px 11px; white-space: nowrap; }
  .matches-section-summary .ms-stat + .ms-stat { border-left: 1px solid var(--line); }
  .matches-section-summary .ms-stat-total,
  .matches-section-summary .ms-stat-gd { color: var(--ink); font-weight: 800; }
  .matches-section-summary .ms-stat-win { color: var(--accent); }
  .matches-section-summary .ms-stat-draw { color: var(--muted); }
  .matches-section-summary .ms-stat-loss { color: #b04646; }
  /* 标题下面一行小字：比赛地点 / 赛事时间，一左一右分开显示；没有数据就不显示这一行 */
  .matches-section-meta {
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 28px;
    margin: 0 0 16px; padding-left: 16px;
    font-size: 12.5px; color: var(--muted);
  }
  .matches-section-meta .meta-label {
    font-weight: 700; color: var(--ink-soft); margin-right: 5px;
  }
  .matches-section-note {
    font-size: 14px; color: var(--ink-soft); line-height: 1.8; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px;
  }
  /* 每场比赛做成带边框+阴影的卡片，左边一条细色条标记胜/平/负，
     跟标题、告示栏左边那条竖线是同一套视觉语言 */
  .match-row {
    display: grid; grid-template-columns: 88px 1fr auto; gap: 16px;
    padding: 14px 16px 14px 20px; margin-bottom: 10px; border-radius: 12px;
    align-items: center; background: var(--card); border: 1px solid var(--line);
    box-shadow: 0 2px 10px rgba(15,29,77,.04);
    position: relative; overflow: hidden;
    transition: box-shadow .2s ease, transform .2s ease;
  }
  .match-row:hover { box-shadow: 0 8px 22px rgba(15,29,77,.10); transform: translateY(-1px); }
  .match-row::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent);
  }
  .match-row.draw::before { background: var(--muted); }
  .match-row.loss::before { background: #b04646; }
  .match-date-col { font-variant-numeric: tabular-nums; }
  .match-date-day { font-size: 14px; font-weight: 700; color: var(--ink); }
  .match-date-time { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .match-teams { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .match-team { font-size: 15px; font-weight: 500; color: var(--ink-soft); }
  .match-team.davis { color: var(--ink); font-weight: 600; }
  .match-team.winner { color: var(--accent); font-weight: 800; }
  .match-score {
    display: inline-flex; align-items: center; padding: 5px 12px;
    background: var(--accent-soft); color: var(--accent); border-radius: 7px;
    font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums;
  }
  .match-result {
    font-size: 12px; font-weight: 800; color: var(--accent);
    width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft);
    display: grid; place-items: center;
  }
  .match-result.draw { background: rgba(140,140,148,0.12); color: var(--ink-soft); }
  .match-result.loss { background: rgba(176, 70, 70, 0.12); color: #b04646; }

  /* Footer */
  footer {
    padding: 40px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    background: var(--bg);
    border-top: 1px solid var(--line);
  }
  footer .slogan-cn {
    font-size: 14px;
    color: var(--ink-soft);
    margin-bottom: 8px;
    letter-spacing: 0.08em;
    font-weight: 500;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 720px) {
    .topbar-inner { padding: 14px 20px; }
    .back-link { padding: 8px 12px; font-size: 12px; }
    .page-hero { padding: 56px 22px 24px; }
    .page-lede { font-size: 15px; }
    .season-archive { padding: 24px 22px 64px; }
    .season-bar-wrap { max-width: 100%; }
    .season-bar-arrow { width: 42px; }
    .season-bar-label { font-size: 14px; }
    .team-tab { padding: 11px 22px; font-size: 13.5px; }
    .season-board { padding: 24px 20px 20px; }
    .season-board-title { font-size: 20px; margin-bottom: 14px; padding-left: 13px; }
    /* 手机端：赛事结果在上、球员名单在下，中间一条细横线分隔 */
    .matches-section-grid { grid-template-columns: 1fr; gap: 0; }
    .matches-results-col {
      order: 1; padding-left: 0; border-left: none;
      padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px solid var(--line);
    }
    .matches-roster-col { order: 2; padding-right: 0; }
    .matches-section-title { font-size: 22px; padding-left: 14px; }
    .matches-section-title::before { width: 4px; }
    .matches-section-meta { padding-left: 14px; }
    .matches-section-summary { font-size: 12px; }
    .matches-section-summary .ms-stat { padding: 4px 8px; }
    .match-row { grid-template-columns: 70px 1fr auto; gap: 10px; padding: 12px 12px 12px 16px; }
    .match-team { font-size: 13.5px; }
    .match-score { font-size: 13px; padding: 4px 9px; }
    .match-result { width: 26px; height: 26px; font-size: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <img class="brand-mark" src="assets/logo.png" alt="Davis Origin Logo" />
      <div>
        <div class="brand-name">Davis Origin<span class="brand-sub">戴维斯原点</span></div>
      </div>
    </a>
    <a class="back-link" href="index.html">← 返回主页</a>
  </div>
</header>

<section class="page-hero">
  <div class="page-eyebrow">Seasons · 赛季</div>
  <h1 class="page-title">Seasons<em>.</em></h1>
  <p class="page-lede">Davis Origin · 戴维斯原点足球俱乐部</p>
</section>

<section class="season-archive">
  <div class="season-backdrop" id="seasonBackdrop"></div>
  <div class="season-bar-wrap" id="seasonBarWrap">
    <div class="season-bar" id="seasonBar" role="group" aria-label="选择赛季"></div>
  </div>
  <div class="season-archive-body" id="seasonArchiveBody"></div>
</section>

<footer>
  <div class="slogan-cn">岂曰无衣？与子同袍。</div>
  © Davis Origin · 戴维斯原点足球俱乐部 · UC Davis
</footer>

<script src="seasons.js"></script>
<script>
  (function() {
    var barEl = document.getElementById('seasonBar');
    var wrapEl = document.getElementById('seasonBarWrap');
    var backdrop = document.getElementById('seasonBackdrop');
    var bodyEl = document.getElementById('seasonArchiveBody');
    if (!barEl || !wrapEl || !backdrop || !bodyEl || !window.SEASON_DATA) return;
    var seasons = (window.SEASON_DATA.seasons || []).slice().reverse(); // 按时间从早到晚显示
    if (!seasons.length) return;

    var POSITION_ORDER = ['gk', 'def', 'mid', 'fwd'];
    // 板块显示顺序：优先从 seasons.js 里每个赛事对象自带的 order 字段算出来
    // （内容管理后台"发布上线"时会自动写上，跟后台的赛事排序设置保持一致）。
    // 这里保留一份兜底顺序，只在读到老格式（没有 order 字段）的 seasons.js
    // 时才用得上：北加联（5月）→ 校际杯（3月）→ 贺岁杯（次年1月）→ 华体会
    // （11月，属于这个赛季周期里最早的一段）。校际杯（jiaoji）和华体会
    // （huati）是两个不同的赛事，不要合并成一个板块。
    var FALLBACK_CATEGORY_ORDER = ['league', 'jiaoji', 'xinnian', 'huati'];
    function computeCategoryOrder(seasonsList) {
      var orderMap = {};
      (seasonsList || []).forEach(function(s) {
        var scopes = [s.matches || {}];
        ['first', 'reserve'].forEach(function(tk) {
          var t = (s.teams || {})[tk];
          if (t) scopes.push(t.matches || {});
        });
        scopes.forEach(function(catMap) {
          Object.keys(catMap).forEach(function(key) {
            var o = catMap[key] && catMap[key].order;
            if (typeof o === 'number' && orderMap[key] === undefined) orderMap[key] = o;
          });
        });
      });
      var keys = Object.keys(orderMap);
      if (!keys.length) return FALLBACK_CATEGORY_ORDER.slice();
      keys.sort(function(a, b) { return orderMap[a] - orderMap[b]; });
      FALLBACK_CATEGORY_ORDER.forEach(function(k) { if (keys.indexOf(k) === -1) keys.push(k); });
      return keys;
    }
    var CATEGORY_ORDER = computeCategoryOrder(seasons);
    var TEAM_ORDER = ['first', 'reserve'];
    var TEAM_FALLBACK_LABEL = { first: '一队', reserve: '预备队' };

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function(c) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
      });
    }
    function resultLabel(result) {
      if (result === 'win') return 'W';
      if (result === 'draw') return 'D';
      if (result === 'loss') return 'L';
      return '–';
    }
    function teamSpan(team) {
      var cls = 'match-team' + (team.davis ? ' davis' : '') + (team.winner ? ' winner' : '');
      return '<span class="' + cls + '">' + escapeHtml(team.name) + '</span>';
    }
    function matchRowHtml(m) {
      var resultCls = 'match-result' + (m.result !== 'win' ? ' ' + m.result : '');
      var rowCls = 'match-row' + (m.result !== 'win' ? ' ' + m.result : '');
      return '<div class="' + rowCls + '">' +
        '<div class="match-date-col">' +
          '<div class="match-date-day">' + escapeHtml(m.date) + '</div>' +
          '<div class="match-date-time">' + escapeHtml(m.time || '') + '</div>' +
        '</div>' +
        '<div class="match-teams">' +
          teamSpan(m.team1) +
          '<span class="match-score">' + escapeHtml(m.score) + '</span>' +
          teamSpan(m.team2) +
        '</div>' +
        '<div class="' + resultCls + '">' + resultLabel(m.result) + '</div>' +
      '</div>';
    }
    function hasRealContent(s) {
      var roster = s.roster || {};
      var rosterTotal = POSITION_ORDER.reduce(function(sum, p) { return sum + (roster[p] || []).length; }, 0);
      var matchesTotal = CATEGORY_ORDER.reduce(function(sum, k) {
        return sum + (((s.matches || {})[k] || {}).matches || []).length;
      }, 0);
      return rosterTotal > 0 || matchesTotal > 0;
    }

    function rosterObjTotal(roster) {
      roster = roster || {};
      return POSITION_ORDER.reduce(function(sum, p) { return sum + (roster[p] || []).length; }, 0);
    }
    function rosterTotal(t) { return rosterObjTotal(t && t.roster); }

    function teamHasContent(t) {
      if (!t) return false;
      var matchesTotal = CATEGORY_ORDER.reduce(function(sum, key) {
        return sum + (((t.matches || {})[key] || {}).matches || []).length;
      }, 0);
      var hasNotes = CATEGORY_ORDER.some(function(key) { return !!(((t.matches || {})[key] || {}).note); });
      return matchesTotal > 0 || hasNotes || rosterTotal(t) > 0;
    }

    // 每个赛事板块自己的球员名单——如果这个赛事没有单独整理名单（cat.roster），
    // 就先用这支队伍的整体名单占位（以后要给某个赛事配一份专属名单，
    // 直接在 seasons.js 对应赛事对象上加一个 roster 字段即可）。
    function categoryRosterHtml(roster) {
      var html = '<div class="roster-col-title">球员名单</div>';
      if (rosterObjTotal(roster) === 0) {
        return html + '<div class="archive-empty-note">名单还没整理。</div>';
      }
      html += POSITION_ORDER.filter(function(p) { return (roster[p] || []).length > 0; }).map(function(p) {
        var players = roster[p] || [];
        var posCn = { gk: '门将', def: '后场', mid: '中场', fwd: '前场' }[p];
        return '<div class="roster-position-group" style="--pos: var(--pos-' + p + ')">' +
          '<div class="roster-position-head"><span class="pos-cn">' + posCn + '</span>' +
          '<span class="pos-count">' + players.length + ' 人</span></div>' +
          '<div class="roster-player-grid">' +
            players.map(function(name) { return '<div class="roster-player-chip">' + escapeHtml(name) + '</div>'; }).join('') +
          '</div>' +
        '</div>';
      }).join('');
      return html;
    }

    function categoryResultsHtml(cat) {
      var hasMatches = cat.matches && cat.matches.length;
      if (hasMatches) return cat.matches.map(matchRowHtml).join('');
      if (cat.note) return '<div class="matches-section-note">' + escapeHtml(cat.note) + '</div>';
      return '<div class="archive-empty-note">比赛结果还没整理。</div>';
    }

    // 从这个赛事已有的比赛列表里实时算战绩（场次/胜/平/负/净胜球），
    // 不用额外存数据，比赛一加/一改这里自动跟着变
    function categoryRecord(cat) {
      var matches = (cat && cat.matches) || [];
      if (!matches.length) return null;
      var w = 0, d = 0, l = 0, gf = 0, ga = 0;
      matches.forEach(function(m) {
        if (m.result === 'win') w++;
        else if (m.result === 'draw') d++;
        else if (m.result === 'loss') l++;
        var parts = String(m.score || '').split(':').map(function(x) { return parseInt(x, 10); });
        if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
          var davisIsTeam1 = m.team1 && m.team1.davis;
          gf += davisIsTeam1 ? parts[0] : parts[1];
          ga += davisIsTeam1 ? parts[1] : parts[0];
        }
      });
      return { total: matches.length, w: w, d: d, l: l, gf: gf, ga: ga, gd: gf - ga };
    }

    function categorySummaryHtml(cat) {
      var rec = categoryRecord(cat);
      if (!rec) return '';
      var gdStr = rec.gd > 0 ? ('+' + rec.gd) : String(rec.gd);
      return '<div class="matches-section-summary">' +
        '<span class="ms-stat ms-stat-total">' + rec.total + ' 战</span>' +
        '<span class="ms-stat ms-stat-win">' + rec.w + ' 胜</span>' +
        '<span class="ms-stat ms-stat-draw">' + rec.d + ' 平</span>' +
        '<span class="ms-stat ms-stat-loss">' + rec.l + ' 负</span>' +
        '<span class="ms-stat ms-stat-gd">净胜球 ' + gdStr + '</span>' +
      '</div>';
    }

    // 比赛地点 / 赛事时间——数据来自赛事对象上可选的 venue / schedule 字段，
    // 哪个没有就不显示哪个，两个都没有就整行都不出现
    function categoryMetaHtml(cat) {
      var parts = [];
      if (cat.venue) parts.push('<span><span class="meta-label">比赛地点</span>' + escapeHtml(cat.venue) + '</span>');
      if (cat.schedule) parts.push('<span><span class="meta-label">赛事时间</span>' + escapeHtml(cat.schedule) + '</span>');
      if (!parts.length) return '';
      return '<div class="matches-section-meta">' + parts.join('') + '</div>';
    }

    // 每个赛事板块（北加联/华体会/贺岁杯）都是独立一份：自己的球员名单 + 自己的比赛结果
    function categorySectionHtml(cat, fallbackRoster) {
      if (!cat) return '';
      var roster = cat.roster || fallbackRoster || {};
      var hasMatches = cat.matches && cat.matches.length;
      var hasRoster = rosterObjTotal(roster) > 0;
      if (!hasMatches && !cat.note && !hasRoster) return '';
      return '<div class="matches-section">' +
        '<div class="matches-section-head">' +
          '<div class="matches-section-title">' + escapeHtml(cat.label) + '</div>' +
          categorySummaryHtml(cat) +
        '</div>' +
        categoryMetaHtml(cat) +
        '<div class="matches-section-grid">' +
          '<div class="matches-roster-col">' + categoryRosterHtml(roster) + '</div>' +
          '<div class="matches-results-col">' + categoryResultsHtml(cat) + '</div>' +
        '</div>' +
      '</div>';
    }

    function teamPanelHtml(t, teamKey) {
      if (!t) {
        return '<div class="archive-empty-note">这支队伍这个赛季还没有数据。</div>';
      }
      if (!teamHasContent(t) && t.note) {
        return '<div class="archive-empty-note">' + escapeHtml(t.note) + '</div>';
      }
      var html = '';
      if (t.note) {
        html += '<div class="team-note">' + escapeHtml(t.note) + '</div>';
      }
      var sections = CATEGORY_ORDER.map(function(key) {
        return categorySectionHtml((t.matches || {})[key], t.roster);
      }).filter(Boolean);
      html += sections.length ? sections.join('') : '<div class="archive-empty-note">' + escapeHtml((t && t.label) || TEAM_FALLBACK_LABEL[teamKey]) + '这个赛季还没有比赛记录。</div>';
      return html;
    }

    function renderSeasonPanel(s) {
      var html = '';
      if (s.highlights && s.highlights.length) {
        html += '<div class="season-board">' +
          '<div class="season-board-title">这一年的我们</div>' +
          '<ul class="season-highlights">' +
            s.highlights.map(function(h) { return '<li>' + escapeHtml(h) + '</li>'; }).join('') +
          '</ul>' +
        '</div>';
      }

      var teams = s.teams || {};
      html += '<div class="team-tabs" id="teamTabs" role="tablist">' +
        TEAM_ORDER.map(function(key) {
          var t = teams[key];
          var label = (t && t.label) || TEAM_FALLBACK_LABEL[key];
          return '<button type="button" class="team-tab' + (key === activeTeam ? ' active' : '') + '" data-team="' +
            key + '">' + escapeHtml(label) + '</button>';
        }).join('') +
      '</div>';

      html += '<div class="team-panel" id="teamPanel">' + teamPanelHtml(teams[activeTeam], activeTeam) + '</div>';

      return html;
    }

    var defaultSeason = seasons.find(hasRealContent) || seasons.find(function(s) { return s.current; }) || seasons[0];
    var currentIndex = seasons.indexOf(defaultSeason);
    if (currentIndex < 0) currentIndex = 0;
    var activeTeam = 'first';

    var ARROW_LEFT_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>';
    var ARROW_RIGHT_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

    // 普通情况：一整条长方形，‹ 箭头 | 当前赛季（居中，颜色突出） | 箭头 ›。
    // 中间这块（seasonBarCenter）里叠放着两层：平时显示的单行文字
    // （seasonBarCenterLabel）和点开后才会显示的滚轮（seasonBarWheel）——
    // 显示当前赛季和挑选赛季用的是同一块地方，不是分开的两个东西。
    barEl.innerHTML =
      '<button type="button" class="season-bar-arrow" id="seasonPrevBtn" aria-label="上一个赛季">' + ARROW_LEFT_SVG + '</button>' +
      '<div class="season-bar-center" id="seasonBarCenter">' +
        '<div class="season-bar-center-label" id="seasonBarCenterLabel">' +
          '<span class="season-bar-label" id="seasonBarLabel"></span>' +
          '<span class="season-bar-tag" id="seasonBarTag" hidden>现役</span>' +
        '</div>' +
        '<div class="season-bar-wheel" id="seasonBarWheel"></div>' +
      '</div>' +
      '<button type="button" class="season-bar-arrow" id="seasonNextBtn" aria-label="下一个赛季">' + ARROW_RIGHT_SVG + '</button>';

    var prevBtn = document.getElementById('seasonPrevBtn');
    var nextBtn = document.getElementById('seasonNextBtn');
    var barCenter = document.getElementById('seasonBarCenter');
    var barLabel = document.getElementById('seasonBarLabel');
    var barTag = document.getElementById('seasonBarTag');
    var barWheel = document.getElementById('seasonBarWheel');

    // 滚轮内容：固定 3 行高度，正在看的赛季永远在正中间；前后各放一个
    // 和一行等高的占位 spacer，这样第一个/最后一个赛季也能被滚动到
    // 正中间。
    barWheel.innerHTML =
      '<div class="season-wheel-spacer" aria-hidden="true"></div>' +
      seasons.map(function(sn, i) {
        return '<div class="season-wheel-popup-item" data-index="' + i + '">' +
          escapeHtml(sn.label) + (sn.current ? '<span class="tag">现役</span>' : '') +
        '</div>';
      }).join('') +
      '<div class="season-wheel-spacer" aria-hidden="true"></div>';

    function refreshPopupActive() {
      Array.prototype.forEach.call(barWheel.querySelectorAll('.season-wheel-popup-item'), function(el) {
        el.classList.toggle('active', Number(el.dataset.index) === currentIndex);
      });
    }

    // 滚动时找到离滚轮正中间最近的那一项，给它加上"当前查看"的放大高亮样式，
    // 模拟真正滚轮"选中项永远居中"的感觉
    function updateCenteredItem() {
      var wrapRect = barWheel.getBoundingClientRect();
      var mid = wrapRect.top + wrapRect.height / 2;
      var items = barWheel.querySelectorAll('.season-wheel-popup-item');
      var closest = null, closestDist = Infinity;
      Array.prototype.forEach.call(items, function(el) {
        var r = el.getBoundingClientRect();
        var dist = Math.abs((r.top + r.height / 2) - mid);
        if (dist < closestDist) { closestDist = dist; closest = el; }
      });
      Array.prototype.forEach.call(items, function(el) { el.classList.toggle('centered', el === closest); });
      return closest;
    }
    var wheelScrollRaf = null;
    barWheel.addEventListener('scroll', function() {
      if (wheelScrollRaf) return;
      wheelScrollRaf = requestAnimationFrame(function() {
        wheelScrollRaf = null;
        updateCenteredItem();
      });
    });

    function isExpanded() { return wrapEl.classList.contains('expanded'); }

    function openWheel() {
      wrapEl.classList.add('expanded');
      backdrop.classList.add('show');
      var activeItem = barWheel.querySelector('.season-wheel-popup-item.active');
      if (activeItem) activeItem.scrollIntoView({ block: 'center' });
      updateCenteredItem();
    }
    function closeWheel() {
      wrapEl.classList.remove('expanded');
      backdrop.classList.remove('show');
    }

    function updateBar(direction) {
      var s = seasons[currentIndex];
      prevBtn.disabled = currentIndex <= 0;
      nextBtn.disabled = currentIndex >= seasons.length - 1;

      barLabel.textContent = s.label;
      barLabel.classList.remove('slide-in-next', 'slide-in-prev');
      void barLabel.offsetWidth; // 强制重排，让滑入动画能重新播放
      if (direction === 'next') barLabel.classList.add('slide-in-next');
      else if (direction === 'prev') barLabel.classList.add('slide-in-prev');
      barTag.hidden = !s.current;

      refreshPopupActive();
      if (isExpanded()) {
        var activeItem = barWheel.querySelector('.season-wheel-popup-item.active');
        if (activeItem) activeItem.scrollIntoView({ block: 'center' });
        updateCenteredItem();
      }

      if (direction === 'next' || direction === 'prev') {
        var arrowBtn = direction === 'next' ? nextBtn : prevBtn;
        arrowBtn.classList.remove('pulse');
        void arrowBtn.offsetWidth;
        arrowBtn.classList.add('pulse');
      }
    }

    function renderBody() {
      var s = seasons[currentIndex];
      bodyEl.classList.remove('enter');
      void bodyEl.offsetWidth; // 强制重排，让内容进场动画能重新播放
      bodyEl.innerHTML = renderSeasonPanel(s);
      bodyEl.classList.add('enter');
    }

    // 切一队/预备队：只重新渲染 #teamPanel 这一块，简介（这一年的我们）
    // 和上面的切换按钮本身都不动，不会有整个内容区跟着刷新的闪烁感
    function switchTeam(key) {
      if (key === activeTeam) return;
      activeTeam = key;
      Array.prototype.forEach.call(document.querySelectorAll('.team-tab'), function(el) {
        el.classList.toggle('active', el.dataset.team === key);
      });
      var s = seasons[currentIndex];
      var teams = s.teams || {};
      var panelEl = document.getElementById('teamPanel');
      if (!panelEl) return;
      panelEl.classList.remove('enter');
      void panelEl.offsetWidth;
      panelEl.innerHTML = teamPanelHtml(teams[key], key);
      panelEl.classList.add('enter');
    }

    function goTo(idx, direction) {
      if (idx === currentIndex || idx < 0 || idx >= seasons.length) return;
      currentIndex = idx;
      activeTeam = 'first';
      updateBar(direction);
      renderBody();
    }

    prevBtn.addEventListener('click', function() { goTo(currentIndex - 1, 'prev'); });
    nextBtn.addEventListener('click', function() { goTo(currentIndex + 1, 'next'); });

    barCenter.addEventListener('click', function(e) {
      e.stopPropagation();
      if (isExpanded()) closeWheel(); else openWheel();
    });
    backdrop.addEventListener('click', closeWheel);
    barWheel.addEventListener('click', function(e) {
      e.stopPropagation(); // 别让点击冒泡到 barCenter，导致关了又马上被重新打开
      var item = e.target.closest('.season-wheel-popup-item');
      if (!item) return;
      var idx = Number(item.dataset.index);
      var dir = idx === currentIndex - 1 ? 'prev' : idx === currentIndex + 1 ? 'next' : null;
      goTo(idx, dir);
      closeWheel();
    });
    document.addEventListener('click', function(e) {
      if (isExpanded() && !e.target.closest('#seasonBarWrap')) {
        closeWheel();
      }
    });

    document.querySelector('.season-archive').addEventListener('click', function(e) {
      var teamBtn = e.target.closest('.team-tab');
      if (teamBtn) {
        switchTeam(teamBtn.dataset.team);
      }
    });

    updateBar(null);
    renderBody();
  })();
</script>

</body>
</html>
