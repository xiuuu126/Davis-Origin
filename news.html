<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>新闻动态 · Davis Origin</title>
<link rel="icon" type="image/png" href="assets/logo.png" />
<style>
  :root {
    --bg: #f7f5f0;
    --bg-soft: #fafaf7;
    --ink: #0a0e1a;
    --ink-soft: #3d4151;
    --muted: #8a8a92;
    --line: #e6e2d8;
    --line-soft: #efece3;
    --accent: #1e3a8a;
    --accent-deep: #0f1d4d;
    --accent-soft: #eaf0fb;
    --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--accent); color: #fff; }

  /* ===== Topbar ===== */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(247, 245, 240, 0.88);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 1400px;
    margin: 0 auto;
    padding: 18px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; }
  .brand-mark {
    width: 40px; height: 40px;
    object-fit: contain;
    transition: transform .4s cubic-bezier(.4,0,.2,1);
  }
  .brand:hover .brand-mark { transform: rotate(-10deg) scale(1.08); }
  .brand-name { font-size: 16px; letter-spacing: -0.005em; }
  .brand-sub { color: var(--muted); font-size: 12px; margin-left: 6px; font-weight: 400; }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 13px;
    color: var(--ink-soft);
    background: var(--bg-soft);
    transition: all .3s ease;
    cursor: pointer;
    font-family: inherit;
  }
  .back-link:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
    transform: translateX(-3px);
  }

  /* ==================== LIST VIEW ==================== */
  .view-list {
    max-width: 1080px;
    margin: 0 auto;
    padding: 96px 40px 96px;
  }
  .list-hero {
    margin-bottom: 80px;
    position: relative;
  }
  .list-eyebrow {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 24px;
    animation: fadeUp .8s ease both;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .list-eyebrow::before {
    content: '';
    width: 36px;
    height: 1.5px;
    background: var(--accent);
  }
  .list-title {
    font-size: clamp(64px, 11vw, 144px);
    font-weight: 900;
    letter-spacing: -0.055em;
    line-height: 0.92;
    margin-bottom: 28px;
    animation: fadeUp .9s ease .1s both;
  }
  .list-title em {
    font-style: italic;
    font-weight: 400;
    color: var(--accent);
  }
  .list-sub {
    font-size: 19px;
    color: var(--ink-soft);
    font-weight: 400;
    letter-spacing: -0.005em;
    max-width: 540px;
    animation: fadeUp .9s ease .2s both;
  }
  .list-count {
    position: absolute;
    top: 8px;
    right: 0;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.15em;
    font-weight: 600;
    animation: fadeUp .9s ease .3s both;
  }

  .article-list {
    border-top: none;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .article-item {
    display: flex;
    flex-direction: column;
    gap: 14px;
    position: relative;
    overflow: hidden;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 32px 36px;
    cursor: pointer;
    text-decoration: none;
    transition: transform .35s cubic-bezier(.4,0,.2,1), box-shadow .35s ease, border-color .35s ease;
    opacity: 0;
    transform: translateY(20px);
    animation: itemIn .6s ease forwards;
  }
  @keyframes itemIn { to { opacity: 1; transform: translateY(0); } }
  .article-item::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--accent);
    opacity: 0;
    transition: opacity .3s ease;
  }
  .article-item:hover {
    border-color: var(--accent);
    box-shadow: 0 20px 44px -26px rgba(10, 14, 26, .35);
    transform: translateY(-4px);
  }
  .article-item:hover::before { opacity: 1; }
  .article-item-num {
    position: absolute;
    top: 14px;
    right: 28px;
    font-size: 56px;
    font-weight: 900;
    line-height: 1;
    color: var(--line);
    letter-spacing: -0.03em;
    pointer-events: none;
    z-index: 0;
    transition: color .35s ease;
  }
  .article-item:hover .article-item-num { color: var(--line-soft); }
  .article-top {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding-right: 72px;
  }
  .article-tag {
    display: inline-flex;
    align-items: center;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 6px 14px;
    border-radius: 999px;
  }
  .article-date-label {
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    font-weight: 500;
    white-space: nowrap;
  }
  .article-title-link {
    position: relative;
    z-index: 1;
    font-size: clamp(20px, 2.6vw, 27px);
    font-weight: 800;
    letter-spacing: -0.018em;
    line-height: 1.3;
    color: var(--ink);
    padding-right: 72px;
    transition: color .25s ease;
  }
  .article-item:hover .article-title-link { color: var(--accent); }
  .article-excerpt {
    position: relative;
    z-index: 1;
    font-size: 14.5px;
    line-height: 1.7;
    color: var(--ink-soft);
    max-width: 640px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .article-readmore {
    position: relative;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    margin-top: 4px;
  }
  .article-arrow {
    display: inline-block;
    color: var(--accent);
    margin-left: 6px;
    transition: transform .35s cubic-bezier(.4,0,.2,1);
  }
  .article-item:hover .article-arrow { transform: translateX(6px); }

  /* ==================== ARTICLE VIEW ==================== */
  .view-article {
    display: none;
    max-width: 720px;
    margin: 0 auto;
    padding: 56px 40px 96px;
  }
  .view-article.active {
    display: block;
    animation: pageIn .5s ease both;
  }
  @keyframes pageIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .article-meta-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 48px;
    gap: 16px;
  }
  .article-eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 20px;
  }
  .article-title {
    font-size: clamp(36px, 5.5vw, 56px);
    font-weight: 900;
    letter-spacing: -0.035em;
    line-height: 1.08;
    margin-bottom: 24px;
    color: var(--ink);
  }
  .article-meta {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 56px;
    padding-bottom: 32px;
    border-bottom: 2px solid var(--ink);
    font-size: 13px;
    color: var(--ink-soft);
    flex-wrap: wrap;
    font-weight: 500;
  }
  .article-meta-dot {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--muted);
  }
  .article-body {
    font-size: 17.5px;
    line-height: 1.85;
    color: var(--ink);
    letter-spacing: -0.003em;
  }
  .article-body p {
    margin-bottom: 26px;
  }
  .article-body p.lead {
    font-size: 20px;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.6;
    margin-bottom: 32px;
  }
  .article-body strong {
    color: var(--accent);
    font-weight: 700;
  }
  .article-body em {
    font-style: normal;
    border-bottom: 2px solid var(--accent-soft);
    padding-bottom: 1px;
  }
  .article-body blockquote {
    margin: 40px -8px;
    padding: 4px 0 4px 24px;
    border-left: 3px solid var(--accent);
    font-size: 22px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.4;
    letter-spacing: -0.01em;
  }
  .article-body blockquote cite {
    display: block;
    margin-top: 12px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-style: normal;
    font-weight: 500;
  }
  .article-body ul {
    list-style: none;
    margin-bottom: 26px;
  }
  .article-body ul li {
    padding-left: 28px;
    margin-bottom: 12px;
    position: relative;
  }
  .article-body ul li::before {
    content: '';
    position: absolute;
    left: 0; top: 14px;
    width: 16px;
    height: 1.5px;
    background: var(--accent);
  }

  /* ===== Image placeholders ===== */
  .article-figure {
    margin: 40px -40px;
    border-radius: 16px;
    overflow: hidden;
    background: linear-gradient(135deg, #c7d6e8 0%, #e5edf4 50%, #d4dfeb 100%);
    position: relative;
    aspect-ratio: 4 / 3;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 20px;
  }
  .article-figure-portrait { aspect-ratio: 3 / 4; }
  .article-figure-wide { aspect-ratio: 16 / 9; }
  .article-figure-square { aspect-ratio: 1 / 1; }
  .article-figure-icon {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    display: grid;
    place-items: center;
    margin-bottom: 14px;
    font-size: 22px;
  }
  .article-figure-label {
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 8px;
    opacity: 0.85;
  }
  .article-figure-path {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: var(--ink-soft);
    background: rgba(255,255,255,0.7);
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px dashed var(--ink-soft);
  }
  .article-figure img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
  }
  .article-figure figcaption {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.78));
    color: #fff;
    padding: 32px 22px 16px;
    font-size: 13px;
    z-index: 2;
  }

  /* Article navigation */
  .article-nav {
    margin-top: 80px;
    padding-top: 40px;
    border-top: 1px solid var(--line);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .article-nav-item {
    padding: 22px 24px;
    border: 1px solid var(--line);
    border-radius: 14px;
    cursor: pointer;
    transition: border-color .25s, transform .3s, box-shadow .3s, background .25s;
    background: var(--card);
  }
  .article-nav-item:hover {
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 16px 36px rgba(13, 18, 36, 0.08);
  }
  .article-nav-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .article-nav-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.4;
  }
  .article-nav-item.next { text-align: right; }
  .article-nav-item.disabled {
    opacity: 0.4;
    cursor: default;
    pointer-events: none;
  }

  /* Footer */
  footer {
    padding: 40px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    background: var(--bg);
    border-top: 1px solid var(--line);
  }
  footer .slogan-cn {
    font-size: 14px;
    color: var(--ink-soft);
    margin-bottom: 8px;
    letter-spacing: 0.08em;
    font-weight: 500;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 720px) {
    .topbar-inner { padding: 14px 20px; }
    .back-link { padding: 8px 12px; font-size: 12px; }
    .view-list { padding: 56px 22px 64px; }
    .list-hero { margin-bottom: 48px; }
    .list-count { display: none; }
    .list-sub { font-size: 16px; }
    .article-item { padding: 24px 22px; border-radius: 18px; gap: 12px; }
    .article-item-num { font-size: 40px; top: 10px; right: 18px; }
    .article-top, .article-title-link { padding-right: 52px; }
    .article-excerpt { -webkit-line-clamp: 3; }
    .view-article { padding: 32px 22px 64px; }
    .article-figure { margin: 28px -14px; }
    .article-body { font-size: 16px; }
    .article-body blockquote { font-size: 19px; }
    .article-nav { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <img class="brand-mark" src="assets/logo.png" alt="Davis Origin Logo" />
      <div>
        <div class="brand-name">Davis Origin<span class="brand-sub">戴维斯原点</span></div>
      </div>
    </a>
    <a class="back-link" href="index.html">← 返回主页</a>
  </div>
</header>

<!-- ============ LIST VIEW ============ -->
<section class="view-list" id="viewList">
  <header class="list-hero">
    <div class="list-eyebrow">News · 新闻动态</div>
    <h1 class="list-title">News<em>.</em></h1>
    <p class="list-sub">球队的战报、动态、回忆。每一篇都是我们一起留下的脚印。</p>
    <div class="list-count" id="listCount"></div>
  </header>

  <div class="article-list" id="articleList"></div>
</section>

<!-- 每篇文章的正文视图（原来是 14 段手写的 article 标签，现在改成从
     window.NEWS_DATA 动态生成，下面这段脚本负责拼 HTML） -->
<div id="articleViews"></div>

<footer>
  <div class="slogan-cn">岂曰无衣？与子同袍。</div>
  © Davis Origin · 戴维斯原点足球俱乐部 · UC Davis
</footer>

<script src="news-data.js"></script>
<script>
  /* ===================== 从 window.NEWS_DATA 渲染出整份页面 =====================
   * 以前这里是 14 段手写的 <article>，改成内容管理后台可编辑之后，改成跟
   * seasons.html 一样的模式：静态模板 + 一份 window.NEWS_DATA（news-data.js，
   * 由 Worker 在"发布上线"时自动生成），页面加载时用 JS 拼出同样的 DOM。
   * hash 路由（#n<id>）、列表/文章视图切换、上一篇/下一篇这些交互逻辑完全没变。 */

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  // 轻量 markdown：先转义特殊字符，再把 **加粗** / _斜体_ 换成 <strong>/<em>，
  // 这样正文里就算有用户直接打的 "<""字符也不会被当成标签解析。
  function liteMdToHtml(text) {
    return escapeHtml(text)
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/_([^_]+)_/g, '<em>$1</em>')
      .replace(/\n/g, '<br>');
  }
  function dateParts(iso) {
    const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return null;
    return { y: m[1], mo: m[2], d: m[3] };
  }

  const FIGURE_SHAPE_CLASS = { wide: 'article-figure-wide', square: 'article-figure-square', portrait: 'article-figure-portrait', default: '' };
  function figureHtml(shapeClass, path, icon, caption) {
    const cls = 'article-figure' + (shapeClass ? ' ' + shapeClass : '');
    return `<figure class="${cls}" data-path="${escapeHtml(path)}">
      <div class="article-figure-icon">${escapeHtml(icon || '📷')}</div>
      <div class="article-figure-label">${escapeHtml(caption || '')}</div>
      <div class="article-figure-path">${escapeHtml(path || '')}</div>
      <img src="${escapeHtml(path)}" alt="" onerror="this.style.display='none'" />
    </figure>`;
  }
  function blockHtml(b) {
    if (b.type === 'lead') return `<p class="lead">${liteMdToHtml(b.text)}</p>`;
    if (b.type === 'p') return `<p>${liteMdToHtml(b.text)}</p>`;
    if (b.type === 'quote') return `<blockquote>${liteMdToHtml(b.text)}</blockquote>`;
    if (b.type === 'list') {
      const items = String(b.text || '').split('\n').map(s => s.trim()).filter(Boolean);
      return `<ul>${items.map(it => `<li>${liteMdToHtml(it)}</li>`).join('')}</ul>`;
    }
    const shape = { image_wide: 'wide', image_square: 'square', image_portrait: 'portrait' }[b.type] || 'default';
    return figureHtml(FIGURE_SHAPE_CLASS[shape], b.image, b.icon, b.caption);
  }

  function metaLineHtml(a) {
    const parts = [];
    if (a.author) parts.push(`<span>${escapeHtml(a.author)}</span>`);
    const dp = dateParts(a.date);
    if (dp) parts.push(`<span>${dp.y} / ${dp.mo} / ${dp.d}</span>`);
    if (a.location) parts.push(`<span>${escapeHtml(a.location)}</span>`);
    return parts.join('<span class="article-meta-dot"></span>');
  }

  function articleViewHtml(a, idx, list) {
    const n = list.length;
    const num = String(idx + 1).padStart(2, '0');
    const prev = list[idx - 1], next = list[idx + 1];
    const cover = a.cover || {};
    const body = [
      figureHtml(FIGURE_SHAPE_CLASS[cover.shape] || '', cover.image, cover.icon, cover.caption),
      ...(a.blocks || []).map(blockHtml),
    ].join('\n');
    return `<article class="view-article" id="n${a.id}">
      <div class="article-meta-bar">
        <button class="back-link" onclick="goToList()">← 返回新闻</button>
        <span style="font-size:11px;color:var(--muted);letter-spacing:.18em;font-weight:600;">N° ${num} / ${n}</span>
      </div>
      ${a.eyebrow ? `<div class="article-eyebrow">${escapeHtml(a.eyebrow)}</div>` : ''}
      <h1 class="article-title">${escapeHtml(a.title)}</h1>
      <div class="article-meta">${metaLineHtml(a)}</div>
      <div class="article-body">${body}</div>
      <nav class="article-nav">
        <div class="article-nav-item${prev ? '' : ' disabled'}" ${prev ? `onclick="goTo('n${prev.id}')"` : ''}>
          <div class="article-nav-label">← 上一篇</div>
          <div class="article-nav-title">${prev ? escapeHtml(prev.title) : '已是最新'}</div>
        </div>
        <div class="article-nav-item next${next ? '' : ' disabled'}" ${next ? `onclick="goTo('n${next.id}')"` : ''}>
          <div class="article-nav-label">下一篇 →</div>
          <div class="article-nav-title">${next ? escapeHtml(next.title) : '已是最早'}</div>
        </div>
      </nav>
    </article>`;
  }

  function excerptText(a) {
    const blocks = a.blocks || [];
    const b = blocks.find(x => x.type === 'lead') || blocks.find(x => x.type === 'p');
    if (!b) return '';
    let t = String(b.text || '')
      .replace(/\*\*([^*]+)\*\*/g, '$1')
      .replace(/_([^_]+)_/g, '$1')
      .replace(/\n/g, ' ')
      .trim();
    const max = 78;
    if (t.length > max) t = t.slice(0, max).trim() + '…';
    return t;
  }

  function listItemHtml(a, idx) {
    const dp = dateParts(a.date);
    const dateLabel = dp ? `${dp.y}/${dp.mo}/${dp.d}` : '';
    const excerpt = excerptText(a);
    return `<a class="article-item" href="#n${a.id}" style="animation-delay: ${((idx + 1) * 0.05).toFixed(2)}s">
      <div class="article-item-num">${String(idx + 1).padStart(2, '0')}</div>
      <div class="article-top">
        ${a.eyebrow ? `<span class="article-tag">${escapeHtml(a.eyebrow)}</span>` : '<span></span>'}
        <span class="article-date-label">${escapeHtml(dateLabel)}</span>
      </div>
      <div class="article-title-link">${escapeHtml(a.title)}</div>
      ${excerpt ? `<p class="article-excerpt">${escapeHtml(excerpt)}</p>` : ''}
      <div class="article-readmore">阅读全文 <span class="article-arrow">→</span></div>
    </a>`;
  }

  const NEWS = (window.NEWS_DATA && window.NEWS_DATA.articles) || [];
  document.getElementById('listCount').textContent = `${NEWS.length} 篇文章 · 持续更新`;
  document.getElementById('articleList').innerHTML = NEWS.map((a, i) => listItemHtml(a, i)).join('');
  document.getElementById('articleViews').innerHTML = NEWS.map((a, i) => articleViewHtml(a, i, NEWS)).join('');

  const listView = document.getElementById('viewList');
  const articleViews = document.querySelectorAll('.view-article');

  function render() {
    const hash = window.location.hash.replace('#', '');
    if (hash && document.getElementById(hash)) {
      listView.style.display = 'none';
      articleViews.forEach(a => a.classList.remove('active'));
      document.getElementById(hash).classList.add('active');
      window.scrollTo(0, 0);
    } else {
      articleViews.forEach(a => a.classList.remove('active'));
      listView.style.display = '';
      window.scrollTo(0, 0);
    }
  }

  function goTo(id) {
    history.pushState(null, '', '#' + id);
    render();
  }
  function goToList() {
    history.pushState(null, '', window.location.pathname);
    render();
  }
  window.goTo = goTo;
  window.goToList = goToList;
  window.addEventListener('hashchange', render);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && window.location.hash) goToList();
  });
  render();
</script>

</body>
</html>
