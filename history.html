<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>过往经历 · Davis Origin</title>
<link rel="icon" type="image/png" href="assets/logo.png" />
<style>
  :root {
    --bg: #f7f5f0;
    --bg-soft: #fafaf7;
    --ink: #0a0e1a;
    --ink-soft: #3d4151;
    --muted: #8a8a92;
    --line: #e6e2d8;
    --accent: #1e3a8a;
    --accent-deep: #0f1d4d;
    --accent-soft: #eaf0fb;
    --gold: #c89134;
    --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 16px; line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--accent); color: #fff; }

  /* Topbar */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(247, 245, 240, 0.88);
    backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 1400px; margin: 0 auto;
    padding: 18px 40px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; }
  .brand-mark {
    width: 40px; height: 40px; object-fit: contain;
    transition: transform .4s cubic-bezier(.4,0,.2,1);
  }
  .brand:hover .brand-mark { transform: rotate(-10deg) scale(1.08); }
  .brand-name { font-size: 16px; }
  .brand-sub { color: var(--muted); font-size: 12px; margin-left: 6px; font-weight: 400; }
  .back-link {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px; border: 1px solid var(--line);
    border-radius: 999px; font-size: 13px;
    color: var(--ink-soft); background: var(--bg-soft);
    transition: all .3s ease;
  }
  .back-link:hover {
    border-color: var(--accent); color: var(--accent);
    background: var(--accent-soft); transform: translateX(-3px);
  }

  /* Hero */
  .page-hero {
    max-width: 1080px; margin: 0 auto;
    padding: 96px 40px 56px;
    border-bottom: 1px solid var(--line);
  }
  .page-eyebrow {
    font-size: 12px; font-weight: 700;
    letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 22px;
    display: flex; align-items: center; gap: 14px;
    animation: fadeUp .8s ease both;
  }
  .page-eyebrow::before {
    content: ''; width: 36px; height: 1.5px; background: var(--accent);
  }
  .page-title {
    font-size: clamp(56px, 9vw, 112px);
    font-weight: 900; letter-spacing: -0.04em;
    line-height: 0.95; margin-bottom: 24px;
    animation: fadeUp .9s ease .1s both;
  }
  .page-title em { font-style: italic; font-weight: 400; color: var(--accent); }
  .page-lede {
    font-size: 18px; color: var(--ink-soft);
    max-width: 600px;
    animation: fadeUp .9s ease .2s both;
  }
  .page-stats {
    display: flex; gap: 56px;
    margin-top: 48px; padding-top: 32px;
    border-top: 1px solid var(--line);
    animation: fadeUp .9s ease .3s both;
  }
  .page-stat-num {
    font-size: 32px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .page-stat-label {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .history-link {
    display: inline-block;
    margin-top: 32px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
  }
  .history-link:hover { text-decoration: underline; }

  /* Timeline page */
  main.history-page {
    max-width: 880px; margin: 0 auto;
    padding: 96px 40px 96px;
    position: relative;
  }
  .year-divider {
    display: flex;
    align-items: center;
    gap: 18px;
    margin: 56px 0 36px;
    padding-left: 64px;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity .8s, transform .8s;
  }
  .year-divider.in { opacity: 1; transform: translateY(0); }
  .year-divider:first-child { margin-top: 0; }
  .year-label {
    font-size: clamp(36px, 5vw, 56px);
    font-weight: 900;
    letter-spacing: -0.04em;
    line-height: 1;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: var(--accent);
  }
  .year-label.gold {
    background: linear-gradient(135deg, var(--gold) 0%, #f4c460 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .year-tag {
    font-size: 11px;
    padding: 4px 10px;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 999px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .year-tag.gold { background: rgba(200,145,52,0.15); color: var(--gold); }
  .year-tag.silver { background: rgba(154,160,169,0.18); color: #6a7079; }
  .year-tag.now { background: var(--accent); color: #fff; }
  .year-label.silver {
    background: linear-gradient(135deg, #9aa0a9, #d8dce1);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .timeline {
    position: relative;
    padding-left: 64px;
  }
  .timeline::before {
    content: '';
    position: absolute;
    left: 15px; top: 0; bottom: 0;
    width: 2px;
    background: linear-gradient(180deg, var(--line) 0%, var(--line) 95%, transparent 100%);
  }
  .t-item {
    position: relative;
    padding-bottom: 40px;
    opacity: 0;
    transform: translateX(-12px);
    transition: opacity .8s, transform .8s;
  }
  .t-item.in { opacity: 1; transform: translateX(0); }
  .t-item:last-child { padding-bottom: 0; }
  .t-item::before {
    content: '';
    position: absolute;
    left: -56px; top: 6px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--card);
    border: 3px solid var(--accent);
    z-index: 2;
    transition: transform .3s, box-shadow .3s;
  }
  .t-item:hover::before {
    transform: scale(1.2);
    box-shadow: 0 0 0 6px var(--accent-soft);
  }
  .t-item.gold::before {
    border-color: var(--gold);
  }
  .t-item.gold:hover::before {
    box-shadow: 0 0 0 6px rgba(200,145,52,0.18);
  }
  .t-item.silver::before {
    border-color: #9aa0a9;
  }
  .t-item.now::before {
    background: var(--accent);
    border-color: var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 4px var(--accent-soft); }
    50% { box-shadow: 0 0 0 12px rgba(30,58,138,0.06); }
  }
  .t-date {
    font-size: 12px;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .t-item.gold .t-date { color: var(--gold); }
  .t-item.silver .t-date { color: #6a7079; }
  .t-now-badge {
    padding: 2px 8px;
    background: var(--accent);
    color: #fff;
    border-radius: 4px;
    font-size: 10px;
    letter-spacing: 0.1em;
    font-weight: 700;
  }
  .t-title {
    font-size: 24px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 14px;
    letter-spacing: -0.015em;
    line-height: 1.25;
  }
  .t-title-trophy::before {
    content: '🏆';
    margin-right: 10px;
  }
  .t-desc {
    font-size: 15.5px;
    color: var(--ink-soft);
    line-height: 1.85;
    margin-bottom: 12px;
  }
  .t-desc strong { color: var(--accent); font-weight: 700; }
  .t-item.gold .t-desc strong { color: var(--gold); }
  .t-desc em {
    font-style: normal;
    border-bottom: 2px solid var(--accent-soft);
    padding-bottom: 1px;
  }
  .t-tags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 14px;
  }
  .t-tag {
    font-size: 11px;
    color: var(--muted);
    padding: 4px 10px;
    background: rgba(255,255,255,0.6);
    border: 1px solid var(--line);
    border-radius: 999px;
    letter-spacing: 0.04em;
  }
  .t-quote {
    margin-top: 14px;
    padding: 14px 18px;
    background: var(--card);
    border-left: 3px solid var(--accent);
    border-radius: 0 10px 10px 0;
    font-size: 15px;
    color: var(--ink);
    font-weight: 600;
    line-height: 1.5;
    font-style: italic;
  }
  .t-item.gold .t-quote { border-left-color: var(--gold); }

  /* Footer */
  footer {
    padding: 56px 40px;
    text-align: center;
    background: var(--ink);
    color: rgba(255,255,255,0.6);
    font-size: 13px;
  }
  footer .footer-slogan {
    font-size: 18px;
    color: #fff;
    margin-bottom: 14px;
    letter-spacing: 0.15em;
    font-weight: 500;
  }
  footer .footer-meta {
    margin-top: 14px;
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.05em;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 720px) {
    .topbar-inner { padding: 14px 20px; }
    .back-link { padding: 8px 12px; font-size: 12px; }
    .page-hero { padding: 56px 22px 32px; }
    .page-lede { font-size: 15px; }
    .page-stats { gap: 32px; margin-top: 32px; padding-top: 22px; }
    .page-stat-num { font-size: 24px; }

    main.history-page { padding: 48px 22px 64px; }
    .year-divider { margin: 40px 0 24px; padding-left: 48px; gap: 12px; }
    .timeline { padding-left: 48px; }
    .t-item::before { left: -48px; width: 16px; height: 16px; top: 4px; }
    .t-item { padding-bottom: 32px; }
    .t-title { font-size: 19px; }
    .t-desc { font-size: 14.5px; }
    footer { padding: 40px 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <img class="brand-mark" src="assets/logo.png" alt="Davis Origin Logo" />
      <div>
        <div class="brand-name">Davis Origin<span class="brand-sub">戴维斯原点</span></div>
      </div>
    </a>
    <a class="back-link" href="index.html">← 返回主页</a>
  </div>
</header>

<section class="page-hero">
  <div class="page-eyebrow">History · 过往经历</div>
  <h1 class="page-title">Roadmap<em>.</em></h1>
  <p class="page-lede">从人员凋敝到 50+ 整装待发。我们一路走来的脚印，全在这里。</p>
  <div class="page-stats">
    <div>
      <div class="page-stat-num">5</div>
      <div class="page-stat-label">届足联杯</div>
    </div>
    <div>
      <div class="page-stat-num">2</div>
      <div class="page-stat-label">个赛事奖牌</div>
    </div>
    <div>
      <div class="page-stat-num">3</div>
      <div class="page-stat-label">年涅槃重建</div>
    </div>
  </div>
  <a class="history-link" href="seasons.html">→ 想按赛季查名单和比赛？去"赛季"</a>
</section>

<main class="history-page" id="historyMain"></main>

<footer>
  <div class="footer-slogan">岂曰无衣？与子同袍。</div>
  <div>© Davis Origin · 戴维斯原点足球俱乐部 · UC Davis</div>
  <div class="footer-meta">Davis Origin Football Club · China Origin Family</div>
</footer>

<script src="history-data.js"></script>
<script>
/** 时间线由内容管理后台生成（history-data.js -> window.HISTORY_DATA），
 *  这里只负责按数据渲染出跟原来手写页面一模一样的"年份分组 + 时间线条目"结构。
 *  正文（description）支持轻量 markdown（**加粗**、_斜体_），空行分段。 */
function escHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}
function liteMdInline(text) {
  return escHtml(text)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/_([^_]+)_/g, '<em>$1</em>');
}
function descToHtml(desc) {
  return String(desc || '').split(/\n\s*\n/).map(p => p.trim()).filter(Boolean)
    .map(p => `<p class="t-desc">${liteMdInline(p).replace(/\n/g, '<br>')}</p>`).join('');
}
function tagsHtml(tags) {
  if (!tags || !tags.length) return '';
  return `<div class="t-tags">${tags.map(t => `<span class="t-tag">${escHtml(t)}</span>`).join('')}</div>`;
}
function itemHtml(it) {
  const cls = ['t-item', it.tier || '', it.isNow ? 'now' : ''].filter(Boolean).join(' ');
  const titleCls = it.isTrophy ? ' t-title-trophy' : '';
  return `
    <div class="${cls}">
      <div class="t-date">${escHtml(it.dateLabel)}</div>
      <h3 class="t-title${titleCls}">${escHtml(it.title)}</h3>
      ${descToHtml(it.description)}
      ${it.quote ? `<div class="t-quote">${liteMdInline(it.quote)}</div>` : ''}
      ${tagsHtml(it.tags)}
    </div>`;
}
function yearBlockHtml(y) {
  const labelCls = ['year-label', y.tier || ''].filter(Boolean).join(' ');
  const tagCls = ['year-tag', y.special === 'now' ? 'now' : (y.tier || '')].filter(Boolean).join(' ');
  return `
  <div class="year-divider">
    <span class="${labelCls}">${escHtml(y.yearLabel)}</span>
    <span class="${tagCls}">${escHtml(y.yearTag)}</span>
  </div>
  <div class="timeline">
    ${(y.items || []).map(itemHtml).join('')}
  </div>`;
}
function renderHistory() {
  const years = (window.HISTORY_DATA && window.HISTORY_DATA.years) || [];
  const main = document.getElementById('historyMain');
  main.innerHTML = years.length
    ? years.map(yearBlockHtml).join('')
    : '<p style="color:var(--muted)">还没有内容。</p>';

  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('in');
        obs.unobserve(e.target);
      }
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
  document.querySelectorAll('.year-divider, .t-item').forEach(el => obs.observe(el));
}
renderHistory();
</script>

</body>
</html>
