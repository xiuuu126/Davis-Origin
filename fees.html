<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>训练查询 · Davis Origin</title>
<link rel="icon" type="image/png" href="assets/logo.png" />
<style>
  :root{
    --bg:#f7f5f0; --bg-soft:#fafaf7; --ink:#0a0e1a; --ink-soft:#3d4151;
    --muted:#8a8a92; --line:#e6e2d8; --accent:#1e3a8a; --accent-deep:#0f1d4d;
    --accent-soft:#eaf0fb; --card:#fff;
    --ok:#17795e; --ok-soft:#e6f4ef;
    --warn:#b0762a; --warn-soft:#fbf2e3;
    --danger:#b04646; --danger-soft:#fbeded;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button,input{font-family:inherit;font-size:inherit}
  ::selection{background:var(--accent);color:#fff}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em;
    background:rgba(0,0,0,.05);padding:1px 5px;border-radius:4px}

  /* ---------- 站点外壳（跟其他公开页一致） ---------- */
  .topbar{position:sticky;top:0;z-index:50;background:rgba(247,245,240,.9);
    backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--line)}
  .topbar-inner{max-width:860px;margin:0 auto;padding:14px 32px;display:flex;
    align-items:center;justify-content:space-between;gap:16px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:600}
  .brand-mark{width:34px;height:34px;object-fit:contain}
  .brand-name{font-size:15px}
  .brand-sub{color:var(--muted);font-size:12px;margin-left:6px;font-weight:400}
  .back-link{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;
    border:1px solid var(--line);border-radius:8px;font-size:12.5px;color:var(--ink-soft);
    background:transparent;transition:background .2s,color .2s,border-color .2s}
  .back-link:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

  main.wrap{max-width:860px;margin:0 auto;padding:44px 32px 72px}

  .page-eyebrow{font-size:10px;font-weight:700;letter-spacing:.25em;text-transform:uppercase;
    color:var(--accent);margin-bottom:12px}
  .page-title{font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1.15;
    margin-bottom:8px}
  .page-lede{font-size:14.5px;color:var(--ink-soft);margin-bottom:30px}

  /* ---------- 通用件（跟后台同一套） ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:28px 30px;margin-bottom:18px;box-shadow:0 1px 2px rgba(13,18,36,.03)}
  .card-head{display:flex;justify-content:space-between;align-items:center;gap:14px;
    margin-bottom:22px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
  .card-title{font-size:16px;font-weight:700;letter-spacing:.01em}
  .card-sub{font-size:12.5px;color:var(--muted);margin-top:3px}

  .field{text-align:left;margin-bottom:14px}
  .field label{display:block;font-size:11px;font-weight:700;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  .field input{width:100%;height:42px;padding:0 14px;border:1px solid var(--line);
    border-radius:10px;background:var(--bg-soft);color:var(--ink);font-size:15px;
    transition:border-color .2s,box-shadow .2s,background .2s}
  .field input:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);background:#fff}
  .field input::placeholder{color:var(--muted)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 22px;
    border:1px solid var(--accent);border-radius:10px;background:var(--accent);color:#fff;
    font-weight:600;cursor:pointer;transition:background .2s,transform .2s,box-shadow .2s}
  .btn:hover{background:var(--accent-deep);transform:translateY(-1px);
    box-shadow:0 8px 18px rgba(30,58,138,.22)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
  .btn.full{width:100%}
  .btn.ghost{background:transparent;color:var(--ink-soft);border-color:var(--line)}
  .btn.ghost:hover{background:var(--accent-soft);color:var(--accent);
    border-color:var(--accent);box-shadow:none}
  .btn.sm{padding:7px 13px;font-size:12.5px;border-radius:8px}

  .money{font-weight:700;font-variant-numeric:tabular-nums}
  .money.owe{color:var(--danger)}
  .money.clear{color:var(--ok)}

  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;
    font-weight:700;letter-spacing:.04em}
  .pill.ok{background:var(--ok-soft);color:var(--ok)}
  .pill.owe{background:var(--danger-soft);color:var(--danger)}
  .pill.part{background:var(--warn-soft);color:var(--warn)}
  .pill.now{background:var(--accent-soft);color:var(--accent)}

  .callout{background:var(--ok-soft);border:1px solid rgba(23,121,94,.25);border-radius:12px;
    padding:13px 18px;font-size:13px;color:#0f5a45;line-height:1.7;margin-bottom:20px}
  .callout.err{background:var(--danger-soft);border-color:rgba(176,70,70,.28);color:#8a3535}

  .hint{font-size:12.5px;color:var(--muted);line-height:1.7}
  .err-line{color:var(--danger);font-size:13px;margin-top:12px;min-height:19px}
  .empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:14px}
  .empty-title{font-size:16px;color:var(--ink-soft);font-weight:600;margin-bottom:6px}

  /* ---------- 顶部统计 ---------- */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px;transition:transform .25s,border-color .25s,box-shadow .25s}
  .stat:hover{transform:translateY(-2px);border-color:var(--accent);
    box-shadow:0 8px 20px rgba(13,18,36,.06)}
  .stat-num{font-size:27px;font-weight:800;letter-spacing:-.03em;color:var(--accent);
    font-variant-numeric:tabular-nums;line-height:1.05}
  .stat-num.ok{color:var(--ok)}
  .stat-num.owe{color:var(--danger)}
  .stat-lbl{font-size:10px;color:var(--muted);margin-top:7px;letter-spacing:.16em;
    text-transform:uppercase;font-weight:700}

  /* ---------- 结果头 ---------- */
  .r-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
    flex-wrap:wrap;margin-bottom:20px}
  .r-name{font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
  .r-name-sub{font-size:12.5px;color:var(--muted);margin-top:3px}

  /* ---------- 学期块 ---------- */
  .term-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
    flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:18px}
  .term-name{font-size:16px;font-weight:700;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .term-range{font-size:12.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}

  .term-calc{font-size:13.5px;color:var(--ink-soft);line-height:1.9;margin-bottom:16px}
  .term-calc b{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
  .term-calc .op{color:var(--muted)}

  .term-money{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .term-money div{background:var(--card);padding:14px 12px;text-align:center}
  .term-money span{display:block;font-size:10px;color:var(--muted);letter-spacing:.16em;
    text-transform:uppercase;font-weight:700;margin-bottom:6px}
  .term-money b{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;color:var(--ink)}
  .term-money b.paid{color:var(--ok)}
  .term-money b.owe{color:var(--danger)}
  .term-money b.clear{color:var(--ok)}

  /* ---------- 出勤明细（跟后台训练记录同款卡片） ---------- */
  .detail{margin-top:16px}
  .detail summary{font-size:12.5px;color:var(--muted);cursor:pointer;padding:6px 0;
    list-style:none;user-select:none;transition:color .2s}
  .detail summary::-webkit-details-marker{display:none}
  .detail summary::before{content:'▸ ';font-size:11px}
  .detail[open] summary::before{content:'▾ '}
  .detail summary:hover{color:var(--accent)}

  .sess{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
    padding:14px 18px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;
    background:var(--card);transition:border-color .2s,box-shadow .2s}
  .sess:hover{border-color:var(--accent);box-shadow:0 8px 20px rgba(13,18,36,.05)}
  .sess-title{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
  .sess-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .kind-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10.5px;
    font-weight:700;letter-spacing:.06em;margin-left:8px;vertical-align:middle;
    background:var(--warn-soft);color:var(--warn);border:1px solid rgba(176,118,42,.3)}

  .updated{text-align:center;font-size:12px;color:var(--muted);margin-top:28px;letter-spacing:.04em}
  .actions{display:flex;justify-content:center;margin-top:26px}

  footer{padding:44px 32px;text-align:center;background:var(--ink);
    color:rgba(255,255,255,.6);font-size:13px}
  footer .footer-slogan{font-size:16px;color:#fff;margin-bottom:10px;
    letter-spacing:.15em;font-weight:500}

  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);
    border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .result{display:none}
  .result.on{display:block;animation:fade .35s ease}

  @media(max-width:720px){
    .topbar-inner{padding:12px 18px}
    main.wrap{padding:30px 18px 56px}
    .card{padding:22px 20px}
    .page-title{font-size:25px}
    .stats{grid-template-columns:1fr}
    .sess{grid-template-columns:1fr;gap:8px}
    footer{padding:34px 18px}
  }
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <img class="brand-mark" src="assets/logo.png" alt="Davis Origin Logo" />
      <div class="brand-name">Davis Origin<span class="brand-sub">戴维斯原点</span></div>
    </a>
    <a class="back-link" href="index.html">← 返回主页</a>
  </div>
</header>

<main class="wrap">
  <div class="page-eyebrow">Attendance · 训练查询</div>
  <h1 class="page-title">查你自己的</h1>
  <p class="page-lede">输入名字和查询码，看看你来了几次、要交多少钱。</p>

  <div id="qbox">
    <div class="card">
      <form id="qform">
        <div class="field">
          <label>你的名字</label>
          <input type="text" id="qName" placeholder="例：何嘉伦" autocomplete="off" spellcheck="false" />
        </div>
        <div class="field">
          <label>你的查询码</label>
          <input type="password" id="qCode" placeholder="你名字的全拼" autocomplete="off" />
        </div>
        <button class="btn full" type="submit" id="qBtn">查询</button>
        <div class="err-line" id="qErr"></div>
      </form>
      <div class="hint" style="padding-top:14px;border-top:1px solid var(--line)">
        查询码 = 你名字的全拼（姓在前），比如 刘效尔 → <code>liuxiaoer</code>、何嘉伦 → <code>hejialun</code>。<br />
        每人只能查自己，忘了问队长。
      </div>
    </div>
  </div>

  <div class="result" id="result"></div>
</main>

<footer>
  <div class="footer-slogan">岂曰无衣？与子同袍。</div>
  <div>© Davis Origin · 戴维斯原点足球俱乐部 · UC Davis</div>
</footer>

<script>
/* Worker 直连地址（同域路由没配好时兜底） */
const API_DIRECT = 'https://davisorigin-api.xiaoerliu93.workers.dev';
let API = API_DIRECT;

async function resolveApi(){
  if(location.protocol === 'file:' || location.hostname === 'localhost'){
    API = API_DIRECT; return;
  }
  try{
    const r = await fetch('/api/health', { cache:'no-store' });
    if(r.ok){ const d = await r.json(); if(d && d.ok){ API = '/api'; return; } }
  }catch(e){}
  API = API_DIRECT;
}
resolveApi();

const $ = id => document.getElementById(id);
const money = n => '$' + (Math.round((Number(n)||0)*100)/100).toFixed(2);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* 记住查询码，省得每次输 */
const CODE_KEY = 'do_query_code';
try{ const saved = localStorage.getItem(CODE_KEY); if(saved) $('qCode').value = saved; }catch(e){}

$('qform').onsubmit = async e => {
  e.preventDefault();
  const name = $('qName').value.trim();
  const code = $('qCode').value;
  const btn = $('qBtn'), errEl = $('qErr');
  if(!name){ errEl.textContent = '请输入你的名字'; return; }
  if(!code){ errEl.textContent = '请输入查询码'; return; }

  errEl.textContent = '';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 查询中';

  try{
    const r = await fetch(API + '/query', {
      method:'POST',
      headers:{'content-type':'application/json'},
      body: JSON.stringify({ name, code })
    });
    const d = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error || '查询失败');

    try{ localStorage.setItem(CODE_KEY, code); }catch(e){}

    if(!d.found){
      showEmpty(d.message || '没找到',
        d.inRoster ? '你在名册里，但还没有出勤记录' : '确认名字有没有打错');
      return;
    }
    showResult(d);
  }catch(err){
    errEl.textContent = String(err.message).includes('fetch')
      ? 'API 连不上，稍后再试' : err.message;
  }finally{
    btn.disabled = false; btn.textContent = '查询';
  }
};

function hideForm(){ $('qbox').style.display = 'none'; }
function showForm(){
  $('qbox').style.display = '';
  $('result').classList.remove('on');
  $('qName').value = '';
  $('qName').focus();
  window.scrollTo({top:0,behavior:'smooth'});
}

function showEmpty(title, desc){
  hideForm();
  $('result').classList.add('on');
  $('result').innerHTML = `
    <div class="card">
      <div class="empty">
        <div class="empty-title">${esc(title)}</div>
        <div>${esc(desc)}</div>
      </div>
    </div>
    <div class="actions"><button class="btn ghost" id="againBtn">重新查询</button></div>`;
  $('againBtn').onclick = showForm;
}

/* 结清状态 → 药丸 */
function statusPill(owed, paid, balance){
  if(balance <= 0.005) return '<span class="pill ok">已结清</span>';
  if(paid > 0)         return '<span class="pill part">部分已付</span>';
  return '<span class="pill owe">未付</span>';
}

function showResult(d){
  const tot = d.total;
  const cleared = tot.balance <= 0.005;
  const multi = d.terms.length > 1;

  hideForm();
  $('result').classList.add('on');
  $('result').innerHTML = `
    <div class="r-head">
      <div>
        <div class="r-name">${esc(d.name)}</div>
        <div class="r-name-sub">Davis Origin · 共 ${d.terms.length} 个学期</div>
      </div>
      <div>${statusPill(tot.owed, tot.paid, tot.balance)}</div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-num">${tot.count}</div>
        <div class="stat-lbl">${multi ? '累计出勤' : '出勤次数'}</div>
      </div>
      <div class="stat">
        <div class="stat-num">${money(tot.owed).replace('$','')}</div>
        <div class="stat-lbl">${multi ? '累计应付' : '应付'} · USD</div>
      </div>
      <div class="stat">
        <div class="stat-num ${cleared ? 'ok' : 'owe'}">${money(tot.balance).replace('$','')}</div>
        <div class="stat-lbl">${cleared ? '已结清' : '未付 · USD'}</div>
      </div>
    </div>

    <div class="callout ${cleared ? '' : 'err'}">
      ${cleared
        ? `已结清，谢谢${tot.paid > 0 ? `　·　累计已付 ${money(tot.paid)}` : ''}`
        : `还需支付 <b>${money(tot.balance)}</b>${tot.paid > 0 ? `　·　已付 ${money(tot.paid)} / 共 ${money(tot.owed)}` : ''}`}
    </div>

    ${d.terms.map(termCard).join('')}

    <div class="actions"><button class="btn ghost" id="againBtn">重新查询</button></div>
    ${d.updatedAt ? `<div class="updated">数据更新于 ${new Date(d.updatedAt).toLocaleString('zh-CN',{dateStyle:'medium',timeStyle:'short'})}</div>` : ''}
  `;
  $('againBtn').onclick = showForm;
  window.scrollTo({top:0,behavior:'smooth'});
}

function termCard(t){
  const tc = t.balance <= 0.005;
  const lines = [];
  if(t.trainCount){
    lines.push(`训练 <b>${t.trainCount}</b> 次 <span class="op">×</span> 单价 <b>${money(t.unitPrice)}</b> <span class="op">=</span> <b>${money(t.trainOwed)}</b>`);
  }
  if(t.matchCount){
    lines.push(`比赛 <b>${t.matchCount}</b> 场 <span class="op">·</span> 按各场参赛人数分摊 <span class="op">=</span> <b>${money(t.matchOwed)}</b>`);
  }

  return `
    <div class="card">
      <div class="term-head">
        <div>
          <div class="term-name">
            ${esc(t.termName)}
            ${t.isActive ? '<span class="pill now">进行中</span>' : ''}
          </div>
          ${t.startDate || t.endDate
            ? `<div class="term-range">${esc(t.startDate || '?')} → ${esc(t.endDate || '?')}</div>` : ''}
        </div>
        <div>${statusPill(t.owed, t.paid, t.balance)}</div>
      </div>

      ${lines.length ? `<div class="term-calc">${lines.join('<br />')}</div>` : ''}

      <div class="term-money">
        <div><span>应付</span><b>${money(t.owed)}</b></div>
        <div><span>已付</span><b class="paid">${money(t.paid)}</b></div>
        <div><span>未付</span><b class="${tc ? 'clear' : 'owe'}">${money(t.balance)}</b></div>
      </div>

      ${t.dates && t.dates.length ? `
      <details class="detail">
        <summary>出勤明细 ${t.dates.length} 次</summary>
        <div style="margin-top:12px">
          ${t.dates.map(r=>`
            <div class="sess">
              <div>
                <div class="sess-title">
                  ${esc(r.date || '—')}
                  ${r.kind === 'match' ? '<span class="kind-badge">比赛</span>' : ''}
                </div>
                ${r.note ? `<div class="sess-sub">${esc(r.note)}</div>` : ''}
              </div>
              <div class="money">${money(r.cost)}</div>
            </div>`).join('')}
        </div>
      </details>` : ''}
    </div>`;
}
</script>

</body>
</html>
