<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>训练查询 · Davis Origin</title>
<link rel="icon" type="image/png" href="assets/logo.png" />
<style>
  :root{
    --bg:#f7f5f0; --bg-soft:#fafaf7; --ink:#0a0e1a; --ink-soft:#3d4151;
    --muted:#8a8a92; --line:#e6e2d8; --accent:#1e3a8a; --accent-deep:#0f1d4d;
    --accent-soft:#eaf0fb; --card:#fff;
    --ok:#17795e; --ok-soft:#e6f4ef;
    --warn:#b0762a; --warn-soft:#fbf2e3;
    --danger:#b04646; --danger-soft:#fbeded;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button,input{font-family:inherit;font-size:inherit}
  ::selection{background:var(--accent);color:#fff}

  /* ===================== 站点外壳 ===================== */
  .topbar{position:sticky;top:0;z-index:50;background:rgba(247,245,240,.88);
    backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--line)}
  .topbar-inner{max-width:1400px;margin:0 auto;padding:18px 40px;display:flex;
    align-items:center;justify-content:space-between;gap:16px}
  .brand{display:flex;align-items:center;gap:12px;font-weight:600}
  .brand-mark{width:40px;height:40px;object-fit:contain;transition:transform .4s cubic-bezier(.4,0,.2,1)}
  .brand:hover .brand-mark{transform:rotate(-10deg) scale(1.08)}
  .brand-name{font-size:16px}
  .brand-sub{color:var(--muted);font-size:12px;margin-left:6px;font-weight:400}
  .back-link{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;
    border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--ink-soft);
    background:var(--bg-soft);transition:all .3s ease}
  .back-link:hover{border-color:var(--accent);color:var(--accent);
    background:var(--accent-soft);transform:translateX(-3px)}

  /* ===================== 查询页（原样式） ===================== */
  .page-hero{max-width:760px;margin:0 auto;padding:88px 40px 8px;text-align:center}
  .page-eyebrow{font-size:12px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;
    color:var(--accent);margin-bottom:20px;animation:fadeUp .8s ease both}
  .page-title{font-size:clamp(40px,7vw,68px);font-weight:900;letter-spacing:-.04em;
    line-height:.98;margin-bottom:18px;animation:fadeUp .9s ease .08s both}
  .page-lede{font-size:17px;color:var(--ink-soft);max-width:460px;margin:0 auto;
    animation:fadeUp .9s ease .16s both}

  .qbox{max-width:440px;margin:44px auto 0;padding:0 40px;animation:fadeUp .9s ease .24s both}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px 30px;
    box-shadow:0 20px 50px rgba(13,18,36,.06)}
  .qfield{margin-bottom:16px;text-align:left}
  .qfield label{display:block;font-size:11px;font-weight:700;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .qfield input{width:100%;padding:14px 18px;border:1.5px solid var(--line);border-radius:12px;
    background:var(--bg-soft);color:var(--ink);font-size:16px;
    transition:border-color .25s,box-shadow .25s,background .25s}
  .qfield input:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 4px var(--accent-soft);background:#fff}
  .qbtn{width:100%;padding:15px;background:var(--accent);color:#fff;border:none;
    border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:background .25s,transform .25s,box-shadow .25s}
  .qbtn:hover{background:var(--accent-deep);transform:translateY(-2px);
    box-shadow:0 12px 26px rgba(30,58,138,.28)}
  .qbtn:active{transform:translateY(0)}
  .qbtn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
  .qerr{color:var(--danger);font-size:13.5px;margin-top:14px;min-height:20px;text-align:center}
  .qhint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:18px;
    padding-top:16px;border-top:1px solid var(--line);line-height:1.8}

  main.page{max-width:760px;margin:0 auto;padding:36px 40px 96px}
  .result{display:none}
  .result.on{display:block;animation:fadeUp .5s ease both}

  /* ===================== 结果头 ===================== */
  .r-head{text-align:center;padding:32px 0 30px;border-bottom:1px solid var(--line);margin-bottom:32px}
  .r-name{font-size:clamp(32px,6vw,46px);font-weight:900;letter-spacing:-.03em;line-height:1.05}
  .r-tag{display:inline-block;margin-top:12px;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--accent);background:var(--accent-soft);
    padding:5px 13px;border-radius:999px;font-weight:700}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:20px 18px;text-align:center;
    transition:transform .25s,border-color .25s,box-shadow .25s}
  .stat:hover{transform:translateY(-2px);border-color:var(--accent);
    box-shadow:0 8px 20px rgba(13,18,36,.06)}
  .stat-num{font-size:30px;font-weight:800;letter-spacing:-.03em;color:var(--accent);
    font-variant-numeric:tabular-nums;line-height:1.05}
  .stat-num.ok{color:var(--ok)}
  .stat-num.owe{color:var(--danger)}
  .stat-lbl{font-size:10px;color:var(--muted);margin-top:8px;letter-spacing:.16em;
    text-transform:uppercase;font-weight:700}

  .callout{background:var(--ok-soft);border:1px solid rgba(23,121,94,.25);border-radius:12px;
    padding:14px 20px;font-size:14px;color:#0f5a45;line-height:1.7;
    margin-bottom:26px;text-align:center}
  .callout.owe{background:var(--danger-soft);border-color:rgba(176,70,70,.28);color:#8a3535}
  .callout b{font-weight:800;font-variant-numeric:tabular-nums}

  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;
    font-weight:700;letter-spacing:.04em;white-space:nowrap}
  .pill.ok{background:var(--ok-soft);color:var(--ok)}
  .pill.owe{background:var(--danger-soft);color:var(--danger)}
  .pill.part{background:var(--warn-soft);color:var(--warn)}
  .pill.now{background:var(--accent-soft);color:var(--accent)}

  /* ===================== 学期折叠块 ===================== */
  .term{background:var(--card);border:1px solid var(--line);border-radius:18px;
    margin-bottom:12px;overflow:hidden;transition:border-color .25s,box-shadow .25s}
  .term:hover{border-color:var(--accent)}
  .term.open{border-color:var(--accent);box-shadow:0 8px 24px rgba(13,18,36,.06)}

  .term-head{display:flex;align-items:center;justify-content:space-between;gap:14px;
    width:100%;padding:20px 24px;background:none;border:none;cursor:pointer;
    text-align:left;color:inherit;font:inherit;transition:background .2s}
  .term-head:hover{background:var(--bg-soft)}
  .term-head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .term-name{font-size:18px;font-weight:800;letter-spacing:-.015em;
    display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .term-range{font-size:12.5px;color:var(--muted);margin-top:3px;
    font-variant-numeric:tabular-nums}
  .term-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
  .chev{width:16px;height:16px;flex-shrink:0;color:var(--muted);
    transition:transform .3s cubic-bezier(.4,0,.2,1),color .2s}
  .term.open .chev{transform:rotate(180deg);color:var(--accent)}

  .term-body{display:grid;grid-template-rows:0fr;
    transition:grid-template-rows .3s cubic-bezier(.4,0,.2,1)}
  .term.open .term-body{grid-template-rows:1fr}
  .term-clip{overflow:hidden}
  .term-pad{padding:18px 24px 22px;border-top:1px solid var(--line)}

  .term-calc{font-size:14px;color:var(--ink-soft);line-height:1.9;margin-bottom:16px}
  .term-calc b{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
  .term-calc .op{color:var(--muted)}

  .term-money{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .term-money div{background:var(--card);padding:14px 12px;text-align:center}
  .term-money span{display:block;font-size:10px;color:var(--muted);letter-spacing:.16em;
    text-transform:uppercase;font-weight:700;margin-bottom:6px}
  .term-money b{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;color:var(--ink)}
  .term-money b.paid{color:var(--ok)}
  .term-money b.owe{color:var(--danger)}
  .term-money b.clear{color:var(--ok)}

  .sess-list{margin-top:16px}
  .sess-list-lbl{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted);margin-bottom:10px}
  .sess{display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:13px 16px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;
    background:var(--bg-soft);transition:border-color .2s,background .2s}
  .sess:hover{border-color:var(--accent);background:#fff}
  .sess:last-child{margin-bottom:0}
  .sess-date{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums}
  .sess-note{font-size:12.5px;color:var(--muted);margin-top:2px}
  .sess-cost{font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);font-size:14.5px}
  .kind-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10.5px;
    font-weight:700;letter-spacing:.06em;margin-left:8px;vertical-align:middle;
    background:var(--warn-soft);color:var(--warn);border:1px solid rgba(176,118,42,.3)}

  .state{text-align:center;padding:56px 24px;color:var(--ink-soft);font-size:16px}
  .again{display:block;margin:36px auto 0;padding:11px 24px;background:transparent;
    border:1px solid var(--line);border-radius:999px;color:var(--ink-soft);font-size:13.5px;
    cursor:pointer;transition:all .25s}
  .again:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .updated{text-align:center;font-size:12px;color:var(--muted);margin-top:32px;letter-spacing:.05em}

  footer{padding:48px 40px;text-align:center;background:var(--ink);
    color:rgba(255,255,255,.6);font-size:13px}
  footer .footer-slogan{font-size:17px;color:#fff;margin-bottom:12px;
    letter-spacing:.15em;font-weight:500}

  .spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.35);
    border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

  @media(max-width:720px){
    .topbar-inner{padding:14px 20px}
    .back-link{padding:8px 12px;font-size:12px}
    .page-hero{padding:52px 22px 8px}
    .page-lede{font-size:15px}
    .qbox{padding:0 22px;margin-top:30px}
    .qcard{padding:26px 22px}
    main.page{padding:28px 22px 64px}
    .stats{grid-template-columns:1fr;gap:10px}
    .term-head{padding:18px 18px}
    .term-pad{padding:16px 18px 20px}
    .sess{flex-direction:row}
    footer{padding:36px 22px}
  }
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <img class="brand-mark" src="assets/logo.png" alt="Davis Origin Logo" />
      <div><div class="brand-name">Davis Origin<span class="brand-sub">戴维斯原点</span></div></div>
    </a>
    <a class="back-link" href="index.html">← 返回主页</a>
  </div>
</header>

<section class="page-hero">
  <div class="page-eyebrow">Attendance · 训练查询</div>
  <h1 class="page-title">个人查询</h1>
  <p class="page-lede">输入姓名与查询码，查看本人出勤记录与费用明细。</p>
</section>

<div class="qbox" id="qbox">
  <div class="qcard">
    <form id="qform">
      <div class="qfield">
        <label>你的名字</label>
        <input type="text" id="qName" autocomplete="off" spellcheck="false" />
      </div>
      <div class="qfield">
        <label>你的查询码</label>
        <input type="password" id="qCode" autocomplete="off" />
      </div>
      <button class="qbtn" type="submit" id="qBtn">查询</button>
      <div class="qerr" id="qErr"></div>
    </form>
    <div class="qhint">查询码问队长。</div>
  </div>
</div>

<main class="page">
  <div class="result" id="result"></div>
</main>

<footer>
  <div class="footer-slogan">岂曰无衣？与子同袍。</div>
  <div>© Davis Origin · 戴维斯原点足球俱乐部 · UC Davis</div>
</footer>

<script>
/* Worker 直连地址（同域路由没配好时兜底） */
const API_DIRECT = 'https://davisorigin-api.xiaoerliu93.workers.dev';
let API = API_DIRECT;

async function resolveApi(){
  if(location.protocol === 'file:' || location.hostname === 'localhost'){
    API = API_DIRECT; return;
  }
  try{
    const r = await fetch('/api/health', { cache:'no-store' });
    if(r.ok){ const d = await r.json(); if(d && d.ok){ API = '/api'; return; } }
  }catch(e){}
  API = API_DIRECT;
}
resolveApi();

const $ = id => document.getElementById(id);
const money = n => '$' + (Math.round((Number(n)||0)*100)/100).toFixed(2);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const CHEV = `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M6 9l6 6 6-6"/></svg>`;

/* 记住查询码，省得每次输 */
const CODE_KEY = 'do_query_code';
try{ const saved = localStorage.getItem(CODE_KEY); if(saved) $('qCode').value = saved; }catch(e){}

$('qform').onsubmit = async e => {
  e.preventDefault();
  const name = $('qName').value.trim();
  const code = $('qCode').value;
  const btn = $('qBtn'), errEl = $('qErr');
  if(!name){ errEl.textContent = '请输入你的名字'; return; }
  if(!code){ errEl.textContent = '请输入查询码'; return; }

  errEl.textContent = '';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 查询中';

  try{
    const r = await fetch(API + '/query', {
      method:'POST',
      headers:{'content-type':'application/json'},
      body: JSON.stringify({ name, code })
    });
    const d = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error || '查询失败');

    try{ localStorage.setItem(CODE_KEY, code); }catch(e){}

    if(!d.found){ showState('你还没有出勤记录'); return; }
    showResult(d);
  }catch(err){
    errEl.textContent = String(err.message).includes('fetch')
      ? 'API 连不上，稍后再试' : err.message;
  }finally{
    btn.disabled = false; btn.textContent = '查询';
  }
};

function hideForm(){ $('qbox').style.display = 'none'; }
function showForm(){
  $('qbox').style.display = '';
  $('result').classList.remove('on');
  $('qName').value = '';
  $('qName').focus();
  window.scrollTo({top:0,behavior:'smooth'});
}

function showState(msg){
  hideForm();
  $('result').classList.add('on');
  $('result').innerHTML = `
    <div class="state">${esc(msg)}</div>
    <button class="again" id="againBtn">重新查询</button>`;
  $('againBtn').onclick = showForm;
}

/* 结清状态 */
function statusPill(paid, balance){
  if(balance <= 0.005) return '<span class="pill ok">已结清</span>';
  if(paid > 0)         return '<span class="pill part">部分已付</span>';
  return '<span class="pill owe">未付</span>';
}

function showResult(d){
  const tot = d.total;
  const cleared = tot.balance <= 0.005;
  const multi = d.terms.length > 1;

  hideForm();
  $('result').classList.add('on');
  $('result').innerHTML = `
    <div class="r-head">
      <div class="r-name">${esc(d.name)}</div>
      <div class="r-tag">Davis Origin</div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-num">${tot.count}</div>
        <div class="stat-lbl">${multi ? '累计出勤' : '出勤次数'}</div>
      </div>
      <div class="stat">
        <div class="stat-num">${money(tot.owed).replace('$','')}</div>
        <div class="stat-lbl">${multi ? '累计应付' : '应付'} · USD</div>
      </div>
      <div class="stat">
        <div class="stat-num ${cleared ? 'ok' : 'owe'}">${money(tot.balance).replace('$','')}</div>
        <div class="stat-lbl">${cleared ? '已结清' : '未付 · USD'}</div>
      </div>
    </div>

    <div class="callout ${cleared ? '' : 'owe'}">
      ${cleared
        ? `已结清${tot.paid > 0 ? `　·　累计已付 ${money(tot.paid)}` : ''}`
        : `还需支付 <b>${money(tot.balance)}</b>${tot.paid > 0 ? `　·　已付 ${money(tot.paid)} / 共 ${money(tot.owed)}` : ''}`}
    </div>

    ${d.terms.map((t,i)=>termCard(t, i === 0)).join('')}

    <button class="again" id="againBtn">重新查询</button>
    ${d.updatedAt ? `<div class="updated">数据更新于 ${new Date(d.updatedAt).toLocaleString('zh-CN',{dateStyle:'medium',timeStyle:'short'})}</div>` : ''}
  `;
  $('againBtn').onclick = showForm;

  // 点标题栏展开 / 收起
  $('result').querySelectorAll('.term-head').forEach(btn=>{
    btn.onclick = ()=>{
      const box = btn.closest('.term');
      const open = box.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    };
  });

  window.scrollTo({top:0,behavior:'smooth'});
}

/** open = 是否默认展开（最近一个学期展开，其余收起） */
function termCard(t, open){
  const tc = t.balance <= 0.005;
  const lines = [];
  if(t.trainCount){
    lines.push(`训练 <b>${t.trainCount}</b> 次 <span class="op">×</span> 单价 <b>${money(t.unitPrice)}</b> <span class="op">=</span> <b>${money(t.trainOwed)}</b>`);
  }
  if(t.matchCount){
    lines.push(`比赛 <b>${t.matchCount}</b> 场 <span class="op">·</span> 按各场参赛人数分摊 <span class="op">=</span> <b>${money(t.matchOwed)}</b>`);
  }

  return `
    <div class="term ${open ? 'open' : ''}">
      <button class="term-head" type="button" aria-expanded="${open ? 'true' : 'false'}">
        <div>
          <div class="term-name">
            ${esc(t.termName)}
            ${t.isActive ? '<span class="pill now">进行中</span>' : ''}
          </div>
          ${t.startDate || t.endDate
            ? `<div class="term-range">${esc(t.startDate || '?')} → ${esc(t.endDate || '?')}</div>` : ''}
        </div>
        <div class="term-right">
          ${statusPill(t.paid, t.balance)}
          ${CHEV}
        </div>
      </button>

      <div class="term-body"><div class="term-clip"><div class="term-pad">
        ${lines.length ? `<div class="term-calc">${lines.join('<br />')}</div>` : ''}

        <div class="term-money">
          <div><span>应付</span><b>${money(t.owed)}</b></div>
          <div><span>已付</span><b class="paid">${money(t.paid)}</b></div>
          <div><span>未付</span><b class="${tc ? 'clear' : 'owe'}">${money(t.balance)}</b></div>
        </div>

        ${t.dates && t.dates.length ? `
          <div class="sess-list">
            <div class="sess-list-lbl">出勤明细 ${t.dates.length} 次</div>
            ${t.dates.map(r=>`
              <div class="sess">
                <div>
                  <div class="sess-date">
                    ${esc(r.date || '—')}
                    ${r.kind === 'match' ? '<span class="kind-badge">比赛</span>' : ''}
                  </div>
                  ${r.note ? `<div class="sess-note">${esc(r.note)}</div>` : ''}
                </div>
                <div class="sess-cost">${money(r.cost)}</div>
              </div>`).join('')}
          </div>` : ''}
      </div></div></div>
    </div>`;
}
</script>

</body>
</html>
