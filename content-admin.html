<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>内容管理后台 · Davis Origin</title>
<link rel="icon" type="image/png" href="assets/logo.png" />
<meta name="robots" content="noindex, nofollow" />
<style>
  :root {
    --bg:#f7f5f0; --bg-soft:#fafaf7; --ink:#0a0e1a; --ink-soft:#3d4151;
    --muted:#8a8a92; --line:#e6e2d8; --accent:#1e3a8a; --accent-deep:#0f1d4d;
    --accent-soft:#eaf0fb; --card:#fff;
    --ok:#17795e; --ok-soft:#e6f4ef;
    --warn:#b0762a; --warn-soft:#fbf2e3;
    --danger:#b04646; --danger-soft:#fbeded;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button,input,textarea,select{font-family:inherit;font-size:inherit}
  ::selection{background:var(--accent);color:#fff}

  /* login */
  .login-screen{min-height:100vh;display:grid;place-items:center;padding:24px}
  .login-box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);
    border-radius:20px;padding:40px 36px;text-align:center;box-shadow:0 24px 60px rgba(13,18,36,.07)}
  .login-logo{width:56px;height:56px;object-fit:contain;margin-bottom:20px}
  .login-title{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
  .login-sub{font-size:13px;color:var(--muted);margin-bottom:28px;letter-spacing:.04em}
  .field{text-align:left;margin-bottom:14px}
  .field label{display:block;font-size:11px;font-weight:700;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  .field input,.field textarea,.field select{width:100%;box-sizing:border-box;
    padding:0 14px;height:42px;border:1px solid var(--line);
    border-radius:10px;background:var(--bg-soft);color:var(--ink);font-size:15px;
    transition:border-color .2s,box-shadow .2s,background .2s}
  .field textarea{height:auto;padding:11px 14px;line-height:1.6;resize:vertical}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);background:#fff}
  .field .chk-line{display:flex;align-items:center;gap:8px;height:auto;padding:2px 0}
  .field .chk-line input{width:16px;height:16px;flex:none}
  .field .chk-line span{font-size:13.5px;color:var(--ink-soft)}
  .chk-line-sm{display:flex;align-items:center;gap:6px;cursor:pointer}
  .chk-line-sm input{width:13px;height:13px;flex:none}
  .chk-line-sm span{font-size:12px;color:var(--muted)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 22px;
    border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;
    font-weight:600;cursor:pointer;font-size:14px;
    transition:background .2s,transform .2s,box-shadow .2s}
  .btn:hover{background:var(--accent-deep);transform:translateY(-1px);box-shadow:0 8px 18px rgba(30,58,138,.22)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
  .btn.full{width:100%}
  .btn.ghost{background:transparent;color:var(--ink-soft);border-color:var(--line)}
  .btn.ghost:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);box-shadow:none}
  .btn.danger{background:transparent;color:var(--danger);border-color:rgba(176,70,70,.35)}
  .btn.danger:hover{background:var(--danger-soft);border-color:var(--danger);box-shadow:none}
  .btn.ok{background:var(--ok);border-color:var(--ok)}
  .btn.ok:hover{background:#12604a;box-shadow:0 8px 18px rgba(23,121,94,.25)}
  .btn.sm{padding:7px 13px;font-size:12.5px;border-radius:8px}
  .login-err{color:var(--danger);font-size:13px;margin-top:12px;min-height:19px}

  /* shell */
  .app{display:none}.app.on{display:block}
  .topbar{position:sticky;top:0;z-index:40;background:rgba(247,245,240,.9);
    backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)}
  .topbar-inner{max-width:1180px;margin:0 auto;padding:14px 32px;display:flex;
    align-items:center;justify-content:space-between;gap:16px}
  .brand{display:flex;align-items:center;gap:11px}
  .brand img{width:34px;height:34px;object-fit:contain}
  .brand-name{font-size:15px;font-weight:700}
  .brand-tag{font-size:10px;color:var(--accent);background:var(--accent-soft);padding:3px 8px;
    border-radius:5px;letter-spacing:.14em;font-weight:700;margin-left:8px}
  .topbar-actions{display:flex;gap:8px;align-items:center}
  .swap-link{font-size:12.5px;color:var(--muted);margin-right:4px}
  main.wrap{max-width:1180px;margin:0 auto;padding:28px 32px 64px}

  .tabs{display:flex;gap:6px;overflow-x:auto;
    background:#efede9;padding:5px;border-radius:12px;margin-bottom:22px;
    position:sticky;top:var(--topbar-h,64px);z-index:30;box-shadow:0 2px 0 var(--bg)}
  .tab{padding:9px 18px;border:none;background:none;color:var(--muted);font-weight:600;
    cursor:pointer;white-space:nowrap;border-radius:8px;font-size:14px;
    transition:color .2s,background .2s,box-shadow .2s}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--accent);background:#fff;box-shadow:0 2px 6px rgba(13,18,36,.08)}
  .panel{display:none}.panel.on{display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:26px 28px;margin-bottom:18px;box-shadow:0 1px 2px rgba(13,18,36,.03)}
  .card-head{display:flex;justify-content:space-between;align-items:center;gap:14px;
    margin-bottom:20px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .card-title{font-size:16px;font-weight:700;letter-spacing:.01em}
  .card-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .row3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px}
  .row4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}

  .hint{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:6px}
  .callout{background:var(--ok-soft);border:1px solid rgba(23,121,94,.25);border-radius:12px;
    padding:13px 18px;font-size:13px;color:#0f5a45;line-height:1.7;margin-bottom:20px}
  .callout.warn{background:var(--warn-soft);border-color:rgba(176,118,42,.28);color:#7a5518}
  .callout.err{background:var(--danger-soft);border-color:rgba(176,70,70,.28);color:#8a3535}
  .empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}

  /* 赛季选择条 */
  .season-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .season-chip{padding:9px 16px;border:1.5px solid var(--line);border-radius:999px;
    cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-soft);
    background:var(--card);transition:all .18s;display:flex;align-items:center;gap:7px}
  .season-chip:hover{border-color:var(--accent)}
  .season-chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .season-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
  .season-bar-spacer{flex:1}

  .team-block{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px;background:var(--bg-soft)}
  .team-block-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
  .team-block-title{font-size:14.5px;font-weight:700}
  .team-subcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px 18px}

  table.mtx{width:100%;border-collapse:collapse;margin-top:10px}
  table.mtx th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);padding:0 8px 8px;border-bottom:1.5px solid var(--line)}
  table.mtx td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
  table.mtx input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;
    background:var(--bg-soft);font-size:13.5px}
  table.mtx input:focus{outline:none;border-color:var(--accent);background:#fff}
  table.mtx input.score{text-align:center;font-variant-numeric:tabular-nums}
  .mtx-actions{display:flex;gap:6px;white-space:nowrap}

  .order-list{display:flex;flex-direction:column;gap:8px;max-width:420px}
  .order-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);
    border-radius:10px;background:var(--bg-soft)}
  .order-row input{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;background:#fff}
  .order-row .updown{display:flex;gap:4px}
  .order-row .updown button{width:26px;height:26px;border:1px solid var(--line);background:#fff;
    border-radius:6px;cursor:pointer;color:var(--ink-soft)}
  .order-row .updown button:hover{border-color:var(--accent);color:var(--accent)}
  .order-row .updown button:disabled{opacity:.35;cursor:not-allowed}

  .toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);background:var(--ink);
    color:#fff;padding:12px 22px;border-radius:10px;font-size:13.5px;font-weight:500;opacity:0;
    pointer-events:none;transition:all .3s cubic-bezier(.4,0,.2,1);z-index:200;
    box-shadow:0 12px 30px rgba(0,0,0,.2)}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .toast.bad{background:var(--danger)}

  .modal-bg{position:fixed;inset:0;background:rgba(10,14,26,.5);backdrop-filter:blur(3px);
    display:none;place-items:center;z-index:150;padding:24px}
  .modal-bg.on{display:grid;animation:mfade .2s ease}
  @keyframes mfade{from{opacity:0}to{opacity:1}}
  .modal{background:var(--card);border-radius:18px;padding:30px 32px;width:100%;max-width:460px;
    box-shadow:0 30px 70px rgba(0,0,0,.25);max-height:86vh;overflow-y:auto;
    animation:mup .25s cubic-bezier(.4,0,.2,1)}
  @keyframes mup{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
  .modal h3{font-size:19px;font-weight:800;margin-bottom:6px;letter-spacing:-.01em}
  .modal .sub{font-size:13px;color:var(--muted);margin-bottom:22px;line-height:1.6}
  .modal-actions{display:flex;gap:10px;margin-top:22px}
  .modal-err{color:var(--danger);font-size:13px;margin-top:12px;min-height:18px}

  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);
    border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  .refresh-spin{display:inline-block;width:12px;height:12px;
    border:2px solid rgba(30,58,138,.22);border-top-color:var(--accent);
    border-radius:50%;animation:spin .7s linear infinite;vertical-align:-1px;margin-right:5px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading{text-align:center;padding:80px 20px;color:var(--muted)}

  .publish-banner{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-deep) 100%);
    color:#fff;border-radius:18px;padding:26px 30px;margin-bottom:18px;
    display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;
    box-shadow:0 10px 30px rgba(30,58,138,.2)}
  .publish-banner .p-main{font-size:11px;opacity:.75;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
  .publish-banner .p-sub{font-size:13px;opacity:.85;margin-top:6px;max-width:420px;line-height:1.6}
  .publish-banner .btn{background:#fff;color:var(--accent-deep);border-color:#fff}
  .publish-banner .btn:hover{background:#eef1f6;box-shadow:0 8px 18px rgba(0,0,0,.18)}

  pre.preview{background:var(--bg-soft);border:1px solid var(--line);border-radius:12px;
    padding:16px;font-size:12px;line-height:1.6;overflow:auto;max-height:420px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  /* 发布前预览：真的把 seasons.html 用这份还没发布的数据渲染出来看 */
  .preview-frame-wrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;
    background:#fff;height:900px;min-height:360px;resize:vertical}
  .preview-frame{width:100%;height:100%;border:0;display:block}

  /* 一队/预备队 切换 */
  .team-switch{display:inline-flex;gap:4px;background:#efede9;padding:4px;border-radius:10px;margin-bottom:16px}
  .team-switch button{border:none;background:none;padding:8px 20px;border-radius:7px;
    font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;transition:all .18s}
  .team-switch button:hover{color:var(--ink)}
  .team-switch button.on{background:#fff;color:var(--accent);box-shadow:0 2px 6px rgba(13,18,36,.08)}

  /* 折叠式赛事卡片 */
  .cat-card{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;background:#fff;overflow:hidden}
  .cat-card summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;
    justify-content:space-between;align-items:center;gap:10px;user-select:none}
  .cat-card summary::-webkit-details-marker{display:none}
  .cat-card summary .cs-left{display:flex;align-items:center;gap:10px;min-width:0}
  .cat-card summary .cs-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .cat-card summary .cs-caret{width:9px;height:9px;border-right:2px solid var(--muted);
    border-bottom:2px solid var(--muted);transform:rotate(-45deg);flex-shrink:0;transition:transform .18s}
  .cat-card[open] summary .cs-caret{transform:rotate(45deg)}
  .cat-card summary b{font-size:17px}
  .cat-card summary .hint{margin:0}
  .cat-card-body{padding:0 18px 18px}
  .cat-card-hd{margin-bottom:0}

  /* 添加赛事 */
  .add-event-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
  .tmpl-btn{padding:8px 16px;border:1.5px dashed var(--line);border-radius:999px;background:var(--bg-soft);
    font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:all .18s}
  .tmpl-btn:hover{border-color:var(--accent);border-style:solid;color:var(--accent);background:var(--accent-soft)}
  .custom-event-box{display:none;gap:8px;align-items:center}
  .custom-event-box.on{display:flex}
  .custom-event-box input{padding:8px 12px;border:1px solid var(--line);border-radius:8px;
    background:var(--bg-soft);font-size:13.5px;width:180px}

  /* 球员名单看板：搜索加人 + 门将/后卫/中场/前锋四栏，拖动调整位置 */
  .roster-board-head{display:flex;justify-content:space-between;align-items:center;gap:12px;
    flex-wrap:wrap;margin-bottom:12px}
  .roster-save-status{color:var(--ok);font-weight:600;margin-left:4px;transition:opacity .2s}
  .roster-save-status.bad{color:var(--danger)}
  .roster-search-trigger{padding:9px 16px;border:1px solid var(--line);border-radius:9px;
    background:var(--bg-soft);color:var(--muted);font-size:13px;cursor:pointer;transition:all .18s;
    text-align:left}
  .roster-search-trigger:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .roster-cols{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .roster-col{position:relative;border:1.5px dashed transparent;border-radius:10px;padding:8px;
    transition:all .16s cubic-bezier(.3,.8,.4,1.2);min-height:64px}
  .roster-col.drag-over{border-color:var(--accent);border-width:2px;background:var(--accent-soft);
    padding:16px 12px;box-shadow:0 10px 26px rgba(30,58,138,.2);transform:scale(1.05);z-index:2}
  .roster-col-head{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin-bottom:8px}
  .roster-col-head b{color:var(--ink-soft);font-weight:700;letter-spacing:0;text-transform:none;font-size:11px}
  .roster-col-chips{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
  .rchip{display:inline-block;padding:5px 12px;border-radius:999px;background:var(--accent-soft);
    color:var(--accent);font-size:12.5px;font-weight:600;cursor:grab;user-select:none;transition:all .15s}
  .rchip:active{cursor:grabbing}
  .rchip.off{background:#ececec;color:var(--muted);text-decoration:line-through;opacity:.75}
  .rchip.dragging{opacity:.3}

  /* 添加球员：点搜索按钮，在它右对齐、往左展开弹出一个更宽的检索框（放大动画），
   * 不是整屏弹窗。用 position:absolute（跟着文档滚动）而不是 fixed，这样翻页面的
   * 时候框不用跟着立刻关掉——只有框本身彻底滚出可视区域才会被关掉，见 JS 部分。 */
  .roster-search-panel{position:absolute;z-index:150;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:12px;box-shadow:0 26px 60px rgba(13,18,36,.22);
    transform:scale(.85);opacity:0;pointer-events:none;
    transition:transform .16s cubic-bezier(.2,.9,.3,1.25),opacity .12s}
  .roster-search-panel.on{transform:scale(1);opacity:1;pointer-events:auto}
  .rs-input{width:100%;box-sizing:border-box;padding:13px 15px;font-size:16px;border:1.5px solid var(--line);
    border-radius:11px;background:var(--bg-soft);margin-bottom:10px}
  .rs-input:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
  .rs-results{max-height:228px;overflow:auto;display:flex;flex-direction:column;gap:3px} /* ~5 条结果的高度，多的滚动查看 */
  .rs-result{padding:11px 14px;border-radius:9px;cursor:pointer;font-size:14.5px;display:flex;
    justify-content:space-between;align-items:center;transition:background .15s}
  .rs-result:hover,.rs-result.hl{background:var(--accent-soft);color:var(--accent)}
  .rs-result .rs-pos{font-size:11px;color:var(--muted)}
  .rs-result.add-new{color:var(--ok);font-weight:600}
  .rs-result.selected{cursor:default;opacity:.6}
  .rs-result.selected:hover{background:none;color:inherit}
  .rs-result.selected .rs-pos{color:var(--ok);font-weight:700}
  .rs-empty{padding:16px;text-align:center;color:var(--muted);font-size:13px}

  @media(max-width:860px){
    .topbar-inner,main.wrap{padding-left:16px;padding-right:16px}
    .row2,.row3,.row4,.roster-cols{grid-template-columns:1fr}
    .card{padding:20px 16px}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <img class="login-logo" src="assets/logo.png" alt="" />
    <div class="login-title">内容管理后台</div>
    <div class="login-sub">Davis Origin · 网站正文（赛季 / 名单 / 比赛）</div>
    <form id="loginForm">
      <div class="field">
        <label for="loginPass">管理密码</label>
        <input type="password" id="loginPass" autocomplete="current-password" />
      </div>
      <button class="btn full" type="submit" id="loginBtn">登录</button>
      <div class="login-err" id="loginErr"></div>
    </form>
    <div class="hint">跟训练管理后台用的是同一个密码。</div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img src="assets/logo.png" alt="" />
        <div><span class="brand-name">Davis Origin</span><span class="brand-tag">内容后台</span></div>
      </div>
      <div class="topbar-actions">
        <a class="swap-link" href="admin.html">收费后台 →</a>
        <button class="btn ghost sm" id="btnRefresh">刷新</button>
        <button class="btn ghost sm" id="btnLogout">退出</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="apiWarn"></div>

    <div class="season-bar" id="seasonBar"></div>

    <div class="tabs">
      <button class="tab on" data-tab="season">赛季信息</button>
      <button class="tab" data-tab="content">名单与比赛</button>
      <button class="tab" data-tab="publish">发布上线</button>
    </div>

    <!-- 赛季信息 -->
    <section class="panel on" id="tab-season">
      <div class="card" id="seasonCard"></div>
    </section>

    <!-- 名单与比赛 -->
    <section class="panel" id="tab-content">
      <div id="contentArea"></div>
    </section>

    <!-- 发布 -->
    <section class="panel" id="tab-publish">
      <div class="publish-banner">
        <div>
          <div class="p-main">发布上线</div>
        </div>
        <button class="btn" id="btnPublish">发布上线</button>

<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.29.3/dist/index.js"></script>
<script>
if (location.protocol === 'http:' && !['localhost', '127.0.0.1'].includes(location.hostname)) {
  location.replace('https://' + location.host + location.pathname + location.search + location.hash);
}

const API_DIRECT = 'https://davisorigin-api.xiaoerliu93.workers.dev';
let API = '/api';

async function resolveApi() {
  if (location.protocol === 'file:' || location.hostname === 'localhost') { API = API_DIRECT; return; }
  try {
    const r = await fetch('/api/health', { cache: 'no-store' });
    if (r.ok) { const d = await r.json(); if (d && d.ok) { API = '/api'; return; } }
  } catch (e) {}
  try {
    const r = await fetch(API_DIRECT + '/health', { cache: 'no-store' });
    if (r.ok) { const d = await r.json(); if (d && d.ok) { API = API_DIRECT; return; } }
  } catch (e) {}
  API = '/api';
}

const TK = 'do_admin_token'; // 跟收费后台共用同一个登录状态
let D = null;                // /content/all 的原始数据
let ALL_PLAYERS = [];        // 收费后台球员名单（/data 的 players），给名单选择器搜索用
let PLAYER_NUMBER = new Map(); // 姓名 -> 球衣号（来自收费后台 /data 的 codes[].number，
                                // 号码本身在 admin.html 那边维护，这边只是借用来显示）
function displayName(name) {
  const num = PLAYER_NUMBER.get(name);
  return num ? (num + ' ' + name) : name;
}
let curSeasonId = null;
let curTeamKey = 'first';    // 当前"名单与比赛"tab 里选的是一队还是预备队

const EVENT_TEMPLATES = [
  { key: 'league',  label: '北加联' },
  { key: 'huati',   label: '华体会' },
  { key: 'xinnian', label: '贺岁杯' },
];

// 球员名单看板：prefix -> { getRoster(), addPlayer(name) }
const rosterBoards = new Map();
// 每个球员历史上都出现在哪些位置（从队伍整体名单/赛事专属名单的历史记录里统计），
// 用来猜"新加的这个人大概率是哪个位置"，加进去之后还能用拖动手动纠正。
let PLAYER_POS_HISTORY = new Map();
function buildPositionHistory() {
  const hist = new Map();
  const bump = (name, pos) => {
    if (!POS.includes(pos) || !name) return;
    if (!hist.has(name)) hist.set(name, { gk: 0, def: 0, mid: 0, fwd: 0 });
    hist.get(name)[pos]++;
  };
  (D.team_roster || []).forEach(r => bump(r.player_name, r.position));
  (D.category_roster || []).forEach(r => bump(r.player_name, r.position));
  return hist;
}
function guessPosition(name) {
  const h = PLAYER_POS_HISTORY.get(name);
  if (!h) return 'mid';
  let best = 'mid', bestN = 0;
  POS.forEach(p => { if (h[p] > bestN) { bestN = h[p]; best = p; } });
  return best;
}

const $ = id => document.getElementById(id);
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function toast(msg, bad) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.toggle('bad', !!bad);
  t.classList.add('on');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('on'), 2600);
}

async function api(path, opts = {}) {
  const token = sessionStorage.getItem(TK);
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      'content-type': 'application/json',
      ...(token ? { authorization: 'Bearer ' + token } : {}),
      ...(opts.headers || {}),
    },
  });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401) {
    sessionStorage.removeItem(TK);
    location.reload();
    throw new Error('登录已过期');
  }
  if (!res.ok) throw new Error(data?.error || ('HTTP ' + res.status));
  return data;
}

const POS = ['gk', 'def', 'mid', 'fwd'];
const POS_LABEL = { gk: '门将', def: '后卫', mid: '中场', fwd: '前锋' };
const TEAM_LABEL_FALLBACK = { first: '一队', reserve: '预备队' };

/* ---------- 从原始表数据里按 id 归类，方便渲染 ---------- */
function indexData() {
  const bySeason = {};
  D.seasons.forEach(s => { bySeason[s.id] = { season: s, highlights: [], teams: [] }; });
  D.highlights.forEach(h => { if (bySeason[h.season_id]) bySeason[h.season_id].highlights.push(h); });
  D.highlights.forEach(() => {});
  Object.values(bySeason).forEach(b => b.highlights.sort((a, b2) => a.sort_order - b2.sort_order));

  const teamsById = {};
  D.teams.forEach(t => {
    const roster = { gk: [], def: [], mid: [], fwd: [] };
    D.team_roster.filter(r => r.team_id === t.id).sort((a, b) => a.sort_order - b.sort_order)
      .forEach(r => { if (roster[r.position]) roster[r.position].push(r.player_name); });
    const cats = D.categories.filter(c => c.team_id === t.id).map(c => {
      const catRoster = { gk: [], def: [], mid: [], fwd: [] };
      let hasCatRoster = false;
      D.category_roster.filter(r => r.category_id === c.id).sort((a, b) => a.sort_order - b.sort_order)
        .forEach(r => { if (catRoster[r.position]) { catRoster[r.position].push(r.player_name); hasCatRoster = true; } });
      const matches = D.matches.filter(m => m.category_id === c.id).sort((a, b) => a.sort_order - b.sort_order);
      return { ...c, roster: catRoster, hasCatRoster, matches };
    });
    const orderMap = {};
    D.category_order.forEach(c => { orderMap[c.category_key] = c.sort_order; });
    cats.sort((a, b) => (orderMap[a.category_key] ?? 999) - (orderMap[b.category_key] ?? 999));
    teamsById[t.id] = { ...t, roster, categories: cats };
    if (bySeason[t.season_id]) bySeason[t.season_id].teams.push(teamsById[t.id]);
  });
  Object.values(bySeason).forEach(b => b.teams.sort((a, b2) => (a.team_key === 'first' ? 0 : 1) - (b2.team_key === 'first' ? 0 : 1)));
  return bySeason;
}

function render() {
  const bySeason = indexData();
  if (!curSeasonId || !bySeason[curSeasonId]) {
    curSeasonId = D.seasons.length ? D.seasons[0].id : null;
  }
  renderSeasonBar();
  renderSeasonTab(bySeason);
  renderContentTab(bySeason);
}

/* ===================== 名单与比赛 ===================== */
/* 球员名单看板：门将/后卫/中场/前锋四栏，球员是可以拖动换栏的"药丸"；
 * 点一下药丸切换"选中/灰掉"（灰掉的自动从名单里剔除，不是真删除，再点一下可以
 * 恢复）；加人统一走右上角的搜索按钮，点开一个悬浮在按钮下方的搜索框。
 * 没有手动"保存"按钮——每次拖动/点击/加人之后 0.5 秒自动存进后台
 * （data-save-url 指向这块名单该存去哪个接口，团队整体名单和某个赛事的专属
 * 名单用的是同一套组件，只是 saveUrl 不一样）。 */
function rosterBoardHtml(prefix, roster, label, saveUrl) {
  return `<div class="roster-board" data-prefix="${esc(prefix)}" data-save-url="${esc(saveUrl)}"
      data-roster='${esc(JSON.stringify(roster || {}))}'>
    <div class="roster-board-head">
      <div class="hint" style="margin:0"><b data-count="total">0</b> 人 · ${esc(label)}
        <span class="roster-save-status" data-save-status></span></div>
      <button type="button" class="roster-search-trigger" data-act="open-roster-search">🔍 搜姓名/拼音/首字母，添加球员</button>
    </div>
    <div class="roster-cols">
      ${POS.map(p => `
        <div class="roster-col" data-pos="${p}">
          <div class="roster-col-head">${POS_LABEL[p]} <b data-count="${p}">(0)</b></div>
          <div class="roster-col-chips"></div>
        </div>`).join('')}
    </div>
  </div>`;
}
function mountRosterBoards(root) {
  root.querySelectorAll('.roster-board').forEach(board => {
    const prefix = board.dataset.prefix;
    const saveUrl = board.dataset.saveUrl;
    let rosterObj = {};
    try { rosterObj = JSON.parse(board.dataset.roster || '{}'); } catch (e) {}
    const entries = [];
    POS.forEach(p => (rosterObj[p] || []).forEach(name => entries.push({ name, pos: p, excluded: false })));

    const cols = {}, countEls = {};
    POS.forEach(p => {
      cols[p] = board.querySelector(`.roster-col[data-pos="${p}"] .roster-col-chips`);
      countEls[p] = board.querySelector(`.roster-col-head b[data-count="${p}"]`);
    });
    const totalEl = board.querySelector('.roster-board-head b[data-count="total"]');
    const statusEl = board.querySelector('[data-save-status]');

    function currentRosterOut() {
      const out = {};
      POS.forEach(p => { out[p] = entries.filter(e => e.pos === p && !e.excluded).map(e => e.name); });
      return out;
    }
    let saveTimer = null;
    function scheduleAutoSave() {
      if (!saveUrl || !statusEl) return;
      statusEl.classList.remove('bad');
      statusEl.textContent = '· 保存中…';
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        try {
          await api(saveUrl, { method: 'PUT', body: JSON.stringify({ roster: currentRosterOut() }) });
          statusEl.textContent = '· 已自动保存';
          setTimeout(() => { statusEl.textContent = ''; }, 1400);
        } catch (e) {
          statusEl.classList.add('bad');
          statusEl.textContent = '· 保存失败，等会再改一下试试';
        }
      }, 500);
    }

    function wireChips() {
      board.querySelectorAll('.rchip').forEach(chip => {
        chip.onclick = () => {
          entries[Number(chip.dataset.idx)].excluded = !entries[Number(chip.dataset.idx)].excluded;
          renderChips();
          scheduleAutoSave();
        };
        chip.ondragstart = e => {
          chip.classList.add('dragging');
          e.dataTransfer.setData('text/plain', chip.dataset.idx);
          e.dataTransfer.effectAllowed = 'move';
        };
        chip.ondragend = () => chip.classList.remove('dragging');
      });
    }
    function renderChips() {
      POS.forEach(p => {
        cols[p].innerHTML = entries.map((e, idx) => e.pos === p
          ? `<span class="rchip ${e.excluded ? 'off' : ''}" draggable="true" data-idx="${idx}">${esc(displayName(e.name))}</span>`
          : '').join('');
        countEls[p].textContent = '(' + entries.filter(e => e.pos === p && !e.excluded).length + ')';
      });
      totalEl.textContent = entries.filter(e => !e.excluded).length;
      wireChips();
    }
    POS.forEach(p => {
      const colEl = board.querySelector(`.roster-col[data-pos="${p}"]`);
      colEl.addEventListener('dragover', e => { e.preventDefault(); colEl.classList.add('drag-over'); });
      colEl.addEventListener('dragleave', () => colEl.classList.remove('drag-over'));
      colEl.addEventListener('drop', e => {
        e.preventDefault();
        colEl.classList.remove('drag-over');
        const idx = Number(e.dataTransfer.getData('text/plain'));
        if (entries[idx] && entries[idx].pos !== p) {
          entries[idx].pos = p;
          renderChips();
          scheduleAutoSave();
        }
      });
    });
    const searchBtn = board.querySelector('[data-act="open-roster-search"]');
    if (searchBtn) searchBtn.onclick = () => openRosterSearch(prefix, searchBtn);

    renderChips();
    rosterBoards.set(prefix, {
      getRoster: currentRosterOut,
      addPlayer(name) {
        const existing = entries.find(e => e.name === name);
        if (existing) { existing.excluded = false; }
        else { entries.push({ name, pos: guessPosition(name), excluded: false }); }
        renderChips();
        scheduleAutoSave();
      },
    });
  });
}

/* ---- 添加球员的搜索框：点搜索按钮，在它下方弹出一个更宽一点的悬浮框（带放大动画），
 * 不是整屏弹窗，点框外任意地方或按 Esc 关掉。 ---- */
let activeSearchPrefix = null;
function matchRank(name, q) {
  if (!q) return 0;
  const lower = String(name).toLowerCase(), ql = q.toLowerCase();
  let best = lower.indexOf(ql);
  if (window.pinyinPro && typeof window.pinyinPro.match === 'function') {
    try {
      const r = window.pinyinPro.match(name, q);
      if (r && r.length && (best === -1 || r[0] < best)) best = r[0];
    } catch (e) {}
  }
  return best;
}
function positionRosterSearchPanel(triggerEl) {
  const panel = $('rsPanel');
  const rect = triggerEl.getBoundingClientRect();
  const width = Math.min(Math.max(rect.width * 1.5, 380), window.innerWidth - 32);
  panel.style.width = width + 'px';
  // 默认右对齐（跟按钮右边缘对齐）、往左边展开；两侧都放不下才退而求其次贴边距。
  let left = rect.right - width;
  if (left < 16) left = 16;
  if (left + width > window.innerWidth - 16) left = window.innerWidth - 16 - width;
  panel.style.left = (left + window.scrollX) + 'px';
  panel.style.top = (rect.bottom + window.scrollY + 8) + 'px';
  panel.style.transformOrigin = 'top right';
}
function openRosterSearch(prefix, triggerEl) {
  activeSearchPrefix = prefix;
  $('rsInput').value = '';
  renderRosterSearchResults();
  positionRosterSearchPanel(triggerEl);
  $('rsPanel').classList.add('on');
  setTimeout(() => $('rsInput').focus(), 60);
}
function closeRosterSearch() {
  $('rsPanel').classList.remove('on');
  activeSearchPrefix = null;
}
// 用捕获阶段监听（第三个参数 true）——因为点某条搜索结果会立刻重新渲染
// #rsResults（把刚点的那个节点从 DOM 里换掉），如果用冒泡阶段监听，等事件
// 冒泡到 document 的时候点击的节点已经被换掉/脱离文档了，panel.contains(e.target)
// 会错误地判定为"点在面板外面"，导致选完一个人面板立刻自己关掉。捕获阶段在
// 事件到达目标、触发那次重新渲染之前就先跑完了，不会有这个问题。
document.addEventListener('click', e => {
  const panel = $('rsPanel');
  if (!panel.classList.contains('on')) return;
  if (panel.contains(e.target)) return;
  if (e.target.closest('[data-act="open-roster-search"]')) return;
  closeRosterSearch();
}, true);
// 面板现在是 position:absolute（跟着文档滚动），翻页面的时候不用跟着立刻关掉——
// 只有当面板本身彻底滚出可视区域（完全看不见了）才关掉，滚动过程中面板还在
// 视口里就保持打开、跟着文档一起移动。
window.addEventListener('scroll', () => {
  const panel = $('rsPanel');
  if (!panel.classList.contains('on')) return;
  const r = panel.getBoundingClientRect();
  if (r.bottom < 0 || r.top > window.innerHeight) closeRosterSearch();
}, true);
window.addEventListener('resize', () => { if ($('rsPanel').classList.contains('on')) closeRosterSearch(); });
let rsHighlightIdx = -1;
function rsSelectableEls() { return Array.from($('rsResults').querySelectorAll('.rs-result:not(.selected)')); }
function moveRsHighlight(delta) {
  const els = rsSelectableEls();
  if (!els.length) return;
  rsHighlightIdx = ((rsHighlightIdx + delta) % els.length + els.length) % els.length;
  els.forEach((el, i) => el.classList.toggle('hl', i === rsHighlightIdx));
  els[rsHighlightIdx].scrollIntoView({ block: 'nearest' });
}
function renderRosterSearchResults() {
  const box = $('rsResults');
  const q = $('rsInput').value.trim();
  const board = rosterBoards.get(activeSearchPrefix);
  const already = new Set(board ? Object.values(board.getRoster()).flat() : []);
  let candidates = ALL_PLAYERS.slice();
  if (q) {
    candidates = candidates.map(n => ({ name: n, rank: matchRank(n, q) }))
      .filter(c => c.rank !== -1).sort((a, b) => a.rank - b.rank || a.name.localeCompare(b.name, 'zh'))
      .map(c => c.name);
  }
  // 已经在名单里的球员不再从列表里去掉，而是继续显示、标注"已选择"（灰掉、不能点）。
  let html = candidates.slice(0, 60).map(n => {
    const sel = already.has(n);
    return `<div class="rs-result${sel ? ' selected' : ''}" data-name="${esc(n)}">
      <span>${esc(displayName(n))}</span><span class="rs-pos">${sel ? '已选择' : POS_LABEL[guessPosition(n)]}</span>
    </div>`;
  }).join('');
  if (q && !ALL_PLAYERS.includes(q) && !already.has(q)) {
    html += `<div class="rs-result add-new" data-name="${esc(q)}">+ 添加新名字「${esc(q)}」（不在球员名单里）</div>`;
  }
  box.innerHTML = html || `<div class="rs-empty">没有匹配${q ? '' : '，输入名字/拼音/首字母试试'}</div>`;
  rsHighlightIdx = -1;
  box.querySelectorAll('.rs-result:not(.selected)').forEach(el => el.onclick = () => {
    const b = rosterBoards.get(activeSearchPrefix);
    if (b) b.addPlayer(el.dataset.name);
    $('rsInput').value = '';
    renderRosterSearchResults();
    $('rsInput').focus();
  });
}

/* "生成预览"不再是打印一坨 JSON——直接拿真实的 seasons.html 模板，把
 * <script src="seasons.js"> 换成一段内联脚本、塞进这份还没发布的预览数据，
 * 装进一个 iframe 里，看到的就是发布之后网站会长的真实样子。 */
$('btnPreview').onclick = async () => {
  const box = $('previewBox');
  box.innerHTML = '<div class="hint"><span class="refresh-spin"></span>生成中…</div>';
  try {
    const d = await api('/content/preview');
    const tplRes = await fetch('seasons.html', { cache: 'no-store' });
    if (!tplRes.ok) throw new Error('拿不到 seasons.html 模板（HTTP ' + tplRes.status + '）');
    const tplHtml = await tplRes.text();
    const dataJson = JSON.stringify({ seasons: d.seasons }).replace(/<\/script/gi, '<\\/script');
    const previewSeasonId = JSON.stringify(curSeasonId);
    const injected = `<base href="${location.origin}/"><script>window.SEASON_DATA = ${dataJson}; window.PREVIEW_SEASON_ID = ${previewSeasonId};<\/script>`;
    const withData = tplHtml.replace(/<script\s+src=["']seasons\.js["']\s*>\s*<\/script>/i, injected);
    box.innerHTML = `<div class="preview-frame-wrap"><iframe class="preview-frame" id="previewFrame"
      sandbox="allow-scripts allow-same-origin" title="预览"></iframe></div>`;
    $('previewFrame').srcdoc = withData;
  } catch (e) { box.innerHTML = `<div class="callout err">${esc(e.message)}</div>`; }
};
async function doPublish(btn) {
  const original = btn.textContent;

    toast('已发布，几分钟内网站会更新');
  } catch (e) { toast(e.message, true); }
  finally { btn.disabled = false; btn.textContent = original; }
}

async function reload() {
  const [content, feeData] = await Promise.all([
    api('/content/all'),
    api('/data').catch(() => null), // 球员名单选择器要用；拿不到也不影响其它功能，退化成只能手动加新名字
  ]);
  D = content;
  ALL_PLAYERS = (feeData && Array.isArray(feeData.players)) ? feeData.players : [];
  PLAYER_NUMBER = new Map(
    (feeData && Array.isArray(feeData.codes) ? feeData.codes : [])
      .filter(c => c.number)
      .map(c => [c.name, c.number])
  );
  PLAYER_POS_HISTORY = buildPositionHistory();
  render();
}

/* tabs（赛季信息/名单与比赛/发布上线）用 position:sticky，正常跟着页面滚动，
 * 滚到顶部固定的 topbar 下面时就贴住不再往上滚——sticky 的 top 值要等于
 * topbar 的实际高度，这里量出来写成 CSS 变量，而不是猜一个固定像素数，
 * 这样以后 topbar 的内容/字号变了，这个联动也不用跟着手动改。 */
function syncTopbarHeight() {
  const tb = document.querySelector('.topbar');
  if (tb) document.documentElement.style.setProperty('--topbar-h', tb.offsetHeight + 'px');
}
window.addEventListener('resize', syncTopbarHeight);

async function boot() {
  $('loginScreen').style.display = 'none';
  $('app').classList.add('on');
  syncTopbarHeight();
  $('apiWarn').innerHTML = '<div class="loading">加载中…</div>';
  try {
    await reload();
    $('apiWarn').innerHTML = '';
  } catch (e) {
    $('apiWarn').innerHTML = `<div class="callout err"><b>连不上 API：</b>${esc(e.message)}<br>检查 Worker 是否部署、路由是否配好。</div>`;
  }
}

(async () => {
  await resolveApi();
  if (sessionStorage.getItem(TK)) boot();
})();
</script>

</body>
</html>
