<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>内容管理后台 · Davis Origin</title>
<link rel="icon" type="image/png" href="assets/logo.png" />
<meta name="robots" content="noindex, nofollow" />
<style>
  :root {
    --bg:#f7f5f0; --bg-soft:#fafaf7; --ink:#0a0e1a; --ink-soft:#3d4151;
    --muted:#8a8a92; --line:#e6e2d8; --accent:#1e3a8a; --accent-deep:#0f1d4d;
    --accent-soft:#eaf0fb; --card:#fff;
    --ok:#17795e; --ok-soft:#e6f4ef;
    --warn:#b0762a; --warn-soft:#fbf2e3;
    --danger:#b04646; --danger-soft:#fbeded;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button,input,textarea,select{font-family:inherit;font-size:inherit}
  ::selection{background:var(--accent);color:#fff}

  /* login */
  .login-screen{min-height:100vh;display:grid;place-items:center;padding:24px}
  .login-box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);
    border-radius:20px;padding:40px 36px;text-align:center;box-shadow:0 24px 60px rgba(13,18,36,.07)}
  .login-logo{width:56px;height:56px;object-fit:contain;margin-bottom:20px}
  .login-title{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
  .login-sub{font-size:13px;color:var(--muted);margin-bottom:28px;letter-spacing:.04em}
  .field{text-align:left;margin-bottom:14px}
  .field label{display:block;font-size:11px;font-weight:700;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  .field input,.field textarea,.field select{width:100%;box-sizing:border-box;
    padding:0 14px;height:42px;border:1px solid var(--line);
    border-radius:10px;background:var(--bg-soft);color:var(--ink);font-size:15px;
    transition:border-color .2s,box-shadow .2s,background .2s}
  .field textarea{height:auto;padding:11px 14px;line-height:1.6;resize:vertical}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);background:#fff}
  .field .chk-line{display:flex;align-items:center;gap:8px;height:auto;padding:2px 0}
  .field .chk-line input{width:16px;height:16px;flex:none}
  .field .chk-line span{font-size:13.5px;color:var(--ink-soft)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 22px;
    border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;
    font-weight:600;cursor:pointer;font-size:14px;
    transition:background .2s,transform .2s,box-shadow .2s}
  .btn:hover{background:var(--accent-deep);transform:translateY(-1px);box-shadow:0 8px 18px rgba(30,58,138,.22)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
  .btn.full{width:100%}
  .btn.ghost{background:transparent;color:var(--ink-soft);border-color:var(--line)}
  .btn.ghost:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);box-shadow:none}
  .btn.danger{background:transparent;color:var(--danger);border-color:rgba(176,70,70,.35)}
  .btn.danger:hover{background:var(--danger-soft);border-color:var(--danger);box-shadow:none}
  .btn.ok{background:var(--ok);border-color:var(--ok)}
  .btn.ok:hover{background:#12604a;box-shadow:0 8px 18px rgba(23,121,94,.25)}
  .btn.sm{padding:7px 13px;font-size:12.5px;border-radius:8px}
  .login-err{color:var(--danger);font-size:13px;margin-top:12px;min-height:19px}

  /* shell */
  .app{display:none}.app.on{display:block}
  .topbar{position:sticky;top:0;z-index:40;background:rgba(247,245,240,.9);
    backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)}
  .topbar-inner{max-width:1180px;margin:0 auto;padding:14px 32px;display:flex;
    align-items:center;justify-content:space-between;gap:16px}
  .brand{display:flex;align-items:center;gap:11px}
  .brand img{width:34px;height:34px;object-fit:contain}
  .brand-name{font-size:15px;font-weight:700}
  .brand-tag{font-size:10px;color:var(--accent);background:var(--accent-soft);padding:3px 8px;
    border-radius:5px;letter-spacing:.14em;font-weight:700;margin-left:8px}
  .topbar-actions{display:flex;gap:8px;align-items:center}
  .swap-link{font-size:12.5px;color:var(--muted);margin-right:4px}
  main.wrap{max-width:1180px;margin:0 auto;padding:28px 32px 64px}

  .tabs{display:flex;gap:6px;overflow-x:auto;
    background:#efede9;padding:5px;border-radius:12px;margin-bottom:22px}
  .tab{padding:9px 18px;border:none;background:none;color:var(--muted);font-weight:600;
    cursor:pointer;white-space:nowrap;border-radius:8px;font-size:14px;
    transition:color .2s,background .2s,box-shadow .2s}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--accent);background:#fff;box-shadow:0 2px 6px rgba(13,18,36,.08)}
  .panel{display:none}.panel.on{display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:26px 28px;margin-bottom:18px;box-shadow:0 1px 2px rgba(13,18,36,.03)}
  .card-head{display:flex;justify-content:space-between;align-items:center;gap:14px;
    margin-bottom:20px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .card-title{font-size:16px;font-weight:700;letter-spacing:.01em}
  .card-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .row3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px}
  .row4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}

  .hint{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:6px}
  .callout{background:var(--ok-soft);border:1px solid rgba(23,121,94,.25);border-radius:12px;
    padding:13px 18px;font-size:13px;color:#0f5a45;line-height:1.7;margin-bottom:20px}
  .callout.warn{background:var(--warn-soft);border-color:rgba(176,118,42,.28);color:#7a5518}
  .callout.err{background:var(--danger-soft);border-color:rgba(176,70,70,.28);color:#8a3535}
  .empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}

  /* 赛季选择条 */
  .season-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .season-chip{padding:9px 16px;border:1.5px solid var(--line);border-radius:999px;
    cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-soft);
    background:var(--card);transition:all .18s;display:flex;align-items:center;gap:7px}
  .season-chip:hover{border-color:var(--accent)}
  .season-chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .season-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
  .season-bar-spacer{flex:1}

  .team-block{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px;background:var(--bg-soft)}
  .team-block-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
  .team-block-title{font-size:14.5px;font-weight:700}

  .cat-card{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;background:#fff}
  .cat-card-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
  .cat-card-hd b{font-size:14px}
  .cat-card-hd .hint{margin:0}

  .roster-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .roster-grid .field{margin-bottom:0}
  .roster-grid label{font-size:10px}
  .roster-grid textarea{min-height:90px;font-size:13.5px}

  table.mtx{width:100%;border-collapse:collapse;margin-top:10px}
  table.mtx th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);padding:0 8px 8px;border-bottom:1.5px solid var(--line)}
  table.mtx td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
  table.mtx input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;
    background:var(--bg-soft);font-size:13.5px}
  table.mtx input:focus{outline:none;border-color:var(--accent);background:#fff}
  table.mtx input.score{text-align:center;font-variant-numeric:tabular-nums}
  .mtx-actions{display:flex;gap:6px;white-space:nowrap}

  .order-list{display:flex;flex-direction:column;gap:8px;max-width:420px}
  .order-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);
    border-radius:10px;background:var(--bg-soft)}
  .order-row input{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;background:#fff}
  .order-row .updown{display:flex;gap:4px}
  .order-row .updown button{width:26px;height:26px;border:1px solid var(--line);background:#fff;
    border-radius:6px;cursor:pointer;color:var(--ink-soft)}
  .order-row .updown button:hover{border-color:var(--accent);color:var(--accent)}
  .order-row .updown button:disabled{opacity:.35;cursor:not-allowed}

  .toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);background:var(--ink);
    color:#fff;padding:12px 22px;border-radius:10px;font-size:13.5px;font-weight:500;opacity:0;
    pointer-events:none;transition:all .3s cubic-bezier(.4,0,.2,1);z-index:200;
    box-shadow:0 12px 30px rgba(0,0,0,.2)}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .toast.bad{background:var(--danger)}

  .modal-bg{position:fixed;inset:0;background:rgba(10,14,26,.5);backdrop-filter:blur(3px);
    display:none;place-items:center;z-index:150;padding:24px}
  .modal-bg.on{display:grid;animation:mfade .2s ease}
  @keyframes mfade{from{opacity:0}to{opacity:1}}
  .modal{background:var(--card);border-radius:18px;padding:30px 32px;width:100%;max-width:460px;
    box-shadow:0 30px 70px rgba(0,0,0,.25);max-height:86vh;overflow-y:auto;
    animation:mup .25s cubic-bezier(.4,0,.2,1)}
  @keyframes mup{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
  .modal h3{font-size:19px;font-weight:800;margin-bottom:6px;letter-spacing:-.01em}
  .modal .sub{font-size:13px;color:var(--muted);margin-bottom:22px;line-height:1.6}
  .modal-actions{display:flex;gap:10px;margin-top:22px}
  .modal-err{color:var(--danger);font-size:13px;margin-top:12px;min-height:18px}

  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);
    border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  .refresh-spin{display:inline-block;width:12px;height:12px;
    border:2px solid rgba(30,58,138,.22);border-top-color:var(--accent);
    border-radius:50%;animation:spin .7s linear infinite;vertical-align:-1px;margin-right:5px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading{text-align:center;padding:80px 20px;color:var(--muted)}

  .publish-banner{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-deep) 100%);
    color:#fff;border-radius:18px;padding:26px 30px;margin-bottom:18px;
    display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;
    box-shadow:0 10px 30px rgba(30,58,138,.2)}
  .publish-banner .p-main{font-size:11px;opacity:.75;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
  .publish-banner .p-sub{font-size:13px;opacity:.85;margin-top:6px;max-width:420px;line-height:1.6}
  .publish-banner .btn{background:#fff;color:var(--accent-deep);border-color:#fff}
  .publish-banner .btn:hover{background:#eef1f6;box-shadow:0 8px 18px rgba(0,0,0,.18)}

  pre.preview{background:var(--bg-soft);border:1px solid var(--line);border-radius:12px;
    padding:16px;font-size:12px;line-height:1.6;overflow:auto;max-height:420px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  @media(max-width:860px){
    .topbar-inner,main.wrap{padding-left:16px;padding-right:16px}
    .row2,.row3,.row4,.roster-grid{grid-template-columns:1fr}
    .card{padding:20px 16px}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <img class="login-logo" src="assets/logo.png" alt="" />
    <div class="login-title">内容管理后台</div>
    <div class="login-sub">Davis Origin · 网站正文（赛季 / 名单 / 比赛）</div>
    <form id="loginForm">
      <div class="field">
        <label for="loginPass">管理密码</label>
        <input type="password" id="loginPass" autocomplete="current-password" />
      </div>
      <button class="btn full" type="submit" id="loginBtn">登录</button>
      <div class="login-err" id="loginErr"></div>
    </form>
    <div class="hint">跟训练管理后台用的是同一个密码。</div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img src="assets/logo.png" alt="" />
        <div><span class="brand-name">Davis Origin</span><span class="brand-tag">内容后台</span></div>
      </div>
      <div class="topbar-actions">
        <a class="swap-link" href="admin.html">收费后台 →</a>
        <button class="btn ghost sm" id="btnRefresh">刷新</button>
        <button class="btn ghost sm" id="btnLogout">退出</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="apiWarn"></div>

    <div class="season-bar" id="seasonBar"></div>

    <div class="tabs">
      <button class="tab on" data-tab="season">赛季信息</button>
      <button class="tab" data-tab="content">名单与比赛</button>
      <button class="tab" data-tab="publish">发布上线</button>
    </div>

    <!-- 赛季信息 -->
    <section class="panel on" id="tab-season">
      <div class="card" id="seasonCard"></div>
    </section>

    <!-- 名单与比赛 -->
    <section class="panel" id="tab-content">
      <div id="contentArea"></div>
    </section>

    <!-- 发布 -->
    <section class="panel" id="tab-publish">
      <div class="publish-banner">
        <div>
          <div class="p-main">发布上线</div>
          <div class="p-sub">把上面改的内容生成新的 seasons.js，提交到 GitHub，Cloudflare Pages 会自动重新部署，几分钟内网站就会更新。改了东西之后记得点这个，不点就只是存在后台，网站上看不到。</div>
        </div>
        <button class="btn" id="btnPublish">发布上线</button>
      </div>
      <div class="card">
        <div class="card-head">
          <div><div class="card-title">发布前预览</div><div class="card-sub">看一下生成出来的数据长什么样（不会真的发布）</div></div>
          <button class="btn ghost sm" id="btnPreview">生成预览</button>
        </div>
        <div id="previewBox"><div class="hint">点"生成预览"看看结果。</div></div>
      </div>
    </section>
  </main>
</div>

<!-- 新建赛季弹窗 -->
<div class="modal-bg" id="mSeasonBg">
  <div class="modal">
    <h3>新建赛季</h3>
    <div class="sub">新赛季会自动建好一队/预备队和四个赛事类目的空壳，之后再逐项填。</div>
    <div class="field">
      <label for="nsId">赛季 ID（如 26-27，建好之后不能改）</label>
      <input type="text" id="nsId" placeholder="26-27" />
    </div>
    <div class="field">
      <label for="nsLabel">赛季名称</label>
      <input type="text" id="nsLabel" placeholder="26-27 赛季" />
    </div>
    <div class="field">
      <label class="chk-line"><input type="checkbox" id="nsCurrent" /><span>设为当前赛季（首页显示这一届）</span></label>
    </div>
    <div class="modal-actions">
      <button class="btn ghost full" id="nsCancel" type="button">取消</button>
      <button class="btn full" id="nsSave" type="button">创建</button>
    </div>
    <div class="modal-err" id="nsErr"></div>
  </div>
</div>

<!-- 通用确认弹窗 -->
<div class="modal-bg" id="mConfirmBg">
  <div class="modal" style="max-width:360px">
    <h3 id="cfTitle">确定吗？</h3>
    <div class="sub" id="cfSub"></div>
    <div class="modal-actions">
      <button class="btn ghost full" id="cfCancel" type="button">取消</button>
      <button class="btn danger full" id="cfOk" type="button" style="border-color:var(--danger);background:var(--danger);color:#fff">确定删除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
if (location.protocol === 'http:' && !['localhost', '127.0.0.1'].includes(location.hostname)) {
  location.replace('https://' + location.host + location.pathname + location.search + location.hash);
}

const API_DIRECT = 'https://davisorigin-api.xiaoerliu93.workers.dev';
let API = '/api';

async function resolveApi() {
  if (location.protocol === 'file:' || location.hostname === 'localhost') { API = API_DIRECT; return; }
  try {
    const r = await fetch('/api/health', { cache: 'no-store' });
    if (r.ok) { const d = await r.json(); if (d && d.ok) { API = '/api'; return; } }
  } catch (e) {}
  try {
    const r = await fetch(API_DIRECT + '/health', { cache: 'no-store' });
    if (r.ok) { const d = await r.json(); if (d && d.ok) { API = API_DIRECT; return; } }
  } catch (e) {}
  API = '/api';
}

const TK = 'do_admin_token'; // 跟收费后台共用同一个登录状态
let D = null;                // /content/all 的原始数据
let curSeasonId = null;

const $ = id => document.getElementById(id);
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function toast(msg, bad) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.toggle('bad', !!bad);
  t.classList.add('on');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('on'), 2600);
}

async function api(path, opts = {}) {
  const token = sessionStorage.getItem(TK);
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      'content-type': 'application/json',
      ...(token ? { authorization: 'Bearer ' + token } : {}),
      ...(opts.headers || {}),
    },
  });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401) {
    sessionStorage.removeItem(TK);
    location.reload();
    throw new Error('登录已过期');
  }
  if (!res.ok) throw new Error(data?.error || ('HTTP ' + res.status));
  return data;
}

const POS = ['gk', 'def', 'mid', 'fwd'];
const POS_LABEL = { gk: '门将', def: '后卫', mid: '中场', fwd: '前锋' };
const TEAM_LABEL_FALLBACK = { first: '一队', reserve: '预备队' };

/* ---------- 从原始表数据里按 id 归类，方便渲染 ---------- */
function indexData() {
  const bySeason = {};
  D.seasons.forEach(s => { bySeason[s.id] = { season: s, highlights: [], teams: [] }; });
  D.highlights.forEach(h => { if (bySeason[h.season_id]) bySeason[h.season_id].highlights.push(h); });
  D.highlights.forEach(() => {});
  Object.values(bySeason).forEach(b => b.highlights.sort((a, b2) => a.sort_order - b2.sort_order));

  const teamsById = {};
  D.teams.forEach(t => {
    const roster = { gk: [], def: [], mid: [], fwd: [] };
    D.team_roster.filter(r => r.team_id === t.id).sort((a, b) => a.sort_order - b.sort_order)
      .forEach(r => { if (roster[r.position]) roster[r.position].push(r.player_name); });
    const cats = D.categories.filter(c => c.team_id === t.id).map(c => {
      const catRoster = { gk: [], def: [], mid: [], fwd: [] };
      let hasCatRoster = false;
      D.category_roster.filter(r => r.category_id === c.id).sort((a, b) => a.sort_order - b.sort_order)
        .forEach(r => { if (catRoster[r.position]) { catRoster[r.position].push(r.player_name); hasCatRoster = true; } });
      const matches = D.matches.filter(m => m.category_id === c.id).sort((a, b) => a.sort_order - b.sort_order);
      return { ...c, roster: catRoster, hasCatRoster, matches };
    });
    const orderMap = {};
    D.category_order.forEach(c => { orderMap[c.category_key] = c.sort_order; });
    cats.sort((a, b) => (orderMap[a.category_key] ?? 999) - (orderMap[b.category_key] ?? 999));
    teamsById[t.id] = { ...t, roster, categories: cats };
    if (bySeason[t.season_id]) bySeason[t.season_id].teams.push(teamsById[t.id]);
  });
  Object.values(bySeason).forEach(b => b.teams.sort((a, b2) => (a.team_key === 'first' ? 0 : 1) - (b2.team_key === 'first' ? 0 : 1)));
  return bySeason;
}

function render() {
  const bySeason = indexData();
  if (!curSeasonId || !bySeason[curSeasonId]) {
    curSeasonId = D.seasons.length ? D.seasons[0].id : null;
  }
  renderSeasonBar();
  renderSeasonTab(bySeason);
  renderContentTab(bySeason);
}

function renderSeasonBar() {
  const bar = $('seasonBar');
  bar.innerHTML = '';
  D.seasons.forEach(s => {
    const chip = document.createElement('div');
    chip.className = 'season-chip' + (s.id === curSeasonId ? ' on' : '');
    chip.innerHTML = (s.is_current ? '<span class="dot"></span>' : '') + esc(s.label);
    chip.onclick = () => { curSeasonId = s.id; render(); };
    bar.appendChild(chip);
  });
  const spacer = document.createElement('div');
  spacer.className = 'season-bar-spacer';
  bar.appendChild(spacer);
  const addBtn = document.createElement('button');
  addBtn.className = 'btn ghost sm';
  addBtn.textContent = '+ 新建赛季';
  addBtn.onclick = openNewSeason;
  bar.appendChild(addBtn);
}

/* ===================== 赛季信息 ===================== */
function renderSeasonTab(bySeason) {
  const box = $('seasonCard');
  const b = bySeason[curSeasonId];
  if (!b) { box.innerHTML = '<div class="empty">还没有赛季，先新建一个吧。</div>'; return; }
  const s = b.season;
  box.innerHTML = `
    <div class="card-head">
      <div><div class="card-title">${esc(s.label)}</div><div class="card-sub">ID: ${esc(s.id)}</div></div>
      <button class="btn danger sm" id="btnDelSeason">删除这个赛季</button>
    </div>
    <div class="row2">
      <div class="field"><label>赛季名称</label><input id="sLabel" value="${esc(s.label)}" /></div>
      <div class="field">
        <label class="chk-line" style="height:42px"><input type="checkbox" id="sCurrent" ${s.is_current ? 'checked' : ''} /><span>设为当前赛季（首页/导航默认显示这一届）</span></label>
      </div>
    </div>
    <div class="field"><label>赛季简介（lede，显示在赛季存档页顶部）</label><textarea id="sLede" rows="2">${esc(s.lede || '')}</textarea></div>
    <div class="field">
      <label>赛季亮点（一行一条，显示在首页赛季摘要里）</label>
      <textarea id="sHighlights" rows="4">${esc((b.highlights.map(h => h.text)).join('\n'))}</textarea>
    </div>
    <div class="field chk-line"><input type="checkbox" id="sPlaceholder" ${s.is_placeholder ? 'checked' : ''} /><span>这是个占位赛季（还没有真实数据，页面上会显示"敬请期待"一类的提示）</span></div>
    <button class="btn" id="btnSaveSeason">保存赛季信息</button>
  `;
  $('btnSaveSeason').onclick = async () => {
    const btn = $('btnSaveSeason');
    btn.disabled = true;
    try {
      await api(`/content/seasons/${encodeURIComponent(s.id)}`, {
        method: 'PUT',
        body: JSON.stringify({
          label: $('sLabel').value.trim(),
          lede: $('sLede').value,
          isCurrent: $('sCurrent').checked,
          isPlaceholder: $('sPlaceholder').checked,
        }),
      });
      await api(`/content/highlights/${encodeURIComponent(s.id)}`, {
        method: 'PUT',
        body: JSON.stringify({ highlights: $('sHighlights').value.split('\n').map(x => x.trim()).filter(Boolean) }),
      });
      await reload();
      toast('已保存');
    } catch (e) { toast(e.message, true); }
    finally { btn.disabled = false; }
  };
  $('btnDelSeason').onclick = () => confirmModal(
    '删除赛季「' + s.label + '」？',
    '这个赛季底下的球队、名单、比赛全部会一起删掉，删完发布一次才会在网站上生效，删错了也没法撤销。',
    async () => {
      await api(`/content/seasons/${encodeURIComponent(s.id)}`, { method: 'DELETE' });
      curSeasonId = null;
      await reload();
      toast('已删除');
    }
  );
}

function openNewSeason() {
  $('nsId').value = ''; $('nsLabel').value = ''; $('nsCurrent').checked = false; $('nsErr').textContent = '';
  $('mSeasonBg').classList.add('on');
}
$('nsCancel').onclick = () => $('mSeasonBg').classList.remove('on');
$('nsSave').onclick = async () => {
  const id = $('nsId').value.trim(), label = $('nsLabel').value.trim();
  if (!id) { $('nsErr').textContent = '缺少赛季 ID'; return; }
  if (!label) { $('nsErr').textContent = '缺少赛季名称'; return; }
  const btn = $('nsSave');
  btn.disabled = true;
  try {
    await api('/content/seasons', {
      method: 'POST',
      body: JSON.stringify({ id, label, isCurrent: $('nsCurrent').checked }),
    });
    $('mSeasonBg').classList.remove('on');
    curSeasonId = id;
    await reload();
    toast('赛季已建好，去"名单与比赛"里填内容吧');
  } catch (e) { $('nsErr').textContent = e.message; }
  finally { btn.disabled = false; }
};

/* ===================== 名单与比赛 ===================== */
function rosterTextareas(prefix, roster) {
  return `<div class="roster-grid">` + POS.map(p => `
    <div class="field">
      <label>${POS_LABEL[p]}</label>
      <textarea data-pos="${p}" id="${prefix}_${p}">${esc((roster[p] || []).join('\n'))}</textarea>
    </div>`).join('') + `</div><div class="hint">一行一个名字。</div>`;
}
function readRosterTextareas(prefix) {
  const out = {};
  POS.forEach(p => { out[p] = $(`${prefix}_${p}`).value.split('\n').map(x => x.trim()).filter(Boolean); });
  return out;
}

function matchRowHtml(m, catId) {
  return `<tr data-id="${m.id}">
    <td><input class="m-date" value="${esc(m.match_date)}" placeholder="May 16" /></td>
    <td><input class="m-time" value="${esc(m.match_time || '')}" placeholder="14:00" /></td>
    <td><input class="m-opp" value="${esc(m.opponent_name)}" placeholder="对手名字" /></td>
    <td><input class="m-ds score" type="number" min="0" value="${m.davis_score}" /></td>
    <td>:</td>
    <td><input class="m-os score" type="number" min="0" value="${m.opponent_score}" /></td>
    <td class="mtx-actions">
      <button class="btn ghost sm" data-act="save-match" data-cat="${catId}" data-id="${m.id}">保存</button>
      <button class="btn danger sm" data-act="del-match" data-id="${m.id}">删除</button>
    </td>
  </tr>`;
}
function newMatchRowHtml(catId) {
  return `<tr data-new="${catId}">
    <td><input class="m-date" placeholder="May 16" /></td>
    <td><input class="m-time" placeholder="14:00（可空）" /></td>
    <td><input class="m-opp" placeholder="对手名字" /></td>
    <td><input class="m-ds score" type="number" min="0" placeholder="0" /></td>
    <td>:</td>
    <td><input class="m-os score" type="number" min="0" placeholder="0" /></td>
    <td class="mtx-actions"><button class="btn sm" data-act="add-match" data-cat="${catId}">添加</button></td>
  </tr>`;
}

function categoryCardHtml(cat) {
  return `<div class="cat-card" data-cat="${cat.id}">
    <div class="cat-card-hd">
      <b>${esc(cat.label)}</b>
      <div class="hint">key: ${esc(cat.category_key)}</div>
    </div>
    <div class="row3">
      <div class="field"><label>赛事名称</label><input class="c-label" value="${esc(cat.label)}" /></div>
      <div class="field"><label>场地</label><input class="c-venue" value="${esc(cat.venue || '')}" /></div>
      <div class="field"><label>赛程说明</label><input class="c-schedule" value="${esc(cat.schedule || '')}" /></div>
    </div>
    <div class="field"><label>说明（还没有逐场比分时显示的一句话，比如"赛程待定"）</label><input class="c-note" value="${esc(cat.note || '')}" /></div>
    <button class="btn ghost sm" data-act="save-cat" data-id="${cat.id}">保存赛事信息</button>

    <div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line)">
      <div class="field chk-line"><input type="checkbox" class="c-use-roster" ${cat.hasCatRoster ? 'checked' : ''} /><span>这个赛事单独配一份球员名单（不勾选就跟队伍整体名单一样）</span></div>
      <div class="cat-roster-box" style="${cat.hasCatRoster ? '' : 'display:none'}">
        ${rosterTextareas('catroster_' + cat.id, cat.roster)}
        <button class="btn ghost sm" data-act="save-cat-roster" data-id="${cat.id}">保存专属名单</button>
      </div>
    </div>

    <div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line)">
      <div class="hint" style="margin-bottom:8px">比赛（${cat.matches.length} 场）</div>
      <div style="overflow-x:auto">
        <table class="mtx">
          <thead><tr><th>日期</th><th>时间</th><th>对手</th><th colspan="3">比分（Davis : 对方）</th><th></th></tr></thead>
          <tbody>
            ${cat.matches.map(m => matchRowHtml(m, cat.id)).join('')}
            ${newMatchRowHtml(cat.id)}
          </tbody>
        </table>
      </div>
    </div>
  </div>`;
}

function teamBlockHtml(t) {
  return `<div class="team-block" data-team="${t.id}">
    <div class="team-block-hd">
      <div class="team-block-title">${esc(t.label)}<span class="hint" style="display:inline;margin-left:8px">(${t.team_key === 'first' ? '一队' : '预备队'})</span></div>
    </div>
    <div class="row2">
      <div class="field"><label>队伍名称</label><input class="t-label" value="${esc(t.label)}" /></div>
      <div class="field"><label>说明（这支队伍这赛季完全没数据时的一句话，比如"本赛季暂无预备队"）</label><input class="t-note" value="${esc(t.note || '')}" /></div>
    </div>
    <button class="btn ghost sm" data-act="save-team" data-id="${t.id}">保存队伍信息</button>

    <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--line)">
      <div class="hint" style="margin-bottom:8px">队伍整体名单</div>
      ${rosterTextareas('teamroster_' + t.id, t.roster)}
      <button class="btn ghost sm" style="margin-top:10px" data-act="save-team-roster" data-id="${t.id}">保存整体名单</button>
    </div>

    <div style="margin-top:18px">
      ${t.categories.map(categoryCardHtml).join('')}
    </div>
  </div>`;
}

function renderContentTab(bySeason) {
  const area = $('contentArea');
  const b = bySeason[curSeasonId];
  if (!b) { area.innerHTML = '<div class="card"><div class="empty">先在"赛季信息"里新建一个赛季。</div></div>'; return; }
  area.innerHTML = `<div class="card"><div class="card-head"><div class="card-title">${esc(b.season.label)} · 名单与比赛</div></div>${b.teams.map(teamBlockHtml).join('')}</div>`;

  area.querySelectorAll('[data-act="save-team"]').forEach(btn => btn.onclick = async () => {
    const wrap = btn.closest('.team-block');
    btn.disabled = true;
    try {
      await api(`/content/team-note/${wrap.dataset.team}`, {
        method: 'PUT',
        body: JSON.stringify({ label: wrap.querySelector('.t-label').value.trim(), note: wrap.querySelector('.t-note').value }),
      });
      await reload(); toast('已保存');
    } catch (e) { toast(e.message, true); } finally { btn.disabled = false; }
  });

  area.querySelectorAll('[data-act="save-team-roster"]').forEach(btn => btn.onclick = async () => {
    const teamId = btn.dataset.id;
    btn.disabled = true;
    try {
      await api(`/content/team-roster/${teamId}`, { method: 'PUT', body: JSON.stringify({ roster: readRosterTextareas('teamroster_' + teamId) }) });
      await reload(); toast('已保存');
    } catch (e) { toast(e.message, true); } finally { btn.disabled = false; }
  });

  area.querySelectorAll('[data-act="save-cat"]').forEach(btn => btn.onclick = async () => {
    const wrap = btn.closest('.cat-card');
    btn.disabled = true;
    try {
      await api(`/content/category/${wrap.dataset.cat}`, {
        method: 'PUT',
        body: JSON.stringify({
          label: wrap.querySelector('.c-label').value.trim(),
          venue: wrap.querySelector('.c-venue').value.trim(),
          schedule: wrap.querySelector('.c-schedule').value.trim(),
          note: wrap.querySelector('.c-note').value.trim(),
        }),
      });
      await reload(); toast('已保存');
    } catch (e) { toast(e.message, true); } finally { btn.disabled = false; }
  });

  area.querySelectorAll('.c-use-roster').forEach(chk => chk.onchange = () => {
    chk.closest('.cat-card').querySelector('.cat-roster-box').style.display = chk.checked ? '' : 'none';
  });

  area.querySelectorAll('[data-act="save-cat-roster"]').forEach(btn => btn.onclick = async () => {
    const wrap = btn.closest('.cat-card');
    const use = wrap.querySelector('.c-use-roster').checked;
    btn.disabled = true;
    try {
      const roster = use ? readRosterTextareas('catroster_' + wrap.dataset.cat) : { gk: [], def: [], mid: [], fwd: [] };
      await api(`/content/category-roster/${wrap.dataset.cat}`, { method: 'PUT', body: JSON.stringify({ roster }) });
      await reload(); toast('已保存');
    } catch (e) { toast(e.message, true); } finally { btn.disabled = false; }
  });

  area.querySelectorAll('[data-act="add-match"]').forEach(btn => btn.onclick = async () => {
    const tr = btn.closest('tr');
    const ds = Number(tr.querySelector('.m-ds').value), os = Number(tr.querySelector('.m-os').value);
    btn.disabled = true;
    try {
      await api('/content/matches', {
        method: 'POST',
        body: JSON.stringify({
          categoryId: Number(btn.dataset.cat),
          date: tr.querySelector('.m-date').value.trim(),
          time: tr.querySelector('.m-time').value.trim(),
          opponent: tr.querySelector('.m-opp').value.trim(),
          davisScore: ds, opponentScore: os,
        }),
      });
      await reload(); toast('已添加');
    } catch (e) { toast(e.message, true); } finally { btn.disabled = false; }
  });

  area.querySelectorAll('[data-act="save-match"]').forEach(btn => btn.onclick = async () => {
    const tr = btn.closest('tr');
    btn.disabled = true;
    try {
      await api(`/content/matches/${btn.dataset.id}`, {
        method: 'PUT',
        body: JSON.stringify({
          date: tr.querySelector('.m-date').value.trim(),
          time: tr.querySelector('.m-time').value.trim(),
          opponent: tr.querySelector('.m-opp').value.trim(),
          davisScore: Number(tr.querySelector('.m-ds').value),
          opponentScore: Number(tr.querySelector('.m-os').value),
        }),
      });
      await reload(); toast('已保存');
    } catch (e) { toast(e.message, true); } finally { btn.disabled = false; }
  });

  area.querySelectorAll('[data-act="del-match"]').forEach(btn => btn.onclick = () => confirmModal(
    '删除这场比赛？', '删完发布一次才会在网站上消失，删错了也没法撤销。',
    async () => { await api(`/content/matches/${btn.dataset.id}`, { method: 'DELETE' }); await reload(); toast('已删除'); }
  ));
}

/* ===================== 发布 ===================== */
$('btnPreview').onclick = async () => {
  const box = $('previewBox');
  box.innerHTML = '<div class="hint"><span class="refresh-spin"></span>生成中…</div>';
  try {
    const d = await api('/content/preview');
    box.innerHTML = `<pre class="preview">${esc(JSON.stringify(d.seasons, null, 2))}</pre>`;
  } catch (e) { box.innerHTML = `<div class="callout err">${esc(e.message)}</div>`; }
};
$('btnPublish').onclick = async () => {
  const btn = $('btnPublish');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 发布中…';
  try {
    await api('/content/publish', { method: 'POST' });
    toast('已发布，几分钟内网站会更新');
  } catch (e) { toast(e.message, true); }
  finally { btn.disabled = false; btn.textContent = '发布上线'; }
};

/* ===================== 确认弹窗 ===================== */
let confirmAction = null;
function confirmModal(title, sub, onOk) {
  $('cfTitle').textContent = title;
  $('cfSub').textContent = sub;
  confirmAction = onOk;
  $('mConfirmBg').classList.add('on');
}
$('cfCancel').onclick = () => $('mConfirmBg').classList.remove('on');
$('cfOk').onclick = async () => {
  const fn = confirmAction;
  $('mConfirmBg').classList.remove('on');
  if (fn) { try { await fn(); } catch (e) { toast(e.message, true); } }
};

/* ===================== tabs ===================== */
document.querySelectorAll('.tab').forEach(tab => tab.onclick = () => {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t === tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'tab-' + tab.dataset.tab));
});

/* ===================== 登录 / 启动 ===================== */
$('loginForm').onsubmit = async e => {
  e.preventDefault();
  const btn = $('loginBtn'), errEl = $('loginErr');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 登录中';
  errEl.textContent = '';
  try {
    const r = await fetch(API + '/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: $('loginPass').value }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || '登录失败');
    sessionStorage.setItem(TK, d.token);
    await boot();
  } catch (err) {
    errEl.textContent = err.message.includes('fetch') ? 'API 连不上，检查 Worker 是否已部署' : err.message;
    $('loginPass').value = '';
  } finally { btn.disabled = false; btn.textContent = '登录'; }
};
$('btnLogout').onclick = () => { sessionStorage.removeItem(TK); location.reload(); };
$('btnRefresh').onclick = async () => {
  const btn = $('btnRefresh');
  btn.disabled = true; btn.innerHTML = '<span class="refresh-spin"></span>刷新中';
  try { await reload(); toast('已刷新'); } catch (e) { toast(e.message, true); }
  finally { btn.disabled = false; btn.textContent = '刷新'; }
};

async function reload() {
  D = await api('/content/all');
  render();
}

async function boot() {
  $('loginScreen').style.display = 'none';
  $('app').classList.add('on');
  $('apiWarn').innerHTML = '<div class="loading">加载中…</div>';
  try {
    await reload();
    $('apiWarn').innerHTML = '';
  } catch (e) {
    $('apiWarn').innerHTML = `<div class="callout err"><b>连不上 API：</b>${esc(e.message)}<br>检查 Worker 是否部署、路由是否配好。</div>`;
  }
}

(async () => {
  await resolveApi();
  if (sessionStorage.getItem(TK)) boot();
})();
</script>

</body>
</html>
