<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>球员大名单 · Davis Origin</title>
<link rel="icon" type="image/png" href="assets/logo.png" />
<style>
  :root {
    --bg: #fafaf7;
    --ink: #0d1224;
    --ink-soft: #4a4a55;
    --muted: #8a8a92;
    --line: #e6e6e2;
    --accent: #1e3a8a;
    --accent-deep: #0f1d4d;
    --accent-soft: #eaf0fb;
    --card: #ffffff;
    --pos-gk: #d49a2a;
    --pos-def: #1e3a8a;
    --pos-mid: #1f7a5e;
    --pos-fwd: #b04646;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--accent); color: #fff; }

  /* Topbar */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(250, 250, 247, 0.85);
    backdrop-filter: saturate(180%) blur(12px);
    -webkit-backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; }
  .brand-mark {
    width: 38px; height: 38px;
    object-fit: contain;
    transition: transform .35s cubic-bezier(.4,0,.2,1);
  }
  .brand:hover .brand-mark { transform: rotate(-10deg) scale(1.08); }
  .brand-name { font-size: 16px; }
  .brand-sub { color: var(--muted); font-size: 12px; margin-left: 6px; font-weight: 400; }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 13px;
    color: var(--ink-soft);
    transition: border-color .25s, color .25s, background .25s, transform .25s;
  }
  .back-link:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
    transform: translateX(-2px);
  }

  /* Page hero */
  .page-hero {
    max-width: 1280px;
    margin: 0 auto;
    padding: 72px 32px 32px;
    text-align: center;
  }
  .page-eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 18px;
    animation: fadeInUp .7s ease .1s both;
  }
  .page-title {
    font-size: clamp(34px, 5vw, 56px);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 14px;
    animation: fadeInUp .8s ease .2s both;
  }
  .page-lede {
    color: var(--ink-soft);
    font-size: 16px;
    max-width: 620px;
    margin: 0 auto 36px;
    animation: fadeInUp .8s ease .3s both;
  }

  .history-link {
    display: inline-block;
    margin-bottom: 24px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
  }
  .history-link:hover { text-decoration: underline; }

  /* Position stats */
  .position-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    max-width: 600px;
    margin: 0 auto;
    padding: 24px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    animation: fadeInUp .9s ease .4s both;
  }
  .position-stats .stat {
    text-align: center;
    padding: 0 8px;
    border-right: 1px solid var(--line);
  }
  .position-stats .stat:last-child { border-right: none; }
  .stat-num {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--accent);
    display: block;
    font-variant-numeric: tabular-nums;
  }
  .stat-lbl {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
    display: block;
    letter-spacing: 0.05em;
  }

  /* Filter bar */
  .filter-bar {
    max-width: 1280px;
    margin: 32px auto 24px;
    padding: 0 32px;
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .filter-btn {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 9px 18px;
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all .25s ease;
    font-weight: 500;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .filter-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
  }
  .filter-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 6px 16px rgba(30, 58, 138, 0.2);
  }
  .filter-btn .count {
    display: inline-block;
    font-size: 11px;
    opacity: 0.65;
    font-variant-numeric: tabular-nums;
  }
  .filter-btn.active .count { opacity: 0.85; }

  /* Roster page */
  main.roster-page {
    max-width: 1280px;
    margin: 0 auto;
    padding: 12px 32px 80px;
  }
  .position-group {
    margin-bottom: 48px;
    animation: fadeInUp .8s ease both;
  }
  .position-group[data-position="gk"]  { animation-delay: .50s; --pos: var(--pos-gk); }
  .position-group[data-position="def"] { animation-delay: .58s; --pos: var(--pos-def); }
  .position-group[data-position="mid"] { animation-delay: .66s; --pos: var(--pos-mid); }
  .position-group[data-position="fwd"] { animation-delay: .74s; --pos: var(--pos-fwd); }
  .position-title {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding-bottom: 14px;
    margin-bottom: 18px;
    border-bottom: 2px solid var(--line);
    position: relative;
  }
  .position-title::after {
    content: '';
    position: absolute;
    left: 0; bottom: -2px;
    width: 64px;
    height: 2px;
    background: var(--pos);
    border-radius: 1px;
  }
  .pos-en {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--pos);
    text-transform: uppercase;
  }
  .pos-cn {
    font-size: clamp(22px, 2.6vw, 28px);
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.005em;
  }
  .pos-count {
    margin-left: auto;
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .player-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
  }
  .player-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    text-align: center;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    transition: transform .2s cubic-bezier(.4,0,.2,1),
                border-color .2s ease,
                color .2s ease,
                box-shadow .25s ease;
    position: relative;
    overflow: hidden;
    cursor: default;
  }
  .player-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(30, 58, 138, 0.08) 50%, transparent 100%);
    transform: translateX(-100%);
    transition: transform .6s cubic-bezier(.4,0,.2,1);
    pointer-events: none;
  }
  .player-card:hover {
    transform: translateY(-3px);
    border-color: var(--pos, var(--accent));
    color: var(--pos, var(--accent));
    box-shadow: 0 10px 22px rgba(13, 18, 36, 0.08);
  }
  .player-card:hover::after { transform: translateX(100%); }
  .position-group[data-position="gk"]  .player-card:hover { border-color: var(--pos-gk); color: var(--pos-gk); }
  .position-group[data-position="def"] .player-card:hover { border-color: var(--pos-def); color: var(--pos-def); }
  .position-group[data-position="mid"] .player-card:hover { border-color: var(--pos-mid); color: var(--pos-mid); }
  .position-group[data-position="fwd"] .player-card:hover { border-color: var(--pos-fwd); color: var(--pos-fwd); }

  /* Filtered out */
  .position-group.hidden { display: none; }

  /* Empty season state */
  .roster-empty {
    max-width: 640px;
    margin: 40px auto;
    padding: 56px 30px;
    text-align: center;
    color: var(--muted);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
  }
  .roster-empty-title {
    font-size: 17px;
    color: var(--ink-soft);
    font-weight: 700;
    margin-bottom: 8px;
  }

  /* Footer */
  footer {
    padding: 32px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    background: var(--bg);
    border-top: 1px solid var(--line);
  }
  footer .slogan-cn {
    font-size: 14px;
    color: var(--ink-soft);
    margin-bottom: 8px;
    letter-spacing: 0.08em;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 720px) {
    .topbar-inner { padding: 14px 20px; }
    .back-link { padding: 7px 12px; font-size: 12px; }
    .page-hero { padding: 48px 20px 20px; }
    .position-stats { max-width: 100%; }
    .stat-num { font-size: 24px; }
    .stat-lbl { font-size: 10px; }
    .filter-bar { padding: 0 20px; gap: 6px; }
    .filter-btn { padding: 7px 14px; font-size: 12px; }
    main.roster-page { padding: 8px 20px 60px; }
    .position-group { margin-bottom: 36px; }
    .position-title { gap: 8px; }
    .pos-en { font-size: 11px; letter-spacing: 0.15em; }
    .pos-cn { font-size: 20px; }
    .player-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
    .player-card { font-size: 14px; padding: 12px 12px; }
    .roster-empty { margin: 24px 20px; padding: 40px 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <img class="brand-mark" src="assets/logo.png" alt="Davis Origin Logo" />
      <div>
        <div class="brand-name">Davis Origin<span class="brand-sub">戴维斯原点</span></div>
      </div>
    </a>
    <a class="back-link" href="index.html">← 返回主页</a>
  </div>
</header>

<section class="page-hero">
  <div class="page-eyebrow">Roster · 球员大名单</div>
  <h1 class="page-title">全员阵容</h1>
  <p class="page-lede" id="pageLede">
    Davis Origin · 戴维斯原点足球俱乐部
  </p>
  <a class="history-link" href="seasons.html">→ 想看往届赛季的名单？去"赛季"</a>
  <div class="position-stats" id="positionStats"></div>
</section>

<div class="filter-bar" id="filterBar"></div>

<main class="roster-page" id="rosterMain"></main>

<footer>
  <div class="slogan-cn">岂曰无衣？与子同袍。</div>
  © Davis Origin · 戴维斯原点足球俱乐部 · UC Davis
</footer>

<script src="seasons.js"></script>
<script>
  var POSITION_ORDER = ['gk', 'def', 'mid', 'fwd'];
  var POSITION_META = {
    gk:  { en: 'Goalkeepers', cn: '门将', filterLabel: '门将', statLabel: '门将 GK' },
    def: { en: 'Defenders',   cn: '后场', filterLabel: '后场', statLabel: '后场 DEF' },
    mid: { en: 'Midfielders', cn: '中场', filterLabel: '中场', statLabel: '中场 MID' },
    fwd: { en: 'Forwards',    cn: '前场', filterLabel: '前场', statLabel: '前场 FWD' }
  };

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function(c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  (function() {
    var filterBarEl = document.getElementById('filterBar');
    var mainEl = document.getElementById('rosterMain');
    var statsEl = document.getElementById('positionStats');
    var ledeEl = document.getElementById('pageLede');

    if (!window.SEASON_DATA || !window.SEASON_DATA.seasons || !window.SEASON_DATA.seasons.length) {
      return; // seasons.js 没加载成功就什么都不做，页面保持空白而不是报错
    }
    var seasons = window.SEASON_DATA.seasons;
    var activeFilter = 'all';

    function renderAll() {
      var s = seasons.find(function(x) { return x.current; }) || seasons[0];

      if (s.placeholder && !(s.roster && ['gk','def','mid','fwd'].some(function(p){ return (s.roster[p]||[]).length; }))) {
        ledeEl.textContent = 'Davis Origin · 戴维斯原点足球俱乐部 · ' + s.label + ' 名单整理中';
        statsEl.style.display = 'none';
        filterBarEl.innerHTML = '';
        mainEl.innerHTML =
          '<div class="roster-empty">' +
            '<div class="roster-empty-title">' + escapeHtml(s.label) + ' 的名单还在整理</div>' +
            '<p>整理好之后会显示在这里，敬请期待。</p>' +
          '</div>';
        return;
      }

      statsEl.style.display = '';
      var roster = s.roster || {};
      var total = POSITION_ORDER.reduce(function(sum, p) { return sum + ((roster[p] || []).length); }, 0);

      ledeEl.textContent = 'Davis Origin · 戴维斯原点足球俱乐部 · ' + s.label + ' 共 ' + total + ' 名学生与校友球员，按位置分组、字母排序。';

      statsEl.innerHTML = POSITION_ORDER.map(function(p) {
        return '<div class="stat"><span class="stat-num" style="color: var(--pos-' + p + ');">' +
          (roster[p] || []).length + '</span><span class="stat-lbl">' + POSITION_META[p].statLabel + '</span></div>';
      }).join('');

      filterBarEl.innerHTML = '<button type="button" class="filter-btn' + (activeFilter === 'all' ? ' active' : '') +
        '" data-filter="all">全部 <span class="count">' + total + '</span></button>' +
        POSITION_ORDER.map(function(p) {
          return '<button type="button" class="filter-btn' + (activeFilter === p ? ' active' : '') + '" data-filter="' + p + '">' +
            POSITION_META[p].filterLabel + ' <span class="count">' + (roster[p] || []).length + '</span></button>';
        }).join('');

      mainEl.innerHTML = POSITION_ORDER.filter(function(p) {
        return (roster[p] || []).length > 0;
      }).map(function(p) {
        var players = roster[p] || [];
        var hidden = !(activeFilter === 'all' || activeFilter === p);
        return '<section class="position-group' + (hidden ? ' hidden' : '') + '" data-position="' + p + '">' +
          '<h2 class="position-title">' +
            '<span class="pos-en">' + POSITION_META[p].en + '</span>' +
            '<span class="pos-cn">' + POSITION_META[p].cn + '</span>' +
            '<span class="pos-count">' + players.length + ' 人</span>' +
          '</h2>' +
          '<div class="player-grid">' +
            players.map(function(name) { return '<div class="player-card">' + escapeHtml(name) + '</div>'; }).join('') +
          '</div>' +
        '</section>';
      }).join('');
    }

    filterBarEl.addEventListener('click', function(e) {
      var btn = e.target.closest('.filter-btn');
      if (!btn) return;
      activeFilter = btn.dataset.filter;
      renderAll();
      window.scrollTo({ top: mainEl.offsetTop - 80, behavior: 'smooth' });
    });

    renderAll();
  })();
</script>

</body>
</html>
